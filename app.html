<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>맘캘린더 앱 설치</title>
<meta property="og:title" content="맘캘린더 앱 설치">
<meta property="og:description" content="공구 핫딜 정보 공유 커뮤니티 맘캘린더">
<meta property="og:image" content="https://momcalendar.com/momcal-appicon.png">
<meta name="theme-color" content="#7C54C4">
<link rel="icon" href="momcal-appicon-128.png">
<!-- 친구에게 공유의 「앱 설치」 버튼이 여는 쪽 (2026-11-16).
     아이폰은 앱스토어, 갤럭시는 플레이스토어로 바로 보낸다. 카톡 인앱·PC 처럼 바로 못 가는 곳은 버튼 2개를 보여 준다.
     스토어 주소는 index.html 의 _UPD_STORE_URL 과 같아야 한다. -->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#191F28;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;letter-spacing:-0.02em;line-height:1.45}
.wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px calc(32px + env(safe-area-inset-bottom))}
.ico{width:88px;height:88px;border-radius:22px;display:block}
h1{font-size:22px;font-weight:800;margin:20px 0 6px;text-align:center;word-break:keep-all}
p{font-size:14px;color:#4E5968;margin:0 0 32px;text-align:center;word-break:keep-all}
.btns{width:100%;max-width:360px;display:flex;flex-direction:column;gap:8px}
a.b{display:flex;align-items:center;justify-content:center;height:52px;border-radius:100px;font-size:16px;font-weight:700;text-decoration:none;transition:transform .1s}
a.b:active{transform:scale(.97)}
a.p{background:#7C54C4;color:#fff}
a.s{background:#F6F3FA;color:#6B45B3}
a.t{color:#8B95A1;font-size:14px;font-weight:600;height:44px}
</style>
</head>
<body>
<div class="wrap">
  <img class="ico" src="momcal-appicon.png" alt="맘캘린더">
  <h1>맘캘린더 앱</h1>
  <p>공구 핫딜 정보 공유 커뮤니티</p>
  <div class="btns">
    <a class="b p" id="bIos" href="https://apps.apple.com/kr/app/id6826126083">아이폰 앱 설치</a>
    <a class="b s" id="bAnd" href="https://play.google.com/store/apps/details?id=com.wantsb.momcalendar">갤럭시 앱 설치</a>
    <a class="b t" href="https://momcalendar.com/">웹으로 보기</a>
  </div>
</div>
<script>
(function(){
  var IOS='https://apps.apple.com/kr/app/id6826126083';
  var AND='https://play.google.com/store/apps/details?id=com.wantsb.momcalendar';
  var MARKET='market://details?id=com.wantsb.momcalendar';
  var ua=navigator.userAgent||'';
  var isIos=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1);
  var isAnd=/Android/i.test(ua);
  var bIos=document.getElementById('bIos'), bAnd=document.getElementById('bAnd');
  // 내 기기에 맞는 버튼을 위·보라색으로
  if(isAnd){ bAnd.className='b p'; bIos.className='b s'; bAnd.parentNode.insertBefore(bAnd,bIos); }
  // 한 번만 자동으로 보낸다(뒤로 왔을 때 또 튕기지 않게)
  var went=false; try{ went=sessionStorage.getItem('mc_app_go')==='1'; }catch(_){}
  if(went) return;
  try{ sessionStorage.setItem('mc_app_go','1'); }catch(_){}
  if(isIos) location.href=IOS;
  else if(isAnd) location.href=MARKET;   // 스토어 앱으로. 안 열리면 화면의 버튼(웹 주소)을 누른다
})();
</script>
</body>
</html>
