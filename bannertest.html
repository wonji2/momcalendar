<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>배너 시안 미리보기 · 맘캘린더</title>
<style>
  :root{--main:#7B3FB5;--deep:#602090;--light:#F0E6FA;--coral:#D85A30;--t1:#2b2340;--t2:#8a80a0;--bd:#ECE7F3;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#F4F1F8;font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--t1)}
  .wrap{max-width:480px;margin:0 auto;background:#F4F1F8;min-height:100vh}
  .hd{position:sticky;top:0;z-index:10;background:var(--main);display:flex;align-items:center;justify-content:space-between;padding:13px 16px}
  .hd .logo{color:#fff;font-size:17px;font-weight:800;letter-spacing:.3px}
  .hd .ic{color:#fff;font-size:19px}
  .note{background:#FFF7E6;border:1px solid #F3D48A;color:#7a5b12;font-size:12.5px;line-height:1.6;margin:12px;padding:11px 13px;border-radius:12px}
  .sec-t{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--t1);margin:16px 14px 8px}
  .hot{display:flex;gap:8px;padding:0 14px;overflow-x:auto}
  .hot .c{flex:0 0 116px}
  .hot .th{height:100px;border-radius:12px;background:linear-gradient(135deg,#EADCF8,#D9C2F0)}
  .hot .nm{font-size:12px;font-weight:700;margin:6px 2px 0;line-height:1.3}
  .hot .dt{font-size:11px;color:var(--coral);font-weight:700;margin:2px 2px 0}
  .nbr{display:flex;gap:8px;padding:0 14px;overflow-x:auto}
  .nbr .n{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;width:58px}
  .nbr .av{width:52px;height:52px;border-radius:50%;background:var(--light);border:2px solid var(--main)}
  .nbr .nn{font-size:11px;font-weight:700}
  .slotlbl{font-size:11px;font-weight:800;color:var(--main);background:var(--light);display:inline-block;padding:3px 9px;border-radius:20px;margin:20px 14px 7px}
  .adwrap{padding:0 14px}
  .cardrow{display:flex;gap:10px;padding:12px 14px 4px}
  .cardrow .cd{flex:1;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:9px}
  .cardrow .th{height:82px;border-radius:10px;background:linear-gradient(135deg,#F1EAF9,#E7DBF5)}
  .cardrow .nm{font-size:12.5px;font-weight:700;margin:7px 1px 0}
  .cardrow .dt{font-size:11px;color:#666;margin:3px 1px 0}
  .divlbl{margin:22px 14px 0;padding-top:16px;border-top:1px dashed #D9CDE9;font-size:12px;font-weight:800;color:var(--t2)}
  /* banner variants */
  .b{border-radius:12px;height:46px;display:flex;align-items:center;gap:10px;overflow:hidden}
  .ad{font-size:11px;padding:2px 6px;border-radius:6px}
  .ell{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cta{white-space:nowrap;font-weight:700}
  .A{background:var(--main);padding:0 12px}
  .A .ad{background:rgba(255,255,255,.22);color:#fff}.A .ell{color:#fff;font-size:13.5px;font-weight:700}.A .cta{color:#fff;font-size:12.5px}
  .B{background:#fff;border:1px solid var(--bd);height:54px;padding:0 12px 0 8px}
  .B .thm{width:40px;height:40px;border-radius:9px;background:var(--light);display:flex;align-items:center;justify-content:center;color:var(--main);font-size:18px;flex-shrink:0}
  .B .ell{font-size:13px;font-weight:700}.B .sub{font-size:11px;color:#8a80a0}
  .B .cta{font-size:12px;color:var(--main);background:var(--light);padding:6px 11px;border-radius:16px}
  .C{background:#fff;border:1px solid #E7B7A8;padding:0 12px 0 0}
  .C .bdg{background:var(--coral);color:#fff;font-size:12px;font-weight:700;height:46px;display:flex;align-items:center;padding:0 12px}
  .C .ell{color:var(--t1);font-size:13px;font-weight:700}.C .cta{color:#993C1D;font-size:12px;padding-right:12px}
  .D{background:#fff;border:1px solid #D9C2F0;height:44px;padding:0 12px}
  .D .dot{width:7px;height:7px;border-radius:50%;background:var(--main);flex-shrink:0}
  .D .ell{color:var(--t1);font-size:13px}.D .mini{font-size:11px;color:#b3a9c8}
  .E{background:var(--light);height:34px;border-radius:10px;padding:0 12px}
  .E .ad{background:var(--main);color:#fff;font-size:10px;padding:1px 5px}
  .E .ell{color:#4A2A73;font-size:12px;font-weight:700}
  .F{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--main);border-radius:0 12px 12px 0;padding:0 12px}
  .F .ell{color:var(--t1);font-size:13.5px;font-weight:700}.F .mini{font-size:11px;color:#b3a9c8}.F .cta{color:var(--main);font-size:12.5px}
  .foot{height:60px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><span class="logo">맘캘린더</span><span class="ic">🔍</span></div>

  <div class="note">🧪 <b>배너 시안 미리보기(테스트 전용)</b> · 실제 사이트엔 아직 반영 안 됨.<br>아래로 내리면 A~F 6가지 배너가 <b>실제 피드 안</b>에서 어떻게 보이는지 순서대로 나와요. 마음에 드는 안을 알려주세요.</div>

  <div class="sec-t">🔥 지금 HOT한 공구</div>
  <div class="hot">
    <div class="c"><div class="th"></div><div class="nm">달리테이블 유리용기</div><div class="dt">D-2</div></div>
    <div class="c"><div class="th"></div><div class="nm">부끄 벌꿀고구마</div><div class="dt">오늘오픈</div></div>
    <div class="c"><div class="th"></div><div class="nm">시크드 곰탕</div><div class="dt">진행중</div></div>
  </div>

  <div class="sec-t">⭐ 맘캘린더 이웃셀러</div>
  <div class="nbr">
    <div class="n"><div class="av"></div><div class="nn">이현맘</div></div>
    <div class="n"><div class="av"></div><div class="nn">희야</div></div>
    <div class="n"><div class="av"></div><div class="nn">단맘</div></div>
    <div class="n"><div class="av"></div><div class="nn">채집</div></div>
    <div class="n"><div class="av"></div><div class="nn">부끄</div></div>
  </div>

  <div id="slots"></div>
  <div class="foot"></div>
</div>

<script>
  var TXT='보텔라핏 · 온가족 장건강 케어';
  var variants=[
    {k:'A',lbl:'A · 솔리드 컬러 + 화살표 — 존재감 큼',html:'<div class="b A"><span class="ad">AD</span><span class="ell">'+TXT+'</span><span class="cta">보기 ›</span></div>'},
    {k:'B',lbl:'B · 썸네일형 — 상품 이미지 노출',html:'<div class="b B"><span class="thm">🖼️</span><div class="ell"><div class="ell" style="font-weight:700">보텔라핏 저분자 식이섬유</div><div class="sub">광고 · 온가족 장건강</div></div><span class="cta">보기</span></div>'},
    {k:'C',lbl:'C · 특가 배지 강조 — 클릭유도 큼',html:'<div class="b C"><span class="bdg">특가</span><span class="ell">보텔라핏 기획전 · 최대 40% 할인</span><span class="cta">지금 ›</span></div>'},
    {k:'D',lbl:'D · 미니멀 아웃라인 — 광고티 적음',html:'<div class="b D"><span class="dot"></span><span class="ell">'+TXT+'</span><span class="mini">AD</span><span style="color:#7B3FB5">›</span></div>'},
    {k:'E',lbl:'E · 초슬림 한 줄 — 자리 최소(34px)',html:'<div class="b E"><span class="ad">AD</span><span class="ell">'+TXT+'</span><span style="color:#7B3FB5">›</span></div>'},
    {k:'F',lbl:'F · 좌측 컬러바 — 흰 배경 깔끔 강조 (추천)',html:'<div class="b F"><span class="ell">'+TXT+'</span><span class="mini">광고</span><span class="cta">보기 ›</span></div>'}
  ];
  function card(n,d){return '<div class="cd"><div class="th"></div><div class="nm">'+n+'</div><div class="dt">'+d+'</div></div>';}
  var feed=[['키즈위드 이야기시네마','7/27~7/30'],['꼬메모이 회전책장','진행중'],['라온킴 야채큐브','8/7 오픈'],['프레벨롱 간식모음','오늘마감'],['주니 스텐컵','8/1~8/4'],['뽀로로 텐트','진행중']];
  var html='';
  for(var i=0;i<variants.length;i++){
    html+='<div class="divlbl">'+variants[i].lbl+'</div>';
    html+='<div class="slotlbl">↓ 광고 배너 자리</div>';
    html+='<div class="adwrap">'+variants[i].html+'</div>';
    html+='<div class="cardrow">'+card(feed[i][0],feed[i][1])+card(feed[(i+1)%6][0],feed[(i+1)%6][1])+'</div>';
  }
  document.getElementById('slots').innerHTML=html;
</script>
</body>
</html>
