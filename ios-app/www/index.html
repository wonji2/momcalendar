<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>맘캘린더</title>
<style>
  :root{ --bg:#FAF9FC; --ink:#2A2233; --sub:#7A7286; --brand:#7B3FB5; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:24px calc(24px + env(safe-area-inset-left)) 24px calc(24px + env(safe-area-inset-right));
    -webkit-user-select:none; user-select:none;
  }
  .wrap{max-width:320px}
  .mark{width:76px;height:76px;border-radius:20px;background:var(--brand);margin:0 auto 22px;
        display:flex;align-items:center;justify-content:center;font-size:38px}
  h1{font-size:19px;font-weight:800;margin:0 0 10px;letter-spacing:-.02em}
  p{font-size:14px;line-height:1.65;color:var(--sub);margin:0 0 24px;word-break:keep-all}
  button{
    -webkit-appearance:none;appearance:none;border:0;cursor:pointer;
    background:var(--brand);color:#fff;font-size:15px;font-weight:700;
    padding:14px 30px;border-radius:12px;font-family:inherit;
  }
  button:active{opacity:.82}
  .hint{margin-top:18px;font-size:12px;color:#A9A2B4}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">💜</div>
    <h1>연결을 확인하고 있어요</h1>
    <p>인터넷 연결이 불안정한 것 같아요.<br>Wi-Fi나 데이터를 확인한 뒤 다시 시도해 주세요.</p>
    <button type="button" onclick="location.replace('https://momcalendar.com/')">다시 시도</button>
    <div class="hint">맘캘린더 · momcalendar.com</div>
  </div>
</body>
</html>
