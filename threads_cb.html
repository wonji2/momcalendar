<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>맘캘린더 · 스레드 연결</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 20px;color:#222}code{display:block;word-break:break-all;background:#f3f3f3;padding:14px;border-radius:8px;font-size:15px;margin:14px 0}button{font-size:16px;padding:10px 18px;border-radius:8px;border:0;background:#7c4dff;color:#fff}</style></head>
<body>
<h2>스레드 연결 코드</h2>
<p id="msg">주소에 code 가 없어요. 허용 단계를 다시 해주세요.</p>
<code id="code" hidden></code>
<button id="copy" hidden>코드 복사</button>
<p style="color:#777;font-size:13px">이 코드는 한 번만 쓸 수 있고 몇 분 뒤 만료돼요. 복사해서 <b>node src/threads-auth.js code &lt;코드&gt;</b> 에 붙여넣으면 끝.</p>
<script>
var p=new URLSearchParams(location.search);var c=p.get('code');
if(c){c=c.replace(/#_$/,'');document.getElementById('msg').textContent='허용 완료! 아래 코드를 복사하세요.';var el=document.getElementById('code');el.textContent=c;el.hidden=false;var b=document.getElementById('copy');b.hidden=false;b.onclick=function(){navigator.clipboard.writeText(c).then(function(){b.textContent='복사됨 ✅'})};}
</script>
</body></html>
