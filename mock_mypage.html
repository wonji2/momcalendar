<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>맘캘린더 마이페이지 라이브 목업</title>
<style>
:root {
  --main: #7C54C4;
  --main-light: #F3EFFC;
  --bg: #F5F6F8;
  --card: #FFFFFF;
  --fg: #191F28;
  --muted: #8B95A1;
  --line: #E5E8EB;
  --red: #E53935;
  --radius: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  padding: 0;
  background-color: #E9ECEF;
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  color: var(--fg);
  display: flex;
  justify-content: center;
  min-height: 100vh;
  -webkit-text-size-adjust: 100%;
}
.phone-frame {
  width: 100%;
  max-width: 412px;
  background-color: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}
/* Top Header */
.top-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--card);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
}
.header-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.header-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}
.header-btn {
  background: none;
  border: none;
  padding: 4px;
  cursor: pointer;
  font-size: 19px;
  color: var(--fg);
  display: flex;
  align-items: center;
}

/* Scroll Content */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px 90px;
}

/* Profile Card */
.profile-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px 16px;
  margin-bottom: 14px;
  border: 1px solid rgba(0,0,0,0.04);
}
.profile-user {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}
.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, #9B6FD4, #7C54C4);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  font-weight: 700;
  flex-shrink: 0;
}
.user-info .name {
  font-size: 16.5px;
  font-weight: 700;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.user-info .badge {
  font-size: 10px;
  font-weight: 600;
  background: var(--main-light);
  color: var(--main);
  padding: 2px 7px;
  border-radius: 999px;
}
.user-info .sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px;
}

/* Quick Stats 3 Columns */
.stats-row {
  display: flex;
  background: var(--bg);
  border-radius: 12px;
  padding: 12px 0;
}
.stat-item {
  flex: 1;
  text-align: center;
  cursor: pointer;
}
.stat-item + .stat-item {
  border-left: 1px solid var(--line);
}
.stat-val {
  font-size: 17px;
  font-weight: 700;
  color: var(--main);
}
.stat-lbl {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 2px;
  font-weight: 500;
}

/* Menu Group Card */
.menu-group {
  background: var(--card);
  border-radius: var(--radius);
  margin-bottom: 12px;
  border: 1px solid rgba(0,0,0,0.04);
  overflow: hidden;
}
.group-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  padding: 14px 16px 6px;
  letter-spacing: -0.01em;
}
.menu-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 16px;
  background: none;
  border: none;
  width: 100%;
  text-align: left;
  font-family: inherit;
  font-size: 14.5px;
  font-weight: 500;
  color: var(--fg);
  cursor: pointer;
  border-bottom: 1px solid #F2F4F6;
  transition: background 0.15s;
}
.menu-item:last-child {
  border-bottom: none;
}
.menu-item:active {
  background: #F8F9FA;
}
.menu-item .left {
  display: flex;
  align-items: center;
  gap: 11px;
}
.menu-item .icon {
  font-size: 17px;
  width: 22px;
  display: flex;
  justify-content: center;
}
.menu-item .badge-hot {
  font-size: 10px;
  font-weight: 700;
  background: #FFF1EC;
  color: #FF5722;
  padding: 2px 6px;
  border-radius: 4px;
  margin-left: 6px;
}
.menu-item .right-text {
  font-size: 12.5px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 4px;
}
.menu-item .arrow {
  color: #B0B8C1;
  font-size: 14px;
}

/* App Info & Logout */
.footer-links {
  text-align: center;
  padding: 16px 0 24px;
  font-size: 12px;
  color: var(--muted);
}
.footer-links a {
  color: var(--muted);
  text-decoration: none;
  margin: 0 6px;
}
.app-version {
  margin-top: 6px;
  font-size: 11px;
  color: #B0B8C1;
}

/* Bottom 5-Tab Bar */
.bottom-nav {
  position: sticky;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--line);
  display: flex;
  padding: 7px 4px calc(8px + env(safe-area-inset-bottom, 0px));
  z-index: 100;
}
.nav-btn {
  flex: 1;
  border: none;
  background: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 10.5px;
  font-weight: 600;
  color: #8D8798;
  cursor: pointer;
  padding: 4px 0;
  font-family: inherit;
}
.nav-btn.active {
  color: var(--main);
  font-weight: 700;
}
.nav-btn svg {
  width: 21px;
  height: 21px;
}

/* In-App Bug Report Sheet Modal */
.sheet-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.sheet-overlay.active {
  display: flex;
}
.sheet-modal {
  width: 100%;
  max-width: 412px;
  background: #fff;
  border-radius: 20px 20px 0 0;
  padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
  box-sizing: border-box;
  animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.sheet-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.sheet-title {
  font-size: 16.5px;
  font-weight: 700;
  color: var(--fg);
}
.sheet-close {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--muted);
  padding: 4px;
}
.form-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--fg);
  margin-bottom: 6px;
  display: block;
}
.report-input {
  width: 100%;
  height: 90px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font-family: inherit;
  font-size: 13.5px;
  resize: none;
  outline: none;
  box-sizing: border-box;
  background: #F8F9FA;
}
.report-input:focus {
  border-color: var(--main);
  background: #fff;
}
.photo-uploader {
  display: flex;
  gap: 10px;
  margin: 12px 0 16px;
  align-items: center;
}
.upload-btn {
  width: 68px;
  height: 68px;
  border: 1px dashed #B0B8C1;
  border-radius: 10px;
  background: #F8F9FA;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
}
.upload-btn span { font-size: 18px; }
.photo-preview {
  width: 68px;
  height: 68px;
  border-radius: 10px;
  background: #E5E8EB;
  display: none;
  position: relative;
  overflow: hidden;
}
.photo-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.photo-preview .del-btn {
  position: absolute;
  top: 3px;
  right: 3px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 16px;
  height: 16px;
  font-size: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.submit-btn {
  width: 100%;
  background: var(--main);
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 13px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.submit-btn:active {
  background: #6A44AF;
}
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(25, 31, 40, 0.92);
  color: #fff;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  display: none;
  z-index: 2000;
  animation: fadeIn 0.2s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<div class="phone-frame">
  <!-- 상단 헤더: 삼지창 햄버거 버튼 영구 제거! 토스처럼 극도로 심플 -->
  <div class="top-header">
    <div class="header-title">내정보</div>
    <div class="header-actions">
      <button class="header-btn" onclick="alert('알림함 열기')" aria-label="알림">🔔</button>
      <button class="header-btn" onclick="alert('찜 목록 열기')" aria-label="찜">💜</button>
    </div>
  </div>

  <div class="content">
    <!-- 1. 프로필 요약 카드 -->
    <div class="profile-card">
      <div class="profile-user">
        <div class="avatar">지</div>
        <div class="user-info">
          <div class="name">원지선 님 <span class="badge">맘캘러</span></div>
          <div class="sub">카카오 계정으로 로그인됨</div>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-item" onclick="showToast('찜한 공구 목록으로 이동')">
          <div class="stat-val">12</div>
          <div class="stat-lbl">내 찜 공구</div>
        </div>
        <div class="stat-item" onclick="showToast('키워드 알림 관리로 이동')">
          <div class="stat-val">3</div>
          <div class="stat-lbl">알림 키워드</div>
        </div>
        <div class="stat-item" onclick="showToast('내 공구 캘린더로 이동')">
          <div class="stat-val">4</div>
          <div class="stat-lbl">참여 일정</div>
        </div>
      </div>
    </div>

    <!-- 2. 내 활동 & 일정 -->
    <div class="menu-group">
      <div class="group-title">내 활동 & 일정</div>
      <button class="menu-item" onclick="showToast('내 공구 캘린더가 열립니다')">
        <div class="left"><span class="icon">📅</span><span>내 공구 캘린더</span></div>
        <span class="arrow">›</span>
      </button>
      <button class="menu-item" onclick="showToast('매일 출석체크 완료! 💜')">
        <div class="left"><span class="icon">💜</span><span>매일 출석체크</span></div>
        <div class="right-text"><span>오늘 미완료</span><span class="arrow">›</span></div>
      </button>
      <button class="menu-item" onclick="showToast('키워드 알림 설정 창 오픈')">
        <div class="left"><span class="icon">🔔</span><span>키워드 알림 설정</span></div>
        <div class="right-text"><span>기저귀 외 2건</span><span class="arrow">›</span></div>
      </button>
      <button class="menu-item" onclick="showToast('폰 캘린더(구글/애플) 저장 안내')">
        <div class="left"><span class="icon">📥</span><span>내 폰 캘린더 저장</span></div>
        <span class="arrow">›</span>
      </button>
    </div>

    <!-- 3. 고객지원 & 제보 (⭐ 방금 나눈 혁신 아이디어!) -->
    <div class="menu-group">
      <div class="group-title">고객지원 & 제보</div>
      <button class="menu-item" onclick="openBugSheet()">
        <div class="left">
          <span class="icon">🛠️</span>
          <span>건의 · 오류 제보</span>
          <span class="badge-hot">1초 간편</span>
        </div>
        <div class="right-text"><span>사진 바로 첨부</span><span class="arrow">›</span></div>
      </button>
      <button class="menu-item" onclick="showToast('셀러 입점/제휴 문의 창')">
        <div class="left"><span class="icon">🤝</span><span>셀러 입점 · 제휴 문의</span></div>
        <span class="arrow">›</span>
      </button>
      <button class="menu-item" onclick="showToast('친구에게 맘캘 링크 복사 완료!')">
        <div class="left"><span class="icon">🔗</span><span>친구에게 맘캘 추천하기</span></div>
        <span class="arrow">›</span>
      </button>
      <button class="menu-item" onclick="showToast('맘캘린더 소개 보기')">
        <div class="left"><span class="icon">📖</span><span>맘캘린더 소개 & 이용가이드</span></div>
        <span class="arrow">›</span>
      </button>
    </div>

    <!-- 4. 계정 관리 -->
    <div class="menu-group">
      <button class="menu-item" onclick="confirm('로그아웃 하시겠습니까?')">
        <div class="left"><span class="icon">🚪</span><span>로그아웃</span></div>
      </button>
      <button class="menu-item" onclick="confirm('정말 탈퇴하시겠습니까? 찜한 데이터가 삭제됩니다.')" style="color:#8B95A1;">
        <div class="left"><span class="icon">⚠️</span><span style="font-size:13.5px;">회원 탈퇴</span></div>
      </button>
    </div>

    <!-- 하단 약관 & 버전 -->
    <div class="footer-links">
      <a href="#" onclick="alert('이용약관');return false;">이용약관</a> · 
      <a href="#" onclick="alert('개인정보처리방침');return false;">개인정보처리방침</a>
      <div class="app-version">맘캘린더 앱 v1.2.0 (최신 버전)</div>
    </div>
  </div>

  <!-- 하단 5단 바텀 네비게이션 (mockapp.html 원본 SVG 100% 장착) -->
  <nav class="bottom-nav">
    <button class="nav-btn" onclick="selectTab(this, '공구')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
      <span>공구</span>
    </button>
    <button class="nav-btn" onclick="selectTab(this, '핫딜')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5"/></svg>
      <span>핫딜</span>
    </button>
    <button class="nav-btn" onclick="selectTab(this, '세일')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a4 4 0 0 1-8 0"/><path d="M3.103 6.034h17.794"/><path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"/></svg>
      <span>세일</span>
    </button>
    <button class="nav-btn" onclick="selectTab(this, '커뮤니티')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
      <span>커뮤니티</span>
    </button>
    <button class="nav-btn active" onclick="selectTab(this, '마이')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>마이</span>
    </button>
  </nav>
</div>

<!-- 건의/오류 1초 인앱 제보 바텀시트 모달 -->
<div class="sheet-overlay" id="bugSheetOverlay" onclick="if(event.target===this) closeBugSheet()">
  <div class="sheet-modal">
    <div class="sheet-header">
      <div class="sheet-title">🛠️ 건의 · 오류 제보</div>
      <button class="sheet-close" onclick="closeBugSheet()" aria-label="닫기">✕</button>
    </div>
    <span class="form-label">어떤 점이 불편하셨나요?</span>
    <textarea class="report-input" id="reportText" placeholder="예: 핫딜 가격이 사진이랑 달라요, 글자가 조금 겹쳐 보여요"></textarea>
    
    <span class="form-label" style="margin-top:12px;">화면 캡처 사진 첨부 (선택)</span>
    <div class="photo-uploader">
      <label class="upload-btn" for="photoFile">
        <span>📷</span>
        <span>사진 선택</span>
      </label>
      <input type="file" id="photoFile" accept="image/*" style="display:none;" onchange="handlePhotoSelect(this)">
      <div class="photo-preview" id="photoPreview">
        <img id="previewImg" src="" alt="미리보기">
        <button class="del-btn" onclick="removePhoto()" aria-label="삭제">✕</button>
      </div>
    </div>

    <button class="submit-btn" onclick="submitBugReport()">
      <span>🚀 1초 만에 제보하기</span>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2000);
}

function selectTab(btn, name) {
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.remove('active');
    b.querySelector('svg').setAttribute('stroke-width', '1.9');
  });
  btn.classList.add('active');
  btn.querySelector('svg').setAttribute('stroke-width', '2.3');
  showToast(`[${name}] 탭으로 전환`);
}

function openBugSheet() {
  document.getElementById('bugSheetOverlay').classList.add('active');
}
function closeBugSheet() {
  document.getElementById('bugSheetOverlay').classList.remove('active');
}

function handlePhotoSelect(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('previewImg').src = e.target.result;
      document.getElementById('photoPreview').style.display = 'block';
    }
    reader.readAsDataURL(input.files[0]);
  }
}

function removePhoto() {
  document.getElementById('photoFile').value = '';
  document.getElementById('photoPreview').style.display = 'none';
}

function submitBugReport() {
  const text = document.getElementById('reportText').value.trim();
  if (!text) {
    alert('제보 내용을 입력해주세요!');
    return;
  }
  closeBugSheet();
  showToast('제보가 등록되었습니다! 클코 수리 파이프라인 가동 🚀');
  document.getElementById('reportText').value = '';
  removePhoto();
}
</script>

</body>
</html>
