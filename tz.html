<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>글자 진단</title>
<style>body{font:16px/1.5 sans-serif;margin:16px;color:#191F28}pre{white-space:pre-wrap;word-break:break-all;background:#F6F3FA;padding:12px;border-radius:10px;font-size:13px}.p{font-size:100px;line-height:1;position:absolute;left:-9999px;white-space:nowrap}</style></head><body>
<h3>글자 진단 (이 화면을 캡처해 보내주세요)</h3><div class="p" id="a">가가가가가</div><div id="b" style="font-size:16px;display:inline-block">가가가가가가가가가가가가가가가가가가가가</div><pre id="o"></pre>
<script>
var a=document.getElementById('a'),b=document.getElementById('b'),r=a.getBoundingClientRect(),vv=window.visualViewport||{};
var o=['UA: '+navigator.userAgent,'innerWidth: '+innerWidth,'outerWidth: '+outerWidth,'screen.width: '+screen.width,'dpr: '+devicePixelRatio,'vv.scale: '+vv.scale,'vv.width: '+vv.width,
'100px 높이: '+r.height+' / 너비5자: '+r.width,'16px 20자 너비: '+b.getBoundingClientRect().width,'computed 16px: '+getComputedStyle(b).fontSize,'mc_tz(index 기록): '+(function(){try{return localStorage.getItem('mc_tz')}catch(e){return 'x'}})(),
'body 계산: '+getComputedStyle(document.body).fontSize,'textSizeAdjust: '+(getComputedStyle(document.body).webkitTextSizeAdjust||'')];
document.getElementById('o').textContent=o.join('\n');
</script></body></html>
