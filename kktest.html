<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>맘캘린더 · 카카오 로그인 테스트</title>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#F5F2FA;color:#2A2140}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh}
  .tb{height:54px;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;color:#602090;font-size:16px;border-bottom:1px solid #EEE8F6}
  .note{margin:14px;padding:12px 14px;background:#FFF6DF;border:1px solid #F5E4A8;border-radius:12px;font-size:12.5px;color:#7A5B00;line-height:1.6}
  .cards{padding:12px;display:flex;flex-direction:column;gap:10px}
  .card{background:#fff;border-radius:14px;padding:11px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 4px rgba(80,40,120,.07)}
  .thumb{width:46px;height:46px;border-radius:10px;background:#EADFF6;flex-shrink:0}
  .info{flex:1;min-width:0}
  .nm{font-size:13.5px;font-weight:700}
  .dt{font-size:11px;color:#9B8FB3;margin-top:3px}
  .hb{width:46px;height:46px;flex-shrink:0;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:12px}
  #result{display:none;margin:14px;padding:16px;background:#fff;border-radius:14px;font-size:14px;line-height:1.7;box-shadow:0 1px 4px rgba(80,40,120,.1)}
  #log{margin:14px;font-size:11px;color:#aaa;white-space:pre-wrap;word-break:break-all}
  .sheetbg{display:none;position:fixed;inset:0;background:rgba(20,10,30,.5);z-index:990}
  .sheet{position:fixed;left:50%;transform:translateX(-50%);width:min(480px,100%);bottom:-110%;background:#fff;border-radius:22px 22px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom));z-index:991;transition:bottom .32s cubic-bezier(.4,0,.2,1)}
  .kkheart{width:46px;height:46px;border-radius:13px;background:#F3E8FC;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
  .kktitle{text-align:center;font-size:17px;font-weight:700;color:#232326;margin-bottom:14px}
  .kkbenefit{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:16px}
  .kkrow{display:inline-flex;align-items:center;gap:8px}
  .kkrow span{font-size:12.5px;color:#555}
  .kkbtn{width:100%;background:#FEE500;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;color:#191600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .kkclose{text-align:center;font-size:12px;color:#aaa;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="tb">💜 맘캘린더 · 로그인 테스트</div>
  <div class="note">🧪 <b>테스트 전용 페이지</b>예요 (실제 사이트 아님). 아래 하트를 눌러 카카오 로그인 흐름을 확인하세요.</div>

  <div id="result"></div>

  <div class="cards" id="cards"></div>
  <div id="log"></div>

  <div class="sheetbg" id="bg" onclick="closeS()"></div>
  <div class="sheet" id="sh">
    <div class="kkheart"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 20.3l-1.3-1.2C6 14.9 3 12.2 3 8.9 3 6.3 5 4.3 7.6 4.3c1.4 0 2.8.7 3.7 1.8l.7.8.7-.8c.9-1.1 2.3-1.8 3.7-1.8C19 4.3 21 6.3 21 8.9c0 3.3-3 6-6.7 10.2L12 20.3z" fill="#7B3FB5"/></svg></div>
    <div class="kktitle">찜하고 알림 받기</div>
    <div class="kkbenefit">
      <div class="kkrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7B3FB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5a2 2 0 1 1 4 0 7 7 0 0 1 4 6v3a4 4 0 0 0 2 3H4a4 4 0 0 0 2-3v-3a7 7 0 0 1 4-6"/><path d="M9 17v1a3 3 0 0 0 6 0v-1"/></svg><span>오픈일마다 알림으로 알려드려요</span></div>
      <div class="kkrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7B3FB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="4" width="10" height="16" rx="1"/><path d="M11 5h2M12 17v.01"/></svg><span>기기를 바꿔도 찜이 유지돼요</span></div>
    </div>
    <button class="kkbtn" onclick="startKakaoLogin()"><svg width="19" height="19" viewBox="0 0 24 24"><path d="M12 3.2C6.9 3.2 2.8 6.5 2.8 10.5c0 2.6 1.7 4.9 4.3 6.2-.2.7-.7 2.5-.8 2.9-.1.5.2.5.4.4.2-.1 2.5-1.7 3.5-2.4.6.1 1.2.1 1.8.1 5.1 0 9.2-3.3 9.2-7.3S17.1 3.2 12 3.2z" fill="#191600"/></svg>카카오로 1초 시작</button>
    <div class="kkclose" onclick="closeS()">닫기</div>
  </div>
</div>

<script>
  var JS_KEY='04a73b2b11a54e8c11be73309e1b217c';
  var REDIRECT='https://momcalendar.com/kktest.html';
  var FN='https://hycaqsqeogjtbscmzrtm.supabase.co/functions/v1/kakao-auth';
  var ANON='sb_publishable_u4hR4mdNTSss3kdjFH6R5Q_iuJ2MuGE';
  function log(s){ var el=document.getElementById('log'); el.textContent += s + '\n'; }
  try{ if(window.Kakao && !Kakao.isInitialized()) Kakao.init(JS_KEY); log('Kakao SDK init: '+(window.Kakao? Kakao.isInitialized() : 'SDK 없음')); }catch(e){ log('init 오류 '+e); }

  function deviceId(){ var d=localStorage.getItem('mc_did'); if(!d){ d='test-'+Math.random().toString(36).slice(2); localStorage.setItem('mc_did',d);} return d; }
  function hsvg(on){return '<svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 20.3l-1.3-1.2C6 14.9 3 12.2 3 8.9 3 6.3 5 4.3 7.6 4.3c1.4 0 2.8.7 3.7 1.8l.7.8.7-.8c.9-1.1 2.3-1.8 3.7-1.8C19 4.3 21 6.3 21 8.9c0 3.3-3 6-6.7 10.2L12 20.3z" fill="'+(on?'#7B3FB5':'none')+'" stroke="'+(on?'#7B3FB5':'#C9BBDF')+'" stroke-width="1.8"/></svg>';}
  var DATA=[['룰루맘 유기농 이유식','7/27~7/30'],['또또맘 아기간식모음전','7/27~8/1'],['킨즈 창의력 블럭','7/28~7/31']];
  var wrap=document.getElementById('cards');
  DATA.forEach(function(d){var c=document.createElement('div');c.className='card';
    c.innerHTML='<div class="thumb"></div><div class="info"><div class="nm">'+d[0]+'</div><div class="dt">📅 '+d[1]+'</div></div><button class="hb" data-on="0" onclick="tapHeart(this)">'+hsvg(false)+'</button>';
    wrap.appendChild(c);});
  function tapHeart(btn){var on=btn.getAttribute('data-on')==='1';on=!on;btn.setAttribute('data-on',on?'1':'0');btn.innerHTML=hsvg(on);if(on)openS();}
  function openS(){document.getElementById('bg').style.display='block';document.getElementById('sh').style.bottom='0';}
  function closeS(){document.getElementById('bg').style.display='none';document.getElementById('sh').style.bottom='-110%';}
  function startKakaoLogin(){
    if(!window.Kakao){ alert('카카오 SDK 로딩 중이에요. 잠시 후 다시.'); return; }
    if(!Kakao.isInitialized()) Kakao.init(JS_KEY);
    log('authorize 호출 → 카카오로 이동');
    Kakao.Auth.authorize({ redirectUri: REDIRECT, scope: 'profile_nickname' });
  }
  function showResult(html){ var el=document.getElementById('result'); el.innerHTML=html; el.style.display='block'; }

  // 로그인 후 돌아왔을 때: ?code 처리
  (function(){
    var p=new URLSearchParams(location.search);
    var code=p.get('code'), err=p.get('error');
    if(err){ showResult('❌ 카카오 오류: '+err+'<br>'+(p.get('error_description')||'')); return; }
    if(!code) return;
    showResult('⏳ 로그인 처리 중...');
    log('code 받음, Edge Function 호출');
    fetch(FN,{ method:'POST', headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON},
      body:JSON.stringify({ code: code, redirect_uri: REDIRECT, device_id: deviceId() }) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        log('응답: '+JSON.stringify(d));
        if(d.ok){ showResult('✅ <b>로그인 성공!</b><br><br>닉네임: <b>'+(d.nickname||'(없음)')+'</b><br>카카오ID: '+d.kakao_id+'<br><br>👉 members 테이블에 저장 완료됐어요.'); }
        else{ showResult('❌ 실패<br><span style="font-size:12px">'+JSON.stringify(d)+'</span>'); }
        try{ history.replaceState({},'',REDIRECT); }catch(_){}
      })
      .catch(function(e){ log('fetch 오류: '+e); showResult('❌ 통신 오류: '+e); });
  })();
</script>
</body>
</html>
