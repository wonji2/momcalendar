# ③ 검색창에 「파스퇴르」 → 결과에 파스퇴르 공구
appId: ${APP_ID}
---
- runFlow: ../common/start.yaml
# 검색창(흐린 안내 글씨는 아이폰에서 안 읽혀 자리로 누른다 — 상단 보라 머리글 안 흰 칸)
- tapOn:
    point: "50%,15%"
- inputText: "파스퇴르"
- pressKey: Enter
- extendedWaitUntil:
    visible: ".*파스퇴르.*우유.*"
    timeout: 15000
- takeScreenshot: 03_search
