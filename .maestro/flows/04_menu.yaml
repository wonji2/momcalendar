# ④ 왼쪽 위 메뉴(☰)가 열리고, 맨 위가 상태바에 가리지 않는다(머리글 「맘캘린더」·카카오 시작 버튼이 보인다)
appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible: "브랜드, 상품명 검색"
    timeout: 30000
- tapOn:
    point: "8%,8%"
- extendedWaitUntil:
    visible: ".*카카오로 시작하기.*|.*로그아웃.*"
    timeout: 10000
- assertVisible: ".*출석 체크.*"
- takeScreenshot: 04_menu
