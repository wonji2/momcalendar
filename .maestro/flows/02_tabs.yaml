# ② 위 탭: 핫딜 → 세일/라방 → 공구 로 돌아오기
appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible: "브랜드, 상품명 검색"
    timeout: 30000
- scrollUntilVisible:
    element: "핫딜"
    direction: DOWN
    timeout: 20000
- tapOn: "핫딜"
- extendedWaitUntil:
    visible: ".*[0-9,]+원.*"
    timeout: 15000
- takeScreenshot: 02_hotdeal
- tapOn: ".*세일.*"
- extendedWaitUntil:
    visible: ".*세일.*"
    timeout: 15000
- takeScreenshot: 02_sale
- tapOn: "공구"
