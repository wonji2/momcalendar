# ② 위 탭: 핫딜 → 세일/라방 → 공구 로 돌아오기
# ⏸ B안(카드 나눠 그리기) 전까지 보류 — 글자로 탭을 찾아야 해서 지금 화면 목록 크기로는 못 돈다(2026-10-26)
appId: ${APP_ID}
---
- runFlow: ../common/start.yaml
- scrollUntilVisible:
    element: "핫딜"
    direction: DOWN
    timeout: 20000
- tapOn: "핫딜"
- extendedWaitUntil:
    visible: ".*[0-9,]+원.*"
    timeout: 15000
- takeScreenshot: 02_hotdeal
- tapOn: ".*세일.*"
- extendedWaitUntil:
    visible: ".*세일.*"
    timeout: 15000
- takeScreenshot: 02_sale
- tapOn: "공구"
