# 모든 흐름의 시작: 앱을 켜고 처음 켤 때 뜨는 것(알림 허용창·소개 화면·관심 분류)을 넘겨 목록까지 간다
# ⚠ 2026-10-26 확정: 첫 화면이 카드 2,800개를 한꺼번에 그려 화면 목록(접근성 트리)이 22MB 라
#   안드는 Maestro 가 목록을 못 받고(gRPC 4MB 한도), 아이폰은 웹 글자가 목록에서 빠진다.
#   → 글자로 찾지 않고 「자리」로 누른다(자리는 test-app.html 을 412x915·390x844 로 재서 정함, 안드는 상태바 5.3%·아래 막대 2.6% 보정).
#   카드를 나눠 그리게 되면(B안) 글자 찾기로 되돌린다 — 그때 쓸 흐름은 .maestro/later/
appId: ${APP_ID}
---
- launchApp
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      platform: Android
    commands:
      # 폰 시스템 알림 허용창 「Allow」
      - tapOn:
          point: "50%,55%"
          retryIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 3000
      # 소개 화면 「다음」×6 + 「시작하기」(오른쪽 아래)
      - repeat:
          times: 7
          commands:
            - tapOn:
                point: "67%,93%"
                retryIfNoChange: false
            - waitForAnimationToEnd:
                timeout: 2000
      # 관심 분류 「건너뛰기」
      - tapOn:
          point: "50%,38%"
          retryIfNoChange: false
- waitForAnimationToEnd:
    timeout: 8000
