<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>맘캘린더 핫딜로 이동 중…</title>
<!--
  핫딜 단축 링크 (2026-09-01, 사장님 지시로 만든 카페 자동 발행용)

  왜 필요했나: 네이버 카페는 **짧은 주소만 자동 링크**로 바꿔준다.
    제휴 링크(click.linkprice.com/…tu=…%3F…, link.coupang.com/re/…)는 너무 길어서
    글에 그대로 적으면 글자로만 남고 눌리지 않는다(첫 발행 실측: 32개 중 16개만 링크됨).
  그래서 카페 글에는 `momcalendar.com/go.html?id=123` 만 싣고, 이 페이지가 진짜 구매 링크로 보낸다.

  ⚠ 이 페이지는 hotdeals 의 link 만 읽어 이동시킨다. 다른 일은 하지 않는다.
  ⚠ noindex — 검색 노출 대상이 아니다.
-->
<style>
  body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:'Noto Sans KR',-apple-system,sans-serif;background:#FAF8FC;color:#3B3546;gap:14px}
  .sp{width:34px;height:34px;border:3px solid #E5DCF0;border-top-color:#7B3FB5;border-radius:50%;
      animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .t{font-size:14px;font-weight:700}
  .s{font-size:12px;color:#9A93A6}
  a{color:#7B3FB5;font-size:13px;font-weight:700;margin-top:6px}
</style>
</head>
<body>
  <div class="sp"></div>
  <div class="t">상품 페이지로 이동 중이에요</div>
  <div class="s" id="msg">잠시만 기다려 주세요</div>
  <a href="https://momcalendar.com" id="home" style="display:none">맘캘린더로 가기</a>
<script>
// ── 🛟 데이터 서버 우회로 (2026-09-22 회원 제보 · v2 검증자 지적 시정 · v3 이미지·경로 기록 · 09-24 첫 시도 15초로: 사장님 결정) ──
// 일부 손님 망(공유기 DNS 필터·보안앱·통신사)이 supabase.co 를 통째로 막는다. 그러면 배너·공구목록·로그인·기록이 전부 죽는데
// 우리 쪽엔 아무 흔적도 안 남는다. 사이트의 모든 서버 호출이 fetch 라서 fetch 하나만 감싼다:
//   ① 먼저 가는 길(직행 supabase.co, 우회로를 기억 중이면 우회로)로 보낸다 → 망 오류·15초 무응답·5xx 면
//   ② 다른 길(api.momcalendar.com = 같은 서버로 가는 우리 도메인 Worker / 또는 직행)로 다시 보낸다 (15초 제한)
//   ③ 다른 길이 5xx 아니게 답하면 그 길을 6시간 기억(mc_api_base — 직행이면 기억 삭제)하고 net_fallback 이벤트로 남겨 원인을 센다
//   ④ 둘 다 안 되면 첫 결과(오류·응답)를 그대로 돌려준다 → 호출부의 기존 폴백(캐시·안내)이 이어받는다
//   ⑤ mcApiSrc(url): <img>·CSS 배경은 fetch 가 아니라 감싸기 밖 → 우회로를 기억 중이면 supabase.co 이미지 주소를 우회로로 바꿔 준다
// ⚠ kakao-auth(카카오 인가코드 교환)는 **1회용**이라 시간제한·중단 재시도를 걸지 않는다 — 끊고 다시 보내면 서버가 이미 쓴 code 라 반드시 KOE320.
//    망 오류(TypeError = 연결 자체가 안 됨)일 때만 다른 길로 다시 보낸다.
// ⚠ 이 블록은 서버를 부르는 첫 <script> 보다 앞에 있어야 한다. 순서를 바꾸면 그 앞의 호출은 감싸지지 않는다.
// ⚠ 브라우저에서 이 코드를 시험하면 net_fallback 이 진짜로 쌓인다 → UA 에 Claude/ 가 있으면 기록하지 않는다.
// 원본은 index.html 의 이 블록. 다른 페이지엔 scratchpad/_patch_fallback_v3.mjs --attach 로 같은 블록을 넣는다.
(function(){
  var PRIMARY='https://hycaqsqeogjtbscmzrtm.supabase.co', FALLBACK='https://api.momcalendar.com';
  var KEY='mc_api_base', TTL=6*3600*1000, FIRST_TIMEOUT=15000, SECOND_TIMEOUT=15000;
  var _fetch=window.fetch && window.fetch.bind(window);
  if(!_fetch) return;   // 아주 옛 브라우저는 원래대로
  function remembered(){ try{ var o=JSON.parse(localStorage.getItem(KEY)||'null'); if(o && o.base===FALLBACK && Date.now()-o.t<TTL) return FALLBACK; }catch(_){} return PRIMARY; }
  function remember(base){ try{ if(base===FALLBACK) localStorage.setItem(KEY, JSON.stringify({base:base,t:Date.now()})); else localStorage.removeItem(KEY); }catch(_){} }
  function isNetErr(e){ return !!e && (e.name==='TypeError' || e.name==='AbortError'); }
  function broken(r){ return !r || r.status>=500; }   // 5xx = 그 길이 고장(Worker 502·Cloudflare 1027 한도 등). 4xx 는 서버가 답한 것 — 길은 살아 있다
  var reported=false;
  function report(via, why, path){   // 우회로로 살아난 기기가 몇이고 왜·어느 요청이었는지 — 원인 추적의 유일한 창구
    if(reported) return; reported=true;
    try{ if(/Claude\//.test(navigator.userAgent||'')) return; }catch(_){}
    try{ _fetch(via+'/rest/v1/events',{method:'POST',keepalive:true,
      headers:{'Content-Type':'application/json','apikey':'sb_publishable_u4hR4mdNTSss3kdjFH6R5Q_iuJ2MuGE','Prefer':'return=minimal'},
      body:JSON.stringify({event_type:'net_fallback',event_data:(via===FALLBACK?'to_fallback':'back_to_primary')+'|'+String(why).slice(0,30)+'|'+(navigator.userAgent||'').slice(0,110)+'|'+String(path||'').split('?')[0].slice(0,50)+'|'+(typeof location!=='undefined'?(location.pathname||''):'')})}).catch(function(){}); }catch(_){}
  }
  // 이미지·CSS 배경 주소용 — 우회로 기억 중이면 supabase.co 만 바꾼다. 나머지 주소는 그대로
  window.mcApiSrc=function(u){ try{ if(typeof u==='string' && u.indexOf(PRIMARY)===0 && remembered()===FALLBACK) return FALLBACK+u.slice(PRIMARY.length); }catch(_){} return u; };
  window.fetch=function(input, init){
    var url=(typeof input==='string')?input:(input && typeof input.url==='string'?input.url:'');
    var base = url.indexOf(PRIMARY)===0 ? PRIMARY : (url.indexOf(FALLBACK)===0 ? FALLBACK : null);
    if(!base || typeof input!=='string') return _fetch(input, init);       // 우리 서버가 아니거나 Request 객체면 그대로
    var rest=url.slice(base.length), first=remembered(), second=(first===PRIMARY)?FALLBACK:PRIMARY;
    var oneShot = rest.indexOf('/functions/v1/kakao-auth')===0;
    function attempt(b, ms){
      var i=Object.assign({}, init||{}), ac=null, timer=null;
      if(!i.signal && !oneShot && typeof AbortController!=='undefined'){ ac=new AbortController(); i.signal=ac.signal; timer=setTimeout(function(){ ac.abort(); }, ms); }
      return _fetch(b+rest, i).then(function(r){ if(timer) clearTimeout(timer); return r; }, function(e){ if(timer) clearTimeout(timer); throw e; });
    }
    return attempt(first, FIRST_TIMEOUT).then(function(r){
      if(!broken(r)) return r;                                   // 정상 답 (4xx 포함) → 그대로
      return attempt(second, SECOND_TIMEOUT).then(function(r2){
        if(broken(r2)) return r;                                 // 둘 다 5xx → 첫 응답 그대로
        remember(second); report(second, 'http'+r.status, rest); return r2;
      }, function(){ return r; });
    }, function(e){
      if(!isNetErr(e)) throw e;
      return attempt(second, SECOND_TIMEOUT).then(function(r2){
        if(broken(r2)) throw e;                                  // 다른 길도 고장 → 원래 오류 그대로
        remember(second); report(second, e.name, rest); return r2;
      }, function(){ throw e; });
    });
  };
})();
</script>
<script>
(function(){
  var SB='https://hycaqsqeogjtbscmzrtm.supabase.co';
  var KEY='sb_publishable_u4hR4mdNTSss3kdjFH6R5Q_iuJ2MuGE';
  var id=(new URLSearchParams(location.search).get('id')||location.hash.replace('#','')||'').replace(/\D/g,'');
  function fail(m){ document.querySelector('.sp').style.display='none';
    document.querySelector('.t').textContent='상품을 찾지 못했어요';
    document.getElementById('msg').textContent=m||'링크가 만료됐을 수 있어요';
    document.getElementById('home').style.display='block'; }
  if(!id) return fail('주소가 올바르지 않아요');
  fetch(SB+'/rest/v1/hotdeals?select=link,title&id=eq.'+id,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}})
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(j){
      var h=j&&j[0];
      if(!h||!h.link) return fail();
      try{ fetch(SB+'/rest/v1/events',{method:'POST',
        headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify({event_type:'cafe_hotdeal_click',event_data:String(id)})}); }catch(e){}
      location.replace(h.link);
    })
    .catch(function(){ fail('잠시 후 다시 시도해 주세요'); });
})();
</script>
</body>
</html>
