<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>맘캘린더 · 폰트 비교</title>

<!-- 눈누 상업용 무료 폰트 (웹폰트 CDN) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.css">
<style>
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'GmarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:'GmarketSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');font-weight:500;font-style:normal;font-display:swap}

*{box-sizing:border-box;margin:0;padding:0}
body{background:#E9E9EF;padding:34px 18px;color:#17151c;font-family:Pretendard,system-ui,sans-serif}
.wrap{max-width:1560px;margin:0 auto}
h1{font-size:23px;font-weight:800;margin-bottom:6px}
.sub{font-size:13px;color:#6d6d78;margin-bottom:10px;line-height:1.7}
#chk{font-size:12.5px;background:#fff;border-radius:10px;padding:12px 16px;margin-bottom:24px;line-height:1.8}
#chk b{color:#6B4A9E}
.row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.label{font-size:13.5px;font-weight:800;margin-bottom:2px}
.desc{font-size:11.5px;color:#777;margin-bottom:9px;max-width:400px;line-height:1.5}
.slot{width:400px;height:400px}
.card{width:1080px;height:1080px;transform:scale(.37037);transform-origin:top left;
      background:#fff;overflow:hidden;position:relative}

.lg{display:flex;align-items:center;gap:12px}
.lg .ic{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#6B4A9E,#9A72CE);position:relative}
.lg .ic:after{content:"";position:absolute;left:10px;top:12px;width:18px;height:15px;background:#fff;
  clip-path:path("M9 15C9 15 0 9.5 0 4.2C0 1.6 2 0 4 0C6 0 7.6 1.3 9 3.1C10.4 1.3 12 0 14 0C16 0 18 1.6 18 4.2C18 9.5 9 15 9 15Z")}
.lg .tx{font-size:24px;color:#6B4A9E;letter-spacing:-.5px;font-weight:800}

.top{padding:42px 52px 22px;display:flex;align-items:flex-start;justify-content:space-between}
.top .dt{font-size:72px;letter-spacing:-2.5px;line-height:1;margin-top:16px;color:#1b1720;font-weight:800}
.top .dt span{font-size:30px;color:#A092B4;margin-left:10px;font-weight:700}
.nums{display:flex;gap:12px;padding-top:44px}
.nums .n{border-radius:20px;padding:15px 24px 14px;text-align:center;min-width:126px}
.nums .n.o{background:linear-gradient(150deg,#F2EBFB,#EBE1F8)}
.nums .n.e{background:linear-gradient(150deg,#FDEDED,#FBE3E3)}
.nums .n b{display:block;font-size:60px;line-height:.92;letter-spacing:-2.5px;font-weight:800}
.nums .n.o b{color:#6B4A9E}
.nums .n.e b{color:#D3554F}
.nums .n i{display:block;font-style:normal;font-size:19px;font-weight:700;margin-top:8px}
.nums .n.o i{color:#9A85BC}
.nums .n.e i{color:#C58A87}

.nb{margin:6px 40px 18px;border-radius:26px;padding:22px 28px;position:relative;overflow:hidden;
    background:linear-gradient(115deg,#5B3A8C 0%,#7A54B4 52%,#9B76D2 100%)}
.nb:before{content:"";position:absolute;right:-30px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07)}
.nb .lb{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.nb .lb .tag{background:#F0D9A0;color:#5B3A8C;font-size:19px;font-weight:800;border-radius:99px;padding:5px 15px;letter-spacing:-.3px}
.nb .lb .t{color:#EBDDFA;font-size:20px;font-weight:700;letter-spacing:.5px}
.nb .it{display:flex;align-items:center;gap:14px;color:#fff}
.nb .it .n{font-size:33px;letter-spacing:-.8px;flex:1;line-height:1.15;font-weight:800}
.nb .it .s{font-size:20px;color:#DCC9F2;font-weight:700;white-space:nowrap}
.nb .it .dd{font-size:20px;color:#F0D9A0;font-weight:800;white-space:nowrap}

.split{display:flex;height:534px;border-top:1px solid #EFEDF3}
.half{flex:1;padding:22px 34px}
.half+.half{border-left:1px solid #EFEDF3;background:#FFFCFC}
.ht{font-size:27px;letter-spacing:-.6px;display:flex;align-items:baseline;gap:8px;font-weight:800}
.ht.open{color:#6B4A9E}
.ht.end{color:#D3554F}
.ht em{font-style:normal;font-size:23px;opacity:.6}
.hs{font-size:18px;color:#B4A8C6;font-weight:700;margin:4px 0 12px}
.hs.r{color:#D2A3A0}
.it{padding:9.5px 0;border-bottom:1px solid #F5F2F9}
.half+.half .it{border-bottom-color:#F9F0F0}
.it .n{font-size:24px;font-weight:700;letter-spacing:-.6px;line-height:1.24;color:#221d29}
.it .s{font-size:18.5px;color:#9C90AE;font-weight:600;margin-top:4px}
.half+.half .it .s{color:#B99696}
.mo{font-size:19px;color:#B7ADC6;font-weight:700;padding-top:10px}
.foot{position:absolute;left:52px;right:52px;bottom:30px;display:flex;justify-content:space-between;
      font-size:20px;color:#A9A2B8;border-top:1px solid #EFEDF3;padding-top:15px;font-weight:700}

/* 폰트별 적용 */
.f-pre{font-family:Pretendard,sans-serif}
.f-suit{font-family:SUIT,Pretendard,sans-serif}
.f-wanted{font-family:'Wanted Sans Variable','Wanted Sans',Pretendard,sans-serif}
.f-paper .top .dt,.f-paper .nums .n b,.f-paper .lg .tx,.f-paper .ht,.f-paper .nb .it .n{font-family:Paperlogy,sans-serif}
.f-paper{font-family:Pretendard,sans-serif}
.f-gmarket .top .dt,.f-gmarket .nums .n b,.f-gmarket .lg .tx,.f-gmarket .ht,.f-gmarket .nb .it .n{font-family:GmarketSans,sans-serif}
.f-gmarket{font-family:Pretendard,sans-serif}
</style>

<div class="wrap">
<h1>눈누 상업용 무료 폰트 — 같은 카드에 5종 적용 비교</h1>
<p class="sub">전부 <b>상업적 사용 무료</b>이고 웹폰트로 불러오니 <b>설치가 필요 없습니다.</b> 마음에 드는 걸 고르시면 그걸로 확정하겠습니다.</p>
<div id="chk">폰트 로딩 확인 중…</div>

<div class="row" id="cards"></div>
</div>

<script>
const DATA = {
  neighbor: {n:'리틀스푼 떡뻥 모음전', s:'이현맘', dd:'~8/8'},
  open: [
    ['베베루트&니가드 카시트 발판','콩알맘 · ~8/7'],
    ['호들 낮잠이불','도현맘 · ~8/7'],
    ['100층짜리집','명희홈쿡 · ~8/8'],
    ['타일즈 자석블럭','태브로맘 · ~8/6'],
    ['미르 회전책장','지지마마 · ~8/7'],
    ['그릭요거트 메이커','뚜비두밥 · ~8/9'],
    ['트랜짓 유산균','약스타그램 · ~8/7']
  ],
  end: [
    ['쉐프윈 드림핸즈&파티웍&스마트쿠커','요오리'],
    ['리앤더 하이체어','페이보릿'],
    ['말자루 글자루 전집 초특가','모찌맘'],
    ['에어메이드 제습기','로로맘'],
    ['딱딱이 백도 경봉 복숭아','베라킴'],
    ['자동회전 롤팬','지윤맘'],
    ['우잇 저염소세지','유안맘마']
  ]
};

const FONTS = [
  ['f-pre','Pretendard','인기 1위. 가장 무난하고 모던합니다. 애플 시스템 폰트(SF Pro) 느낌이라 <b>깔끔·고급</b> 쪽으로는 정석입니다.'],
  ['f-suit','SUIT','획이 살짝 둥글어 <b>부드럽고 다정한</b> 인상. 육아 계정과 결이 잘 맞습니다.'],
  ['f-wanted','Wanted Sans','원티드랩 폰트. 현대적이고 <b>또렷</b>합니다. 숫자가 특히 예쁘게 빠집니다.'],
  ['f-paper','Paperlogy + Pretendard','제목·숫자만 Paperlogy. 획이 두껍고 각져서 <b>썸네일에서 임팩트</b>가 큽니다.'],
  ['f-gmarket','Gmarket Sans + Pretendard','제목·숫자만 G마켓산스. <b>커머스 느낌</b>이 강하고 숫자가 시원합니다.']
];

function card(cls){
  const li = a => a.map(([n,s])=>`<div class="it"><div class="n">${n}</div><div class="s">${s}</div></div>`).join('');
  return `<div class="card ${cls}">
    <div class="top">
      <div><div class="lg"><div class="ic"></div><div class="tx">맘캘린더</div></div>
        <div class="dt">8월 4일<span>화요일</span></div></div>
      <div class="nums"><div class="n o"><b>36</b><i>오늘 오픈</i></div><div class="n e"><b>32</b><i>오늘 마감</i></div></div>
    </div>
    <div class="nb">
      <div class="lb"><span class="tag">♥ 맘캘린더 이웃셀러</span><span class="t">오늘의 단독 공구</span></div>
      <div class="it"><div class="n">${DATA.neighbor.n}</div><div class="s">${DATA.neighbor.s}</div><div class="dd">${DATA.neighbor.dd}</div></div>
    </div>
    <div class="split">
      <div class="half"><div class="ht open">오늘 오픈 <em>36</em></div><div class="hs">지금부터 살 수 있어요</div>
        ${li(DATA.open)}<div class="mo">+ 28건 더 →</div></div>
      <div class="half"><div class="ht end">오늘 마감 <em>32</em></div><div class="hs r">오늘 안 사면 끝나요</div>
        ${li(DATA.end)}<div class="mo">+ 25건 더 →</div></div>
    </div>
    <div class="foot"><span>1 / 3 → 전체 목록은 넘겨서</span><span>momcalendar.com</span></div>
  </div>`;
}

document.getElementById('cards').innerHTML = FONTS.map(([cls,name,desc])=>
  `<div><div class="label">${name}</div><div class="desc">${desc}</div>
   <div class="slot">${card(cls)}</div></div>`).join('');

document.fonts.ready.then(()=>{
  const list = [
    ['Pretendard','800 40px Pretendard'],
    ['SUIT','800 40px SUIT'],
    ['Wanted Sans','800 40px "Wanted Sans Variable"'],
    ['Paperlogy','800 40px Paperlogy'],
    ['GmarketSans','800 40px GmarketSans']
  ];
  const r = list.map(([n,f])=>{
    const ok = document.fonts.check(f, '가나다ABC123');
    return (ok?'✅ ':'❌ ') + n;
  }).join(' &nbsp;|&nbsp; ');
  document.getElementById('chk').innerHTML = '<b>폰트 로딩 상태</b> &nbsp; ' + r +
    '<br><span style="color:#888">❌ 가 있으면 그 폰트는 기본 글씨체로 대체돼 보입니다.</span>';
});
</script>
