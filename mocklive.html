<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>맘캘린더 시안 · 라방 · 검색창 · 문센</title>
<!-- 2026-10-24 사장님 「디자인 밤티스럽지 않게 … 토스 당근 맘맘 레퍼런스 참고」 「나한테 허락받고 라이브 올리게 목업 여러버전 짜」
     세 화면 × 3안. 실제 데이터(live_shows · sale_events)를 그대로 불러와 그린다. 고르시면 그 안으로 test → 검증 → 라이브.
     원칙(references/THREADS_REFERENCES.md): 둥근 상자 줄이기 · 여백과 글자 굵기로 위계 · 강조색은 한 화면에 하나 · 토스 토큰(#191F28 · #6B7684 · #F2F4F6) · 「한눈에」 금지 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--fg:#191F28;--sub:#6B7684;--mute:#8B95A1;--line:#E5E8EB;--surf:#F2F4F6;--bg:#fff;--brand:#602090;--live:#F04452;--carrot:#FF6F0F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--fg);-webkit-text-size-adjust:100%;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.top h1{font-size:15px;font-weight:800;padding:12px 16px 2px}
.top p{font-size:12px;color:var(--sub);padding:0 16px 8px}
.scr{display:flex;gap:0;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr button{flex:0 0 auto;padding:10px 10px 11px;font-size:14px;font-weight:700;color:var(--mute);border-bottom:2px solid transparent}
.scr button.on{color:var(--fg);border-color:var(--fg)}
.vers{display:flex;gap:6px;padding:10px 16px 12px;overflow-x:auto;scrollbar-width:none}
.vers button{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--surf);font-size:13px;font-weight:700;color:var(--sub)}
.vers button.on{background:var(--fg);color:#fff}
.note{margin:14px 16px 0;padding:11px 13px;background:#F9FAFB;border-radius:10px;font-size:12.5px;line-height:1.55;color:var(--sub)}
.note b{color:var(--fg)}
.stage{max-width:480px;margin:0 auto;padding-bottom:80px}
.empty{padding:40px 16px;text-align:center;color:var(--mute);font-size:13px}
/* 공통 — 사이트 머리(세일/라방 토글) 흉내 */
.seg{display:flex;margin:14px 16px 4px;background:var(--surf);border-radius:10px;padding:3px}
.seg span{flex:1;text-align:center;padding:8px 0;font-size:13.5px;font-weight:700;color:var(--mute);border-radius:8px}
.seg span.on{background:#fff;color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.h{font-size:20px;font-weight:800;padding:18px 16px 4px;letter-spacing:-.02em}
.chips{display:flex;gap:6px;padding:10px 16px 2px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips span{flex:0 0 auto;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--sub);background:var(--surf)}
.chips span.on{background:var(--fg);color:#fff}
.day{font-size:15px;font-weight:800;padding:22px 16px 8px}
.day small{font-size:12.5px;font-weight:600;color:var(--mute);margin-left:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#fff;background:var(--live);border-radius:5px;padding:2px 6px;line-height:1.3}
.badge i{width:5px;height:5px;border-radius:50%;background:#fff;animation:dot 1s infinite}
.badge.soon{background:var(--fg)}
@keyframes dot{50%{opacity:.2}}
@keyframes ken{from{transform:scale(1)}to{transform:scale(1.13) translate(-2%,-2%)}}
.ken{animation:ken 8s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.ken{animation:none}}
.price{font-size:14px;font-weight:800;margin-top:4px}
.price b{color:var(--live);margin-right:3px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 라방 A · 토스: 무대 한 장 + 목록 줄 ─────────────── */
.A-stage{position:relative;margin:10px 16px 0;border-radius:16px;overflow:hidden;aspect-ratio:4/5;background:#222}
.A-stage .sl{position:absolute;inset:0;opacity:0;transition:opacity .8s}
.A-stage .sl.on{opacity:1}
.A-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.A-stage .sl::after{content:'';position:absolute;inset:auto 0 0;height:60%;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.A-stage .tx{position:absolute;left:18px;right:18px;bottom:30px;z-index:1;color:#fff}
.A-stage .tx .t{font-size:19px;font-weight:800;line-height:1.35}
.A-stage .tx .m{font-size:13px;opacity:.85;margin-top:6px}
.A-stage .tx .price{color:#fff}
.A-stage .tx .price b{color:#FF8A95}
.A-stage .bd{position:absolute;left:16px;top:16px;z-index:1}
.A-dots{position:absolute;left:0;right:0;bottom:12px;z-index:1;display:flex;justify-content:center;gap:5px}
.A-dots i{width:5px;height:5px;border-radius:3px;background:rgba(255,255,255,.45);transition:width .3s}
.A-dots i.on{width:16px;background:#fff}
.A-row{display:flex;gap:14px;padding:12px 16px;align-items:flex-start}
.A-row .tm{flex:0 0 52px;font-size:14px;font-weight:800;padding-top:2px}
.A-row .tm small{display:block;font-size:11px;font-weight:600;color:var(--mute);margin-top:2px}
.A-row .im{flex:0 0 76px;height:96px;border-radius:10px;overflow:hidden;background:var(--surf);position:relative}
.A-row .im img{width:100%;height:100%;object-fit:cover}
.A-row .im .badge{position:absolute;left:5px;top:5px}
.A-row .bd2{flex:1;min-width:0}
.A-row .t{font-size:15px;font-weight:700;line-height:1.4}
.A-row .ch{font-size:12.5px;color:var(--mute);margin-top:3px}

/* ── 라방 B · 카카오: 노랑 강조 하나 · 정사각 사진 · 알림 버튼 ─────────────── */
.K-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 16px 0}
.K-row::-webkit-scrollbar{display:none}
.K-row a{flex:0 0 140px}
.K-row .im{position:relative;width:140px;height:140px;border-radius:12px;overflow:hidden;background:var(--surf)}
.K-row .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.K-row .im .badge{position:absolute;left:7px;top:7px}
.K-row .t{font-size:13.5px;font-weight:600;line-height:1.4;margin-top:8px}
.K-row .m{font-size:12px;color:var(--mute);margin-top:2px}
.K-it{display:flex;gap:12px;padding:12px 16px;align-items:center}
.K-it .im{flex:0 0 88px;height:88px;border-radius:12px;overflow:hidden;background:var(--surf);position:relative}
.K-it .im img{width:100%;height:100%;object-fit:cover}
.K-it .im .badge{position:absolute;left:5px;top:5px}
.K-it .tx{flex:1;min-width:0}
.K-it .tm{font-size:12.5px;font-weight:700;color:var(--sub)}
.K-it .t{font-size:14.5px;font-weight:600;line-height:1.4;margin-top:2px}
.K-it .ch{font-size:12px;color:var(--mute);margin-top:2px}
.K-it .al{flex:none;align-self:center;font-size:12px;font-weight:700;background:#FEE500;color:#191919;border-radius:8px;padding:7px 10px}
.K-it .al.off{background:var(--surf);color:var(--sub)}
.K-tabs{display:flex;gap:6px;padding:12px 16px 0}
.K-tabs span{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surf);color:var(--sub)}
.K-tabs span.on{background:#191919;color:#fff}

/* ── 라방 C · 당근: 날짜 탭 + 시간표 ─────────────── */
.C-days{display:flex;gap:18px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.C-days::-webkit-scrollbar{display:none}
.C-days button{flex:0 0 auto;padding:8px 0 10px;font-size:14.5px;font-weight:700;color:var(--mute);border-bottom:2px solid transparent}
.C-days button.on{color:var(--fg);border-color:var(--carrot)}
.C-now{margin:16px 16px 4px;display:flex;gap:14px;align-items:center;overflow:hidden}
.C-now .im{flex:0 0 132px;height:176px;border-radius:12px;overflow:hidden;position:relative;background:var(--surf)}
.C-now .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.C-now .im .badge{position:absolute;left:8px;top:8px}
.C-now .k{font-size:12px;font-weight:800;color:var(--carrot)}
.C-now .t{font-size:17px;font-weight:800;line-height:1.38;margin-top:4px}
.C-now .m{font-size:12.5px;color:var(--mute);margin-top:5px}
.C-now .fade{transition:opacity .5s}
.C-slot{display:flex;gap:12px;padding:0 16px}
.C-slot .tl{flex:0 0 46px;position:relative;font-size:13px;font-weight:800;padding-top:14px}
.C-slot .tl::after{content:'';position:absolute;left:52px;top:0;bottom:0;width:1px;background:var(--line)}
.C-slot .its{flex:1;min-width:0;padding-left:14px}
.C-it{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #F2F4F6}
.C-it .im{flex:0 0 64px;height:64px;border-radius:10px;overflow:hidden;background:var(--surf)}
.C-it .im img{width:100%;height:100%;object-fit:cover}
.C-it .t{font-size:14.5px;font-weight:600;line-height:1.38}
.C-it .ch{font-size:12px;color:var(--mute);margin-top:3px}
.C-it .price{font-size:13.5px}
.C-it.on{background:#FFF4EC;margin:0 -8px;padding:12px 8px;border-radius:10px;border-bottom:0}

/* ── 검색창 공통 ── */
.sbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--brand)}
.sbar .in{flex:1;background:#fff;border-radius:10px;padding:10px 12px;font-size:14px;color:var(--mute)}
.sbar .bk{color:#fff;font-size:20px}
.sh{display:flex;justify-content:space-between;align-items:baseline;padding:20px 16px 10px}
.sh h3{font-size:16px;font-weight:800}
.sh button{font-size:12.5px;color:var(--mute)}
.rec{display:flex;gap:6px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.rec::-webkit-scrollbar{display:none}
/* S1 */
.S1 .rec span{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:8px 10px 8px 13px;border-radius:999px;background:var(--surf);font-size:13.5px;font-weight:600}
.S1 .rec span i{font-style:normal;color:var(--mute);font-size:11px}
.S1 .rank{display:grid;grid-template-columns:1fr 1fr;padding:0 16px;column-gap:16px}
.S1 .rank div{display:flex;gap:12px;padding:10px 0;font-size:15px;font-weight:600}
.S1 .rank b{width:16px;color:var(--mute);font-weight:700}
.S1 .rank div.t3 b{color:var(--brand)}   /* 2열로 순서를 섞어 그려서 nth-child 로 칠하면 1·6·2 가 보라가 됐다(사장님 지적) */
.S1 .ch{display:flex;align-items:center;gap:12px;padding:11px 16px}
.S1 .ch .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:16px;font-weight:900;color:#fff;flex:none}
.S1 .ch .nm{flex:1;font-size:15px;font-weight:600}
.S1 .ch .nm small{display:block;font-size:12px;color:var(--mute);font-weight:500;margin-top:1px}
.S1 .ch .go{font-size:13px;font-weight:700;color:var(--brand)}
.S1 .ch .go.g{color:var(--mute);font-weight:500}
.div{height:8px;background:#F9FAFB;margin-top:14px}
/* S2 */
.S2 .rec span{flex:0 0 auto;font-size:14px;color:var(--fg);padding:4px 0;margin-right:12px;display:inline-flex;gap:5px;align-items:center}
.S2 .rec span i{font-style:normal;color:#C4C9CF;font-size:12px}
.S2 .rank div{display:flex;gap:14px;padding:11px 16px;font-size:15.5px;align-items:center}
.S2 .rank b{width:18px;font-weight:800;color:var(--fg)}
.S2 .rank div:nth-child(-n+3) b{color:var(--carrot)}
.S2 .rank small{margin-left:auto;font-size:11px;color:var(--mute)}
.S2 .sc{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 0;padding:6px 8px 4px}
.S2 .sc a{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--fg);text-align:center}
.S2 .sc .ic{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:20px;font-weight:900;color:#fff}
/* S3 */
.S3{background:#FBF8FD;min-height:100vh}
.S3 .rec span{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:#fff;font-size:13px;font-weight:600;color:#5B4A6E;box-shadow:0 0 0 1px #EDE6F4 inset}
.S3 .rec span i{font-style:normal;color:#B9AECB;font-size:10.5px}
.S3 .rank{margin:0 16px;background:#fff;border-radius:16px;padding:6px 14px}
.S3 .rank div{display:flex;gap:12px;padding:9px 0;font-size:14.5px;font-weight:600;border-bottom:1px solid #F5F1F9}
.S3 .rank div:last-child{border:0}
.S3 .rank b{width:22px;height:22px;border-radius:50%;background:#F3ECFA;color:var(--brand);font-size:12px;display:grid;place-items:center}
.S3 .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.S3 .grid a{border-radius:14px;padding:13px 13px 12px;font-size:13.5px;font-weight:700;line-height:1.35;min-height:76px;display:flex;flex-direction:column;justify-content:space-between}
.S3 .grid a small{font-size:11px;font-weight:600;opacity:.7}
.S3 .grid a.w{grid-column:1/3;flex-direction:row;align-items:center;min-height:0}

/* ── 브랜드(이런 공구 찾으세요?) ── */
.T-h{display:flex;justify-content:space-between;align-items:baseline;padding:22px 16px 10px}
.T-h h3{font-size:16px;font-weight:800}
.T-h small{font-size:12px;color:var(--mute)}
.T-row{display:flex;gap:6px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.T-row::-webkit-scrollbar,.T-grid::-webkit-scrollbar,.T-av::-webkit-scrollbar{display:none}
.T1 .T-row span{flex:0 0 auto;padding:8px 13px;border-radius:999px;background:var(--surf);font-size:13.5px;font-weight:600;white-space:nowrap}
.T1 .T-row span b{color:var(--brand);margin-right:2px}
.T-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:max-content;gap:8px;overflow-x:auto;padding:0 16px 2px;scrollbar-width:none}
.T-grid span{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:12px;border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap;background:#fff}
.T-grid span i{font-style:normal;font-size:11.5px;color:var(--carrot);font-weight:700}
.T-av{display:flex;gap:14px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none}
.T-av a{flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.T-av .c{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:800;color:#3B2A55;position:relative}
.T-av .c i{position:absolute;right:-2px;top:-2px;background:#191F28;color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px}
.T-av .nm{font-size:12px;font-weight:600;width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 문센 ── */
.M-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #F2F4F6}
.M-row .lg{width:42px;height:42px;border-radius:12px;background:var(--surf);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--sub);flex:none}
.M-row .tx{flex:1;min-width:0}
.M-row .t{font-size:15px;font-weight:700}
.M-row .m{font-size:12.5px;color:var(--mute);margin-top:2px}
.M-row .d{font-size:13px;font-weight:800;color:var(--brand);text-align:right;flex:none}
.M-row .d small{display:block;font-size:11px;color:var(--mute);font-weight:600}
.M2-row{display:flex;gap:14px;padding:14px 16px;align-items:center}
.M2-row .dt{flex:0 0 54px;text-align:center}
.M2-row .dt b{display:block;font-size:24px;font-weight:800;line-height:1}
.M2-row .dt small{font-size:11.5px;color:var(--mute);font-weight:600}
.M2-row .tx{flex:1;min-width:0;padding-left:14px;border-left:1px solid var(--line)}
.M2-row .t{font-size:15px;font-weight:700}
.M2-row .m{font-size:12.5px;color:var(--mute);margin-top:2px}
.M2-row .tag{font-size:11.5px;font-weight:700;color:var(--brand);background:#F3ECFA;border-radius:6px;padding:2px 7px;flex:none}
.M3-head{margin:12px 16px 0;padding:16px;border-radius:16px;background:#F7F3FB}
.M3-head .k{font-size:12px;font-weight:800;color:var(--brand)}
.M3-head .t{font-size:17px;font-weight:800;margin-top:4px}
.M3-head .m{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.5}
.M3-tb{margin:6px 16px 0}
.M3-tb div{display:flex;padding:13px 2px;border-bottom:1px solid #F2F4F6;font-size:14.5px}
.M3-tb div span:first-child{flex:1;font-weight:600}
.M3-tb div span:last-child{font-weight:800}
.M3-tb div.past span:last-child{color:var(--mute);font-weight:600}
</style>
</head>
<body>
<div class="top">
  <h1>맘캘린더 시안 — 고르시면 그 안으로 올립니다</h1>
  <p>화면을 고르고 1·2·3안을 넘겨 보세요. 라방·문센은 지금 실제 데이터예요.</p>
  <div class="scr" id="scr"><button data-s="live" class="on">📺 라방</button><button data-s="search">🔍 검색창</button><button data-s="mun">🎓 문센</button><button data-s="tags"># 브랜드</button></div>
  <div class="vers" id="vers"></div>
</div>
<div class="stage" id="stage"><div class="empty">불러오는 중…</div></div>

<script>
const SB='https://hycaqsqeogjtbscmzrtm.supabase.co', KEY='sb_publishable_u4hR4mdNTSss3kdjFH6R5Q_iuJ2MuGE';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kst=d=>new Date(new Date(d).getTime()+9*3600e3);
const today=kst(Date.now()).toISOString().slice(0,10);
const W='일월화수목금토';
const tm=iso=>{const k=kst(iso),h=k.getUTCHours(),m=k.getUTCMinutes();return `${h===0?'밤':h<12?'오전':'오후'} ${h%12||12}시${m?` ${m}분`:''}`;};
const tmShort=iso=>{const k=kst(iso),h=k.getUTCHours(),m=k.getUTCMinutes();return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;};
const dayOf=iso=>kst(iso).toISOString().slice(0,10);
const dayLab=ds=>{const d=Math.round((Date.parse(ds)-Date.parse(today))/864e5);const w=W[new Date(ds+'T12:00:00+09:00').getUTCDay()];return d===0?'오늘':d===1?'내일':`${+ds.slice(5,7)}.${+ds.slice(8,10)}`;};
const dayLabW=ds=>`${+ds.slice(5,7)}.${+ds.slice(8,10)} ${W[new Date(ds+'T12:00:00+09:00').getUTCDay()]}`;

const HOT_TAG_STOP=new Set(['유기농','프리미엄','난각번호','국산','국내산','수입','신상','정품','공식','한정','특가','무료','친환경','무농약','수제','아기','유아','키즈','여름','가을','겨울','신학기','대용량','살림','먹거리','생활','오늘','단하루','당일','베스트','인기','추석','설날','명절']);
async function loadTags(){
  try{
    const t=new Date(Date.now()+9*3600e3), from=new Date(t.getTime()-14*864e5).toISOString().slice(0,10), lim=new Date(t.getTime()+7*864e5).toISOString().slice(0,10), today=t.toISOString().slice(0,10);
    const q=`/rest/v1/gonggu?approved=eq.true&or=(end_date.gte.${today},open_date.gte.${from})&select=id,name,open_date,end_date&order=open_date.asc,id.desc&limit=1000`;
    let rows=[]; for(let off=0;off<4000;off+=1000){ let r=await fetch('https://api.momcalendar.com'+q+'&offset='+off,{headers:H}); if(!r.ok) r=await fetch(SB+q+'&offset='+off,{headers:H}); const a=await r.json(); rows=rows.concat(a); if(a.length<1000) break; }
    const cnt={}; rows.forEach(it=>{ if(it.end_date && it.end_date<today) return; if(it.open_date>lim) return; const w=(it.name||'').trim().split(/\s+/)[0].replace(/[^가-힣A-Za-z0-9]/g,''); if(w.length<2||HOT_TAG_STOP.has(w)) return; cnt[w]=(cnt[w]||0)+1; });
    TAGS=Object.entries(cnt).filter(([,n])=>n>=3).sort((a,b)=>b[1]-a[1]).slice(0,20);
  }catch(_){ TAGS=[]; }
}
const timers=[]; const clearT=()=>{while(timers.length) clearInterval(timers.pop());};
async function load(){
  const from=new Date(Math.floor((Date.now()-2*3600e3)/3600e3)*3600e3).toISOString().replace('.000Z','Z');
  const q=`/rest/v1/live_shows?select=id,title,channel_name,category,start_at,image_url,link_url,prod_name,prod_price,prod_rate,benefit&start_at=gte.${encodeURIComponent(from)}&order=start_at.asc,id.asc&limit=1500`;
  try{ let r=await fetch('https://api.momcalendar.com'+q,{headers:H}); if(!r.ok) r=await fetch(SB+q,{headers:H}); LIVE=(await r.json()).filter(x=>Date.parse(x.start_at)+3600e3>Date.now()); }catch(_){ LIVE=[]; }
  try{ const r=await fetch(SB+'/rest/v1/sale_events?select=id,brand,title,tag,start_date,end_date,url&tag=eq.%EB%AC%B8%EC%84%BC&order=start_date.asc',{headers:H}); MUN=await r.json(); }catch(_){ MUN=[]; }
}
const kids=()=>{const k=LIVE.filter(x=>x.category==='키즈');return k.length>=6?k:LIVE;};
const chipsH=on=>{const c={};LIVE.forEach(x=>c[x.category]=(c[x.category]||0)+1);const cats=Object.keys(c).sort((a,b)=>a==='키즈'?-1:b==='키즈'?1:c[b]-c[a]);return `<div class="chips"><span>전체</span>${cats.map(k=>`<span class="${k===on?'on':''}">${esc(k)}</span>`).join('')}</div>`;};

function slide(h,to){ const f=h.scrollLeft,t0=performance.now(); h.style.scrollSnapType='none'; const end=()=>{h.scrollLeft=to;h.style.scrollSnapType='';}; const st=t=>{const k=Math.min(1,(t-t0)/450); h.scrollLeft=f+(to-f)*(1-Math.pow(1-k,3)); if(k<1) requestAnimationFrame(st); else end();}; requestAnimationFrame(st); setTimeout(()=>{ if(h.style.scrollSnapType==='none') end(); },900); }

const tagTop=()=>`${sbar}<div class="sh"><h3>최근 검색어</h3><button>전체삭제</button></div><div class="S1"><div class="rec">${RECENT.map(q=>`<span>${q}<i>✕</i></span>`).join('')}</div><div class="sh"><h3>지금 뜨는 검색어</h3></div><div class="rank">${[0,5,1,6,2,7,3,8,4,9].map(i=>`<div class="${i<3?'t3':''}"><b>${i+1}</b>${TREND[i]}</div>`).join('')}</div></div>`;
const PAST=['#FFF4C2','#EDE4FA','#E6F0FF','#E3F6EA','#FFE9EF','#FFF0E0'];
function T1(){ return {html:tagTop()+`<div class="T1"><div class="T-h"><h3>이런 공구 찾으세요?</h3><small>옆으로 넘겨 보세요</small></div><div class="T-row">${TAGS.map(([m])=>`<span><b>#</b>${esc(m)}</span>`).join('')}</div></div>`,
  note:'<b>1안 · 토스</b> 회색 알약 한 줄을 옆으로 넘깁니다. 최근 검색어와 같은 모양이라 가장 조용해요.'}; }
function T2(){ return {html:tagTop()+`<div class="T-h"><h3>이런 공구 찾으세요?</h3><small>공구 많은 순</small></div><div class="T-grid">${TAGS.map(([m,n])=>`<span>${esc(m)}<i>${n}</i></span>`).join('')}</div>`,
  note:'<b>2안 · 당근</b> 두 줄로 쭉 늘어놓고 옆으로 넘깁니다. 오른쪽 주황 숫자 = 지금 열린 공구 수.'}; }
function T3(){ return {html:tagTop()+`<div class="T-h"><h3>이런 공구 찾으세요?</h3><small>옆으로 넘겨 보세요</small></div><div class="T-av">${TAGS.map(([m,n],i)=>`<a><div class="c" style="background:${PAST[i%PAST.length]}">${esc(m.slice(0,2))}<i>${n}</i></div><div class="nm">${esc(m)}</div></a>`).join('')}</div>`,
  note:'<b>3안 · 카카오</b> 동그라미 + 이름(카톡 쇼핑 브랜드 줄 느낌). 공구 표엔 상품 사진 칸이 없어서 첫 두 글자 + 파스텔색으로 했어요.'}; }
const SCR={live:[['1안 토스',liveA],['2안 카카오',liveB],['3안 당근',liveC]],search:[['1안 토스',S1],['2안 당근',S2],['3안 파스텔',S3]],mun:[['1안 줄',M1],['2안 날짜',M2],['3안 표',M3]],tags:[['1안 토스',T1],['2안 당근',T2],['3안 카카오',T3]]};
let cur='live', vi=0;
function show(){
  clearT();
  const v=SCR[cur][vi][1](); const st=document.getElementById('stage');
  st.innerHTML=`<div class="note">${v.note}</div>`+v.html; v.after&&v.after();
  document.getElementById('vers').innerHTML=SCR[cur].map((x,i)=>`<button class="${i===vi?'on':''}" onclick="vi=${i};show();scrollTo(0,0)">${x[0]}</button>`).join('');
}
document.getElementById('scr').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; cur=b.dataset.s; vi=0; document.querySelectorAll('#scr button').forEach(x=>x.classList.toggle('on',x===b)); show(); scrollTo(0,0); });
Promise.all([load(), loadTags()]).then(show);
</script>
</body>
