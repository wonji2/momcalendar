<!-- 스레드 글 승인/반려 (사장님 지시 2026-10-01 "수정저장 바로 가능하게 내 승인 반려-반려시 수정방향 지시까지 바로 가능하게")
     🔴 스레드 글은 올리면 우리가 못 지운다 → 여기서 승인한 것만 나간다.
     관리자 로그인(admin.html 과 같은 계정) → rpc/threads_queue_* (is_app_admin 만). 표·함수 원본 supabase/sql/threads_queue_76.sql
     시안 넣기: node sns-automation/src/threads-queue.js --seed   ·   반려 읽기: --rejected -->
<style>
:root{--p:#6B4A9E;--p-d:#5B3A8C;--p-l:#F2EBFB;--ok:#2E8B57;--bad:#D3554F;--warn:#D9782B;--ink:#231C2E;--mute:#8A8194;--line:#EDE9F2;--bg:#F7F5FA}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);padding:14px 12px 70px;max-width:720px;margin:0 auto;-webkit-text-size-adjust:100%}
h1{font-size:19px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
h1 small{font-size:12px;color:var(--mute);font-weight:500}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 14px}
button{border:0;border-radius:9px;padding:10px 13px;font-size:14px;font-weight:700;background:var(--p);color:#fff;cursor:pointer;font-family:inherit}
button.ghost{background:#E6E0F0;color:var(--p-d)}
button.ok{background:var(--ok)}
button.no{background:var(--bad)}
button:disabled{opacity:.5}
input,textarea{border:1px solid #D7CFE3;border-radius:9px;padding:10px;font-size:15px;font-family:inherit;width:100%;line-height:1.55;background:#fff;color:var(--ink)}
textarea{resize:vertical}
.login{display:flex;flex-direction:column;gap:9px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;max-width:360px;margin:40px auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.card.rej{border-color:#F0C9C7;background:#FFF8F8}
.hd{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--p-l);color:var(--p-d)}
.st{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.st.pending{background:#FFF3E0;color:#A9641F}
.st.approved{background:#E6F4EC;color:#216D43}
.st.rejected{background:#FBE9E8;color:#9E3833}
.st.posted{background:#ECE9F2;color:#655C72}
.when{font-size:11px;color:var(--mute);margin-left:auto}
.lbl{font-size:11px;font-weight:800;color:var(--mute);margin:10px 0 4px}
.btns{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.btns button{flex:1;min-width:88px}
img.shot{width:100%;max-width:260px;border-radius:10px;border:1px solid var(--line);display:block;margin-top:6px}
.note{background:#FBE9E8;border-radius:9px;padding:9px 10px;font-size:13px;color:#8A302B;margin-top:9px;white-space:pre-wrap}
.sec{font-size:13px;font-weight:800;color:var(--mute);margin:20px 0 8px;display:flex;gap:6px;align-items:center}
/* 탭 — 승인 전 / 승인됨 / 발행완료 / 반려 (사장님 2026-10-02) */
.tabs{display:flex;gap:6px;margin:12px 0 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs .tab{flex:0 0 auto;padding:9px 13px;border:1px solid var(--line);background:#fff;border-radius:999px;
  font:inherit;font-size:13px;font-weight:700;color:var(--mute);cursor:pointer;white-space:nowrap}
.tabs .tab.on{background:var(--p-l);border-color:var(--p-d);color:var(--p-d)}
.tabs .tcnt{display:inline-block;margin-left:4px;font-size:11px;opacity:.8}
/* 여러 개 골라 한꺼번에 승인 + 랜덤 시간 (사장님 2026-10-02) */
.bulk{position:sticky;top:0;z-index:9;background:#fff;border:1px solid var(--p-d);border-radius:12px;padding:11px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.07)}
.bulk .r{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.bulk input[type=datetime-local]{flex:1;min-width:140px;padding:8px;border:1px solid var(--line);border-radius:9px;font:inherit}
.bulk b{font-size:13px}
.selbox{width:20px;height:20px;accent-color:var(--p-d);margin-right:2px}
.pickrow{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.pickrow label{font-size:12px;color:var(--mute);font-weight:700}
.foot{font-size:11.5px;color:var(--mute);line-height:1.6;margin-top:18px}
a{color:var(--p-d)}
.empty{background:#fff;border:1px dashed #D7CFE3;border-radius:12px;padding:22px;text-align:center;color:var(--mute);font-size:14px}
</style>
</head>
<body>
<h1>📮 발행 승인 <small>스레드</small></h1>
<div class="foot" style="margin:0">승인한 글만 올라가요. <b>한 번 올라간 스레드 글은 지울 수 없어서</b> 여기서 먼저 보시는 거예요.</div>

<div id="loginBox" class="login" hidden>
  <div style="font-weight:800;font-size:16px">관리자 로그인</div>
  <input id="email" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="loginBtn" onclick="login()">로그인</button>
  <div class="foot">admin.html 과 같은 계정. 로그인 정보는 이 기기에만 저장돼요.</div>
</div>

<div id="app" hidden>
  <div class="top">
    <button class="ghost" onclick="boot()">↻ 새로고침</button>
    <button class="ghost" onclick="logout()">로그아웃</button>
    <span class="when" id="cnt"></span>
  </div>
  <div id="tabs" class="tabs"></div>
  <div id="bulk" class="bulk" hidden></div>
  <div id="list"></div>
  <div class="foot">· <b>수정 저장</b>을 누르면 고친 내용으로 다시 <b>승인 대기</b>가 돼요(바로 올라가지 않아요).<br>
    · <b>반려</b>하시면 적어주신 수정방향을 보고 다시 짜서 올려둘게요.<br>
    · 본문에 링크를 넣으면 승인이 막혀요 — 맘캘 규칙상 링크는 답글로만 나가요.</div>
</div>

<script>
const SB='https://hycaqsqeogjtbscmzrtm.supabase.co', KEY='sb_publishable_u4hR4mdNTSss3kdjFH6R5Q_iuJ2MuGE';
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const at=()=>localStorage.getItem('mc_admin_at');
const $=id=>document.getElementById(id);

async function login(){
  const email=$('email').value.trim(), pw=$('pw').value;
  if(!email||!pw) return alert('이메일·비밀번호를 넣어주세요');
  const b=$('loginBtn'); b.disabled=true;
  try{
    const r=await fetch(`${SB}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({email,password:pw})});
    const d=await r.json();
    if(!r.ok||!d.access_token) throw new Error(d.error_description||d.msg||'로그인 실패');
    localStorage.setItem('mc_admin_at',d.access_token); if(d.refresh_token) localStorage.setItem('mc_admin_rt',d.refresh_token);
    boot();
  }catch(e){ alert(e.message); } finally{ b.disabled=false; }
}
async function refreshToken(){
  const rt=localStorage.getItem('mc_admin_rt'); if(!rt) return false;
  const r=await fetch(`${SB}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({refresh_token:rt})});
  const d=await r.json().catch(()=>({}));
  if(r.ok&&d.access_token){ localStorage.setItem('mc_admin_at',d.access_token); if(d.refresh_token) localStorage.setItem('mc_admin_rt',d.refresh_token); return true; }
  return false;
}
function logout(){ localStorage.removeItem('mc_admin_at'); localStorage.removeItem('mc_admin_rt'); location.reload(); }
async function rpc(name,body){
  const call=()=>fetch(`${SB}/rest/v1/rpc/${name}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+at()},body:JSON.stringify(body||{})});
  let r=await call();
  if(r.status===401&&await refreshToken()) r=await call();
  if(!r.ok){ const t=await r.text(); throw new Error(t.slice(0,200)); }
  return r.json();
}

const LABEL={pending:'승인 대기',approved:'승인됨 · 발행 대기',rejected:'반려됨',posted:'발행됨'};

function card(x){
  const rej=x.status==='rejected';
  return `<div class="card ${rej?'rej':''}" id="c${x.id}">
    <div class="hd">
      <span class="chip">${esc(x.variant)}</span>
      <span class="st ${x.status}">${LABEL[x.status]||x.status}</span>
      ${x.publish_kst&&x.status==='approved'?`<span class="chip">⏰ ${esc(x.publish_kst)} 예약</span>`:''}
      <span class="when">#${x.id} · ${esc(x.created)}</span>
    </div>
    ${x.status==='posted'?'':`<div class="pickrow">
      <input type="checkbox" class="selbox" id="s${x.id}" ${SEL.has(x.id)?'checked':''} onchange="toggleSel(${x.id},this.checked)">
      <label for="s${x.id}">골라서 한꺼번에 승인하기</label></div>`}
    ${x.reject_note?`<div class="note">🔴 적어주신 수정방향\n${esc(x.reject_note)}</div>`:''}
    <div class="lbl">본문 (이대로 올라가요)</div>
    <textarea id="b${x.id}" rows="8">${esc(x.body)}</textarea>
    ${x.image_url?`<div class="lbl">사진</div><img class="shot" src="${esc(x.image_url)}" alt="사진" onerror="this.insertAdjacentHTML('afterend','<div class=note>🔴 사진이 안 열려요 — 이대로 올리면 빈칸으로 나가요</div>');this.remove();">`:''}
    <div class="lbl">답글 (링크는 여기로 나가요)</div>
    <textarea id="r${x.id}" rows="3">${esc(x.reply_text||'')}</textarea>
    ${x.permalink?`<div class="lbl">올라간 글</div><a href="${esc(x.permalink)}" target="_blank" rel="noopener">${esc(x.permalink)}</a>`:''}
    ${x.status==='posted'?'':`
    <div class="lbl">언제 올릴까요 <span style="font-weight:400;color:#8a8f98">— 비우면 승인하자마자 다음 차례에 나가요</span></div>
    <input type="datetime-local" id="t${x.id}" value="${esc(x.publish_input||suggestAt())}" step="300"
           style="width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff">
    <div class="btns">
      <button class="ghost" onclick="save(${x.id})">수정 저장</button>
      <button class="ok" onclick="approve(${x.id})">승인</button>
      <button class="no" onclick="showReject(${x.id})">반려</button>
    </div>
    <div id="rj${x.id}" hidden>
      <div class="lbl">어떻게 고칠까요? (적어주시면 그대로 다시 짜요)</div>
      <textarea id="rn${x.id}" rows="3" placeholder="예) 말투를 더 가볍게, 질문을 하나만, 숫자를 앞에"></textarea>
      <div class="btns"><button class="no" onclick="reject(${x.id})">이 방향으로 반려</button>
        <button class="ghost" onclick="document.getElementById('rj${x.id}').hidden=true">취소</button></div>
    </div>`}
  </div>`;
}

function showReject(id){ const e=$('rj'+id); e.hidden=false; $('rn'+id).focus(); }

async function act(fn,msg){
  try{ await fn(); await boot(); }catch(e){ alert((msg?msg+'\n\n':'')+String(e.message||e).replace(/^\{.*?"message":"/,'').replace(/".*$/,'')); }
}
const save=id=>act(()=>rpc('threads_queue_save',{p_id:id,p_body:$('b'+id).value,p_image_url:null,p_reply:$('r'+id).value}),'저장이 안 됐어요');
// 예약 기본값 — 지금부터 30분 뒤(5분 단위로 올림). 폰 시계가 한국이라 그대로 KST 로 들어간다.
function suggestAt(){
  const d=new Date(Date.now()+30*60000);
  d.setMinutes(Math.ceil(d.getMinutes()/5)*5,0,0);
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
const approve=id=>act(async()=>{
  await rpc('threads_queue_save',{p_id:id,p_body:$('b'+id).value,p_image_url:null,p_reply:$('r'+id).value});
  const at=($('t'+id)&&$('t'+id).value)||null;   // 비우면 즉시 발행 대상
  await rpc('threads_queue_approve',{p_id:id,p_publish_at:at});
},'승인이 안 됐어요');
const reject=id=>act(()=>rpc('threads_queue_reject',{p_id:id,p_note:$('rn'+id).value}),'반려가 안 됐어요');

async function boot(){
  if(!at()){ $('loginBox').hidden=false; $('app').hidden=true; return; }
  $('loginBox').hidden=true; $('app').hidden=false;
  let rows;
  try{ rows=await rpc('threads_queue_list'); }
  catch(e){ if(String(e.message).includes('forbidden')){ alert('관리자 계정이 아니에요'); logout(); return; } $('list').innerHTML=`<div class="empty">불러오지 못했어요<br><small>${esc(e.message)}</small></div>`; return; }
  rows=rows||[];
  ALL=rows;
  render();
}
// 🔴 탭으로 나눠 본다 (사장님 2026-10-02 "승인 누르면 사라지는 거야? 승인 전·승인·발행완료 이렇게 다 보이게")
//    승인해도 글은 그대로 있고 **승인 탭으로 옮겨갈 뿐**이다.
let ALL=[]; let TAB='pending'; const SEL=new Set();
function toggleSel(id,on){ on?SEL.add(id):SEL.delete(id); renderBulk(); }
function selAll(on){ ALL.filter(r=>r.status===TAB&&r.status!=='posted').forEach(r=>on?SEL.add(r.id):SEL.delete(r.id)); render(); }
const pad=n=>String(n).padStart(2,'0');
const fmtLocal=ms=>{ const d=new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
// 고른 개수만큼 [시작~끝] 사이에 랜덤으로 뿌리되 **최소 25분 간격**은 둔다(연달아 나가면 묻힌다)
function spreadTimes(n,startMs,endMs){
  if(endMs<=startMs) endMs=startMs+n*30*60000;
  const span=endMs-startMs, minGap=Math.min(25*60000, span/Math.max(n,1));
  let t=Array.from({length:n},()=>startMs+Math.random()*span).sort((a,b)=>a-b);
  for(let i=1;i<n;i++) if(t[i]-t[i-1]<minGap) t[i]=t[i-1]+minGap;
  const over=t[n-1]-endMs; if(over>0) t=t.map(x=>x-over);
  return t.map(x=>Math.max(x,Date.now()+3*60000));
}
function renderBulk(){
  const box=$('bulk'); const ids=[...SEL];
  if(!ids.length){ box.hidden=true; box.innerHTML=''; return; }
  box.hidden=false;
  if(!box.dataset.ready){
    const s=fmtLocal(Date.now()+30*60000), e=fmtLocal(Date.now()+4*3600*1000);
    box.innerHTML=`<b id="bcnt"></b>
      <div class="r" style="margin-top:8px"><input type="datetime-local" id="bs" value="${s}" step="300">
        <span style="color:var(--mute)">~</span><input type="datetime-local" id="be" value="${e}" step="300"></div>
      <div class="r" style="margin-top:8px">
        <button class="ok" style="flex:1" onclick="bulkApprove(true)">이 사이 랜덤 시간으로 승인</button>
        <button class="ghost" onclick="bulkApprove(false)">시간 없이 승인</button>
        <button class="ghost" onclick="SEL.clear();render()">선택 해제</button></div>`;
    box.dataset.ready='1';
  }
  const c=document.getElementById('bcnt'); if(c) c.textContent=`${ids.length}개 선택됨`;
}
async function bulkApprove(random){
  const ids=[...SEL]; if(!ids.length) return;
  const times=random?spreadTimes(ids.length,new Date($('bs').value).getTime(),new Date($('be').value).getTime()):null;
  const box=$('bulk'); box.style.opacity=.5;
  const fail=[];
  for(let i=0;i<ids.length;i++){
    const id=ids[i];
    try{
      const b=$('b'+id), r=$('r'+id);
      if(b) await rpc('threads_queue_save',{p_id:id,p_body:b.value,p_image_url:null,p_reply:r?r.value:null});
      await rpc('threads_queue_approve',{p_id:id,p_publish_at:times?fmtLocal(times[i]):null});
    }catch(e){ fail.push('#'+id+' '+String(e.message||e).replace(/^\{.*?"message":"/,'').replace(/".*$/,'')); }
  }
  box.style.opacity=1; SEL.clear();
  if(fail.length) alert('일부가 안 됐어요\n\n'+fail.join('\n'));
  await boot();
}
const TABS=[['pending','🕐 승인 전'],['approved','✅ 승인됨'],['posted','📤 발행완료'],['rejected','🔴 반려']];
function setTab(t){ TAB=t; render(); window.scrollTo(0,0); }
function render(){
  const by=s=>ALL.filter(r=>r.status===s);
  $('tabs').innerHTML=TABS.map(([s,label])=>
    `<button class="tab${TAB===s?' on':''}" onclick="setTab('${s}')">${label} <span class="tcnt">${by(s).length}</span></button>`).join('');
  renderBulk();
  const list=by(TAB);
  const hint={pending:'승인하면 「승인됨」 탭으로 옮겨가요. 사라지는 게 아니에요.',
    approved:'예약 시각이 되면 자동으로 올라가요(10분마다 확인). 시각을 안 정했으면 곧 올라가요.',
    posted:'이미 스레드에 올라간 글이에요. 링크를 눌러 확인할 수 있어요.',
    rejected:'적어주신 수정방향대로 다시 짜서 올려둘게요.'}[TAB];
  const selbar=(TAB!=='posted'&&list.length)?`<div class="r" style="display:flex;gap:8px;margin:0 0 10px">
      <button class="ghost" onclick="selAll(true)">이 탭 전부 선택</button>
      <button class="ghost" onclick="selAll(false)">전부 해제</button></div>`:'';
  // 🔴 날짜별로 묶어 보여준다 (사장님 2026-10-05 "날짜별로 내일 올라갈 글 미리 승인할 기능이 없어")
  //    예약 시각이 있으면 그 날짜로, 없으면 「날짜 미정」으로. 오늘/내일은 한글로 표시한다.
  const DOW='일월화수목금토';
  const today=new Date(), tmr=new Date(Date.now()+86400000);
  const mmdd=d=>`${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const dayLabel=k=>{
    if(k==='미정') return '📌 날짜 미정 (승인하면 바로 나가요)';
    const [m,d]=k.split('-').map(Number);
    const dt=new Date(today.getFullYear(),m-1,d);
    const w=DOW[dt.getDay()];
    if(k===mmdd(today)) return `📅 오늘 ${m}/${d}(${w})`;
    if(k===mmdd(tmr)) return `📅 내일 ${m}/${d}(${w})`;
    return `📅 ${m}/${d}(${w})`;
  };
  const grp=new Map();
  for(const r of list){ const k=(r.publish_kst||'').slice(0,5)||'미정'; if(!grp.has(k)) grp.set(k,[]); grp.get(k).push(r); }
  const keys=[...grp.keys()].sort((a,b)=>a==='미정'?1:b==='미정'?-1:a.localeCompare(b));
  const body=keys.map(k=>`<div class="sec">${dayLabel(k)} <span class="chip">${grp.get(k).length}</span></div>`+grp.get(k).map(card).join('')).join('');
  $('list').innerHTML=(list.length?`<div class="foot" style="margin:0 0 10px">${hint}</div>`+selbar+body
    :`<div class="empty">이 탭엔 글이 없어요 🙂<br><small>${hint}</small></div>`);
  $('cnt').textContent=`승인 전 ${by('pending').length} · 승인됨 ${by('approved').length} · 발행완료 ${by('posted').length} · 반려 ${by('rejected').length}`;
}
boot();
</script>
</body>
</html>
