# 구글 순위 주간 측정 (사장님 지시 2026-11-18 「매주 재서 보고하고 떨어지면 디벨롭 · PC 와 상관없이」)
#   목표 검색어 6개의 구글 평균 순위를 서치콘솔 공식 API 로 읽어 지난주와 비교한다. 원본·설명은 tools/seo/rank_weekly.mjs 첫머리.
#   결과는 Supabase ops_status 'seo-rank', 하락은 health_alerts 'seo:순위'(관리자 홈 「고장 난 것」). PC 가 꺼져도 돈다.
#   열쇠: GSC_CLIENT_ID · GSC_CLIENT_SECRET · GSC_REFRESH_TOKEN · SUPABASE_SERVICE_KEY (전부 Secrets — 없으면 스크립트가 바로 멈춘다)
name: 구글 순위 주간 측정
on:
  schedule:
    - cron: '10 22 * * 0'   # UTC 일 22:10 = KST 월 07:10
  workflow_dispatch:
    inputs:
      dry_run:
        description: '읽기만 하고 기록·경보는 하지 않는다'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: seo-rank-weekly
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/seo
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 순위 측정
        run: node tools/seo/rank_weekly.mjs ${{ github.event.inputs.dry_run == 'true' && '--dry' || '' }}
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
