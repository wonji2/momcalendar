# 화면 자동 되돌림 감시 — 서울 서버가 화면 검사를 맡는 동안(ops_status 'live-host' = server) 깃허브에 남기는 가벼운 몫 (2026-11-28 인프라부)
#   왜: 되돌림(watch_autofix.mjs)은 깃허브 토큰으로 index.html 을 되돌려 커밋·푸시한다 → 서버로 못 옮긴다. 서버가 검사 결과(site_watch)를 쓰면 이 워크플로가 10분마다 읽고,
#       「같은 index.html 로 연속 2번 실패 + 바로 전 판이 통과」 후보가 있을 때만 브라우저를 깔아 같은 조건으로 재측정한 뒤 되돌린다(조건·상한은 watch_autofix.mjs 머리 주석 그대로 — 바꾸지 않았다).
#   언제 도나: 깃허브 시계(clock)가 10분마다 workflow_dispatch 로 부른다. 담당이 server 가 아니면(= 깃허브 live-watch 가 직접 되돌림을 돈다) 몇 초 만에 끝난다. 후보가 없으면 브라우저 설치 없이 끝난다.
#   이중 되돌림 방지: 되돌림 푸시는 rebase 없이 하므로 둘이 동시에 해도 두 번째는 거절되고, 「지금 받은 index.html = 실패한 판」 검사와 하루 3번 상한이 그대로 걸려 있다.
#   시험: .github/trigger/live-autofix-test.txt 를 main 에 올리면(push) 담당 확인을 건너뛰고 한 번 돈다. 첫 줄이 selftest 면 되돌림 쓰기 경로를 가짜 기록·시험 브랜치(autofix-selftest)로만 실제로 돌려 본다.
#   시크릿: SUPABASE_SERVICE_KEY(기존)·GITHUB_TOKEN(기본)만 쓴다.
name: 화면 되돌림 감시
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/trigger/live-autofix-test.txt']
concurrency:
  group: live-autofix
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 담당 확인(서버가 맡는 중일 때만 계속)
        id: mode
        env:
          SITE_WATCH_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "시험 실행(push) — 담당 확인을 건너뛴다"; echo "server=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          out=""
          for i in 1 2 3; do
            out=$(curl -s -m 20 "https://hycaqsqeogjtbscmzrtm.supabase.co/rest/v1/ops_status?id=eq.live-host&select=payload" -H "apikey: $SITE_WATCH_KEY" -H "Authorization: Bearer $SITE_WATCH_KEY" 2>/dev/null) || out=""
            case "$out" in *'"host":'*|'[]') break;; esac
            sleep 5
          done
          if printf '%s' "$out" | grep -Eq '"host": *"server"'; then echo "server=1" >> "$GITHUB_OUTPUT"; else echo "화면 검사 담당이 서버가 아님(또는 읽기 실패) — 깃허브 live-watch 가 되돌림을 직접 돈다. 이 실행은 끝"; echo "server=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.mode.outputs.server == '1'
        with:
          sparse-checkout: |
            tools/daily
            .github/trigger
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.server == '1'
        with:
          node-version: '20'
      - name: 시험 종류 확인
        id: kind
        if: steps.mode.outputs.server == '1'
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "$(head -1 .github/trigger/live-autofix-test.txt 2>/dev/null)" = "selftest" ]; then echo "selftest=1" >> "$GITHUB_OUTPUT"; else echo "selftest=0" >> "$GITHUB_OUTPUT"; fi
      - name: 되돌림 후보 확인(가볍게)
        id: pre
        if: steps.mode.outputs.server == '1' && steps.kind.outputs.selftest != '1'
        env:
          SITE_WATCH_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOFIX_PRECHECK: '1'
        run: |
          rc=0; node tools/daily/watch_autofix.mjs || rc=$?
          if [ "$rc" = "10" ]; then echo "need=1" >> "$GITHUB_OUTPUT"; elif [ "$rc" = "0" ]; then echo "need=0" >> "$GITHUB_OUTPUT"; else echo "need=0" >> "$GITHUB_OUTPUT"; echo "사전 점검 오류 종료코드 $rc — 이 실행은 실패로 끝낸다(G7 이 성공으로 오판하지 않게)"; exit "$rc"; fi
      - name: 브라우저 준비(후보가 있거나 시험일 때만)
        if: steps.pre.outputs.need == '1' || steps.kind.outputs.selftest == '1'
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.62.1 >/dev/null
          npx --prefix /tmp/pw playwright install --with-deps chromium >/dev/null
      - name: 재측정 후 되돌리기(후보가 있을 때만)
        if: steps.pre.outputs.need == '1'
        env:
          SITE_WATCH_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_PATH: /tmp/pw/node_modules
        run: |
          mkdir -p scratchpad daily
          ln -s /tmp/pw/node_modules node_modules
          node tools/daily/watch_autofix.mjs || echo "자동 되돌림 단계 오류(다음 회차 계속)"
      - name: 되돌림 쓰기 경로 자체 시험(시험 파일 첫 줄이 selftest 일 때만)
        if: steps.kind.outputs.selftest == '1'
        env:
          SITE_WATCH_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOFIX_SELFTEST: '1'
          AUTOFIX_TEST_NOW: /tmp/brokensite
          AUTOFIX_PUSH_REF: refs/heads/autofix-selftest
          NODE_PATH: /tmp/pw/node_modules
        run: |
          mkdir -p scratchpad daily
          ln -s /tmp/pw/node_modules node_modules
          mkdir -p /tmp/brokensite && printf '<!DOCTYPE html><html><body>broken</body></html>' > /tmp/brokensite/index.html && cp test.html /tmp/brokensite/
          git fetch -q --depth 1 origin main
          git checkout -q -B selftest-work origin/main
          date; node tools/daily/watch_autofix.mjs; date
          git push -q origin --delete autofix-selftest || true
