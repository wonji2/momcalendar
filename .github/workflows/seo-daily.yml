name: 검색 노출 페이지 매일 갱신

# 공구는 매일 바뀐다. 페이지가 굳어 있으면 검색엔진이 방문 빈도를 낮춘다.
# DB 쪽 pg_cron(seo-refresh)이 04:20 KST 에 집계를 캐시에 넣어 두고,
# 여기서는 05:10 KST 에 그 캐시를 읽어 페이지를 다시 만든다.
# 데이터는 공개 키로 읽는 RPC 라서 GitHub Secret 이 필요 없다.

on:
  schedule:
    - cron: '10 20 * * *'   # UTC 20:10 = KST 05:10
  workflow_dispatch:
    inputs:
      dry_run:
        description: '커밋하지 않고 생성·검증만 한다'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seo-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 페이지 생성
        shell: pwsh
        run: ./tools/seo/build.ps1

      # 보존 페이지(다시 안 만들어지는 옛 브랜드 페이지)에 남은 깨진 내부링크를 걷어낸다.
      # 생성기가 고칠 수 없는 자리라서 여기서 쓸어야 역검증이 통과한다 (2026-10-01).
      - name: 깨진 내부링크 청소
        run: node tools/seo/link_sweep.mjs

      - name: 역검증 (실패하면 커밋하지 않는다)
        shell: pwsh
        run: |
          $out = ./tools/seo/verify.ps1
          $out | ForEach-Object { Write-Output $_ }
          if(($out -join "`n") -notmatch '통과: 문제 없음'){
            Write-Error '검증 실패 — 커밋을 중단한다'
            exit 1
          }

      - name: 변경 사항 커밋
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "momcal-bot"
          git config user.email "noreply@momcalendar.com"
          # 생성물만 add 한다. index.html·admin.html 같은 라이브 파일은
          # 자동 커밋이 절대 건드리면 안 된다(고정 규칙 0-A).
          # 2026-09-14: gg(공구 개별 페이지)·sitemap-gonggu.xml 이 add 목록에 빠져 있어 08-20 이후 손 커밋(09-09)에서 멈춰 있었다.
          #   브랜드 페이지(g/)는 매일 새 /gg/ 링크를 달고 나가는데 대상 파일은 안 올라가 라이브에 404 링크가 쌓였다(브랜드 페이지 링크의 39% 실측).
          git add g p s m d c gg sitemap.xml sitemap-main.xml sitemap-brand.xml sitemap-product.xml sitemap-seller.xml sitemap-gonggu.xml robots.txt
          git add --pathspec-from-file=tools/seo/generated.txt
          git reset -q -- index.html admin.html test.html staff.html register.html kktest.html reelcard.html
          if git diff --cached --quiet; then
            echo "바뀐 것 없음 — 커밋 생략"
          else
            N=$(git diff --cached --name-only | wc -l)
            git commit -m "검색 노출 페이지 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d') · ${N}개 파일)"
            # 🔴 2026-10-01: 이 작업이 도는 1~2분 사이에 PC 예약작업(검색량 지도 등)이 main 으로 밀면
            #   push 가 'fetch first' 로 거절되고, **다 만들어 둔 페이지를 통째로 버린다.**
            #   9/30·10/1 이틀 연속 그래서 페이지가 9/29 에 굳었다(사장님이 로슬러 페이지에서 발견).
            #   → 거절되면 원격을 끌어와 다시 얹고 다시 민다. 세 번까지.
            pushed=0
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              echo "push 거절 — 원격을 끌어와 다시 얹는다 (${i}/3)"
              git pull --rebase origin main || break   # 충돌이면 사람이 봐야 한다
              sleep 5
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::push 를 세 번 다 실패했다 — 오늘 페이지가 안 올라갔다"
              exit 1
            fi
            echo "커밋 완료: ${N}개 파일"
            echo "changed=1" >> $GITHUB_ENV
          fi

      - name: 빙·네이버에 색인 요청 (IndexNow)
        if: ${{ github.event.inputs.dry_run != 'true' && env.changed == '1' }}
        shell: pwsh
        run: ./tools/seo/indexnow.ps1
