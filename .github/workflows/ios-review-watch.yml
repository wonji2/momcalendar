# 애플 심사 상태 감시 (2026-11-03) — 3시간마다 App Store Connect API 로 상태를 읽어 바뀌면 health_alerts 'ios-review' 에 남긴다. PC 와 무관.
name: iOS 심사 감시
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch: {}
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 도구 설치
        run: python3 -m pip install -q pyjwt cryptography
      - name: 상태 읽기
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          SB_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -e
          KEY=$RUNNER_TEMP/AuthKey.p8
          printf '%s\n' "$APPLE_API_KEY_P8" | tr -d '\r' | awk '/-----BEGIN PRIVATE KEY-----/{f=1} f{print} /-----END PRIVATE KEY-----/{f=0}' > "$KEY"; chmod 600 "$KEY"
          export APPLE_API_KEY_PATH="$KEY"
          python3 ios-app/ci/review_watch.py
          rm -f "$KEY"
