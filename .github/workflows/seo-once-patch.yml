name: 검색 페이지 1회성 손질 (GA4·noai)

# 보존 페이지(다시 안 만들어지는 옛 페이지)에 구글 애널리틱스 스니펫을 넣고 noai 메타를 걷는다.
# 손으로만 돌린다(예약 없음). 폴더를 나눠 여러 번 돌리면 커밋이 작아진다: g → p → s → gg(limit 로 둘로) → m·d·c·root
# 매일 빌드(seo-daily)와 같은 줄에 세워 서로 겹치지 않게 한다. 규칙은 tools/seo/lib.ps1 PatchHeadText 한 곳.
# PC 가 꺼져도 도는가: 예(깃허브에서 돈다).

on:
  workflow_dispatch:
    inputs:
      dir:
        description: '폴더 (all = 전부)'
        type: choice
        options: [all, g, p, s, m, d, c, gg, root]
        default: all
      limit:
        description: '이번에 고칠 최대 파일 수 (0 = 전부)'
        type: string
        default: '0'
      dry_run:
        description: '세기만 하고 커밋하지 않는다'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: seo-daily
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 손질
        shell: pwsh
        env:
          IN_DIR: ${{ github.event.inputs.dir }}
          IN_LIMIT: ${{ github.event.inputs.limit }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          $a = @{}
          if($env:IN_DIR -and $env:IN_DIR -ne 'all'){ $a.Dir = $env:IN_DIR }
          $lim = 0; [void][int]::TryParse("$($env:IN_LIMIT)", [ref]$lim); if($lim -gt 0){ $a.Limit = $lim }
          if($env:IN_DRY -eq 'true'){ $a.DryRun = $true }
          ./tools/seo/patch_kept_once.ps1 @a

      - name: 변경 사항 커밋
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          IN_DIR: ${{ github.event.inputs.dir }}
        run: |
          git config user.name  "momcal-bot"
          git config user.email "noreply@momcalendar.com"
          # 생성물만 add 한다. 라이브 파일은 절대 건드리지 않는다(고정 규칙 0-A).
          git add g p s m d c gg
          git add --pathspec-from-file=tools/seo/generated.txt
          git reset -q -- index.html admin.html test.html test-app.html staff.html register.html kktest.html reelcard.html tools/seo/generated.txt
          if git diff --cached --quiet; then
            echo "바뀐 것 없음 — 커밋 생략"
            exit 0
          fi
          N=$(git diff --cached --name-only | wc -l)
          git commit -q -m "GA4 태그·noai 메타 일괄 패치 (${IN_DIR}/, ${N}개)"
          pushed=0
          for i in 1 2 3; do
            if git push; then pushed=1; break; fi
            echo "push 거절 — 원격을 끌어와 다시 얹는다 (${i}/3)"
            git pull --rebase --autostash origin main || break
            sleep 5
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::push 를 세 번 다 실패했다"
            exit 1
          fi
          echo "커밋 완료: ${N}개 파일"
