name: 아침 인스타 카드 만들기

# 사장님 지시 2026-08-09: 매일 아침 8시에 그날 카드 사진과 캡션을 받아보고 싶다.
# 07:40 에 카드를 만들어 /daily/ 에 올리고, 08:00 에 푸시로 알린다.
# reelcard.html 이 쓰는 html2canvas 를 그대로 쓰려면 진짜 브라우저가 필요해서 Playwright 를 쓴다.

on:
  schedule:
    - cron: '40 22 * * *'    # UTC 22:40 = KST 07:40
  workflow_dispatch:
    inputs:
      day:
        description: '만들 날짜 (비우면 오늘)'
        required: false

permissions:
  contents: write

concurrency:
  group: daily-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Playwright 설치
        run: npx --yes playwright@1.47.0 install --with-deps chromium

      - name: 카드·캡션 만들기
        env:
          DAY: ${{ github.event.inputs.day }}
        run: node tools/daily/make-card.mjs

      - name: 커밋
        run: |
          git config user.name  "momcal-bot"
          git config user.email "noreply@momcalendar.com"
          git add daily
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "아침 인스타 카드 ($(TZ=Asia/Seoul date '+%Y-%m-%d'))"
            git push
          fi
