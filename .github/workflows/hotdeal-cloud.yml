name: 핫딜 24시간 무인 자동 수집

# 사장님 지시 2026-11-01: 베이비핫딜(bbhd.kr) 수집기를 PC 예약(momcal-baby-hotdeal, claude -p 2시간)에서 깃허브 클라우드로 완전히 옮긴다 — PC 가 꺼져도 30분마다, 토큰 0원(파이썬만).
#   · tools/daily/baby_hotdeal_auto.py: bbhd 새 글 → 상품 링크 → 우리 수익링크(쿠팡 딥링크·링크프라이스·오늘의집) → hotdeals 등록. 진행 번호는 DB ops_status 'bbhd-last-id'.
#   · 비밀값은 깃허브 시크릿으로만: SUPABASE_TRIAGE_TOKEN(관리 API 로 SQL) · PUSH_CRON_SECRET(coupang-hotdeal 함수 호출). 코드에 박지 않는다(11-01 공개 저장소 유출 사고).
#   · 같은 글을 두 길이 동시에 처리하지 않게 PC 예약 momcal-baby-hotdeal 은 끈다(이 워크플로가 첫 회차를 통과한 뒤).
#
# 🔴 2026-11-12 사장님 「핫딜 최근 등록이 119분 전인데 멈춘 거 아녀? · PC 꺼져도 돌게 해야지」
#   15분 예약(schedule)을 깃허브가 건너뛰어 실제로는 5~6시간에 한 번만 돌았다(11-11~12 실측 01:31 → 07:56 → 12:43). 깃허브 schedule 은 믿을 수 없다.
#   → 한 번 깨면 **그 안에서 15분마다 수집을 반복하며 5시간 20분 살아 있고**, 끝날 때 **다음 회차를 스스로 깨운다**(workflow_dispatch —
#     GITHUB_TOKEN 으로 부른 workflow_dispatch 는 새 실행을 만든다는 깃허브 예외 규칙, actions: write 권한). 그래서 PC·개인 토큰 없이 24시간 이어진다.
#   · schedule 은 사슬이 끊겼을 때 다시 잇는 예비로 남긴다. concurrency 로 한 번에 하나만 돈다(대기는 하나만 남는다).
#   · 공개 저장소라 실행 시간은 무료. 쿠팡 딥링크는 회차 5 · 하루 19 · 서버 원자 카운터(함수 40과 합계 59 상한) · 간격 2.1초 — 2026-11-23 예산 관문(coupang_budget_take), 시간대 누적 상한 06~12시 5·12~18시 12·18~24시 19.
#   · 서버 크론 hotdeal-stall-watch 가 3시간 무등록을 경보한다.
# 2026-11-22: schedule 15분 → 1시간(사장님 「1시간으로해 예비는」 — 오더서의 2시간을 바꿈). 24시간 유지·15분 수집은 사슬(workflow_dispatch)이 하고, schedule 은 사슬이 끊겼을 때의 예비다(복구 상한 1시간 < 서버 크론 hotdeal-stall-watch 3시간 경보).
on:
  workflow_dispatch:
  push:   # 이 파일을 고쳐 올리면 바로 한 번 돌아 사슬을 (다시) 시작한다
    branches: [main]
    paths: ['.github/workflows/hotdeal-cloud.yml']

concurrency:
  group: hotdeal-cloud
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/daily/baby_hotdeal_auto.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 핫딜 수집 15분마다 반복(5시간 20분)
        env:
          SUPABASE_TRIAGE_TOKEN: ${{ secrets.SUPABASE_TRIAGE_TOKEN }}
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
          MOMCAL_INTERNAL_SECRET: ${{ secrets.MOMCAL_INTERNAL_SECRET }}   # 우리 주소를 부를 때 붙는 아군 인증 머리말(없으면 빈 값)
        run: |
          # 🔴 2026-11-27 서버 전환 스위치: DB ops_status 'hotdeal-host' 의 host 가 'server' 이면 이 사슬은 수집을 하지 않고 스스로 끝난다(서울 서버가 맡는 중).
          #    읽기에 실패하거나 값이 없으면 지금까지처럼 계속 돈다(실패해도 수집이 멈추지 않는 쪽). 되돌리기: host 를 'github' 로 → 시계(clock)가 매시간 부르는 회차가 사슬을 다시 시작.
          # 읽기 실패는 3번(10초 간격) 다시 해 보고, 그래도 답이 없을 때만 「서버 아님」으로 본다(동시 수집 틈을 줄이되 읽기 장애로 수집이 멎지는 않게).
          server_mode() {
            [ -n "${SUPABASE_TRIAGE_TOKEN:-}" ] || return 1
            local i out
            for i in 1 2 3; do
              out=$(curl -s -m 20 -X POST https://api.supabase.com/v1/projects/hycaqsqeogjtbscmzrtm/database/query \
                -H "Authorization: Bearer $SUPABASE_TRIAGE_TOKEN" -H 'Content-Type: application/json' \
                -d '{"query":"select payload->>'\''host'\'' as h from ops_status where id = '\''hotdeal-host'\''"}' 2>/dev/null) || out=""
              case "$out" in
                *'"h":"server"'*) return 0;;
                *'"h":'*|'[]') return 1;;
              esac
              sleep 10
            done
            return 1
          }
          if server_mode; then echo "서버가 핫딜을 맡는 중(ops_status hotdeal-host) — 이 회차는 수집하지 않고 끝낸다"; : > /tmp/hd_server_mode; exit 0; fi
          end=$(( $(date +%s) + 320*60 ))
          n=0
          while :; do
            n=$((n+1))
            echo "=== 회차 $n · $(TZ=Asia/Seoul date '+%m-%d %H:%M') KST ==="
            timeout 600 python3 tools/daily/baby_hotdeal_auto.py || echo "회차 $n 실패 — 다음 회차는 계속"
            [ $(( $(date +%s) + 900 )) -ge $end ] && break
            # 15분 쉬되 1분마다 서버가 맡았는지 본다(맡았으면 바로 끝냄)
            for i in $(seq 15); do
              sleep 60
              if server_mode; then echo "서버가 핫딜을 맡았다 — 사슬을 끝낸다"; : > /tmp/hd_server_mode; break 2; fi
            done
          done
          echo "총 $n 회차"
      - name: 다음 회차 깨우기(사슬 잇기)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/hd_server_mode ]; then echo "서버가 맡는 중 — 사슬을 잇지 않는다(시계가 매시간 부르는 회차가 서버 담당이 끝나면 다시 시작)"; exit 0; fi
          gh workflow run hotdeal-cloud.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}" && echo "다음 실행 예약됨"
