# PC 예약작업(로그인·AI·PC 파일이 필요 없는 것)을 깃허브 서버에서 — 컴퓨터가 꺼져도 돈다 (2026-11-01, 사장님 「24시간 무인」 · 무토큰 · Node 그대로)
#   어떤 작업이 어느 시각에 도는지는 tools/daily/cloud_jobs.mjs 의 JOBS 표가 원본이다. 아래 schedule 은 그 표의 cron 과 글자까지 같아야 한다
#   (github.event.schedule 문자열로 작업을 고른다). 손으로: Actions › Run workflow › job 에 작업 이름(예 cat_guard).
#   알림은 health_alerts(kind pc:<키>) 로, 실패는 cloud:<작업> 으로 — ops.html 「알림」·오류 레이더에 보인다. PC 알림줄(_alert.txt)은 건드리지 않는다.
name: PC 작업 클라우드 실행
on:
  schedule:
    - cron: '10 20 * * *'
    - cron: '20 22 * * *'
    - cron: '20 0 * * *'
    - cron: '7,37 * * * *'
    - cron: '50 */3 * * *'
    - cron: '50 0 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: '작업 이름 하나(cloud_jobs.mjs --list 참고)'
        required: true
concurrency:
  # 회차(cron 문자열)·손 실행 작업별로 따로 — 한 그룹으로 묶으면 대기 중인 회차가 서로 취소된다(2026-11-01 실측, 깃허브는 대기 1개만 남김).
  # 동시 접속으로 무료 Nano DB 가 거부하는 건 sb_cli_retry.sh 가 15·30·45초 재시도로 받는다
  group: pc-jobs-${{ github.event.schedule || github.event.inputs.job }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SB_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TRIAGE_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUD_CRON: ${{ github.event.schedule }}
      CLOUD_JOB: ${{ github.event.inputs.job }}
      SUPABASE_CLI: tools/daily/sb_cli_retry.sh   # 접속 거부 시 재시도하는 CLI 대역
      MOMCAL_CLOUD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/daily
            supabase
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: DB 연결(PC 와 같은 설정, 비밀번호 없음)
        run: |
          mkdir -p scratchpad supabase/.temp
          echo -n hycaqsqeogjtbscmzrtm > supabase/.temp/project-ref
          echo '{"ref":"hycaqsqeogjtbscmzrtm","name":"wonji2'"'"'s Project","organization_id":"lgnkcdsqsaksvrzxeexg","organization_slug":"lgnkcdsqsaksvrzxeexg"}' > supabase/.temp/linked-project.json
          echo -n postgresql://postgres.hycaqsqeogjtbscmzrtm@aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres > supabase/.temp/pooler-url
          echo -n 17.6.1.127 > supabase/.temp/postgres-version
          chmod +x tools/daily/sb_cli_retry.sh
          echo "select 1 as ok;" > /tmp/ping.sql && tools/daily/sb_cli_retry.sh db query --linked --output-format json -f /tmp/ping.sql
      - name: 피드 묶음이 필요한 회차인가
        id: nb
        run: echo "need=$(node tools/daily/cloud_jobs.mjs --needs-bundle)" >> $GITHUB_OUTPUT
      - name: 피드 묶음 번호(캐시 열쇠)
        id: bundle
        if: steps.nb.outputs.need == '1'
        run: |
          at=$(curl -s -H "apikey: $SB_SERVICE_KEY" -H "Authorization: Bearer $SB_SERVICE_KEY" https://hycaqsqeogjtbscmzrtm.supabase.co/storage/v1/object/cloud-bundle/manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).at.replace(/[^0-9]/g,""))}catch{console.log("none")}})')
          echo "at=$at" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        if: steps.nb.outputs.need == '1'
        with:
          path: scratchpad/_bundle
          key: cloud-bundle-${{ steps.bundle.outputs.at }}
      - name: 브라우저가 필요한 회차인가
        id: pw
        run: echo "need=$(node tools/daily/cloud_jobs.mjs --needs-pw)" >> $GITHUB_OUTPUT
      - name: 브라우저 준비
        if: steps.pw.outputs.need == '1'
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.62.1 >/dev/null
          npx --prefix /tmp/pw playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE" && ln -s /tmp/pw/node_modules node_modules
      - name: 작업 실행
        run: node tools/daily/cloud_jobs.mjs
#   (2026-11-01 13:05 예약 재등록용 수정 — 09:36 저장소 삭제 사고 뒤 schedule 이 멈춰 있다)
