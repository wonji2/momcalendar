# 라이브 배포의 유일한 길 — 2중 방어선 (2026-11-22 사고 뒤)
#   main 이 망가져도 게이트(tools/deploy_gate_check.sh)를 못 넘으면 배포하지 않는다
#   → 라이브는 '마지막으로 성공한 배포'를 계속 서비스한다(404 로 내려가지 않는다).
#   ⚠ Pages 설정의 Source 가 「GitHub Actions」 여야 이 워크플로가 라이브를 올린다(§4-3).
#   ⚠ GITHUB_TOKEN 으로 만든 푸시는 다른 워크플로를 깨우지 못한다. 그래서 자동 작업이 올린 판은
#      workflow_run 으로 받는다. 아래 이름을 바꾸면 그 자동 작업의 배포가 끊긴다 → 이름 바꿀 땐 여기도 같이.
name: 라이브 배포 (안전 게이트)

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - 검색 노출 페이지 매일 갱신
      - PC 작업 클라우드 실행
      - 아침 인스타 카드 만들기
      - 손님 화면 실시간 검사
      - 제보 자동 코드 수정
      - 고장 자동 수리
      - 손님 제보 클라우드 처리
      - 핫딜 24시간 무인 자동 수집
      - befe-sale-auto
      - 검색 페이지 1회성 손질 (GA4·noai)
      - 구글 순위 주간 측정
      - 배너 파생본 만들기
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '검증만 하고 배포는 건너뛴다'
        type: boolean
        default: false

permissions:
  contents: write      # backup/last-good 갱신(§5-2)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      STRIP_INTERNAL: '1'   # 손님 파일 주석 떼기·내부 낱말 게이트(2026-11-25). '0' 이면 둘 다 건너뜀 — 되돌리기는 이 한 줄
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      go: ${{ steps.mode.outputs.go }}
    steps:
      # 2026-11-22 덧붙임: Pages 가 아직 legacy(브랜치에서 빌드)면 이 워크플로는 아무것도 올리지 않는다.
      #   그대로 두면 이 파일이 올라가는 순간부터 main 푸시·자동 작업마다 1GB 실배포를 시도한다(전환은 dry_run 통과 뒤에만 — 사장님 지시).
      #   dry_run 은 legacy 에서도 끝까지(게이트·아티팩트 업로드) 돌려 전환해도 되는지 본다.
      - id: mode
        name: Pages 방식 확인 (legacy 면 건너뜀)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BT=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages" | python3 -c "import json,sys;print(json.load(sys.stdin).get('build_type',''))" || echo '')
          echo "Pages build_type=$BT · dry_run=${{ github.event.inputs.dry_run }}"
          if [ "$BT" = "workflow" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "go=0" >> "$GITHUB_OUTPUT"; echo "::notice::Pages 가 workflow 방식이 아니라 배포를 건너뛴다(라이브는 legacy 빌드가 올린다)"; fi

      - uses: actions/checkout@v4
        if: ${{ steps.mode.outputs.go == '1' }}
        with:
          ref: main          # 트리거와 무관하게 '지금 main' 을 올린다
          fetch-depth: 1

      - id: meta
        if: ${{ steps.mode.outputs.go == '1' }}
        name: 올릴 판 기록
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git log -1 --format='판: %h %s'

      - name: 게이트 검증 (망가진 판이면 여기서 멈춘다)
        if: ${{ steps.mode.outputs.go == '1' }}
        run: bash tools/deploy_gate_check.sh

      - uses: actions/configure-pages@v5
        if: ${{ steps.mode.outputs.go == '1' }}
      - name: 손님 사이트에 올릴 파일만 추리기 (운영 문서·수집 코드·내부 폴더 제외 — 사장님 2026-11-24 「다 막아야지」)
        if: ${{ steps.mode.outputs.go == '1' }}
        run: |
          # 저장소에는 자동화가 쓰는 코드가 그대로 있다(깃허브 Actions·PC 가 돌린다). 사이트로만 안 나가게 거른다.
          SITE="${RUNNER_TEMP}/site"
          rm -rf "$SITE"; mkdir -p "$SITE"
          rsync -a --delete             --exclude=".git" --exclude="/.github/" --exclude="/.githooks/" --exclude="/.maestro/" --exclude="/.gitignore"             --exclude="/tools/" --exclude="/supabase/" --exclude="/scripts/" --exclude="/orders/" --exclude="/handoffs/"             --exclude="/scratchpad/" --exclude="/sns-automation/" --exclude="/android-app/" --exclude="/ios-app/"             --exclude="*.md" --exclude="*.py" --exclude="*.mjs" --exclude="*.cjs" --exclude="*.sh" --exclude="*.sql"             --exclude="*.ps1" --exclude="*.bat" --exclude="*.tsv" --exclude="*.yml" --exclude="*.yaml" --exclude="*.ts"             --exclude="*.env" --exclude="*mock*.html" --exclude="/daily/*.txt" --exclude="/daily/**/*.txt" --exclude="/daily/cardnews/queue.json" --exclude="/data/offline_sales_aff.json" --exclude="/staff_test.html" --exclude="/fontcheck.html" --exclude="/tz.html"             ./ "$SITE/"
          # 2026-11-25 보안 점검: 내부용 txt·json·옛 시험 화면도 뺀다(staff_test·fontcheck·tz · daily 아래 캡션 txt · 제휴 단가 json)
          for f in CLAUDE.md 작업규칙.md baby_hotdeal_auto.py tools supabase orders staff_test.html data/offline_sales_aff.json daily/cardnews/queue.json; do
            if [ -e "$SITE/$f" ]; then echo "::error::$f 가 사이트 묶음에 남았다"; exit 1; fi
          done
          for f in index.html test.html admin.html sw.js CNAME manifest.json data/offline_sales.json; do
            if [ ! -e "$SITE/$f" ]; then echo "::error::$f 가 사이트 묶음에서 빠졌다"; exit 1; fi
          done
          echo "사이트 묶음 파일 $(find "$SITE" -type f | wc -l) 개 (저장소 $(git ls-files | wc -l) 개)"
      # 주석 떼기 — 손님이 받는 HTML·JS·CSS 에서 주석(내부 메모·사장님 지시 인용·내부 경로)만 뺀다. 저장소 원본은 그대로(사장님 2026-11-25 승인).
      #   검증된 파서(acorn 8.16.0 고정 설치)로 주석 범위만 지우고, 지운 뒤 구문 트리가 원본과 같을 때만 쓴다. 의심되면 그 파일은 원본 그대로 두고 경고.
      #   🔁 되돌리기 한 줄: 위 jobs.deploy.env 의 STRIP_INTERNAL 을 '0' 으로 → 두 단계를 건너뛰고 예전처럼 올라간다.
      - uses: actions/setup-node@v4
        if: ${{ steps.mode.outputs.go == '1' && env.STRIP_INTERNAL == '1' }}
        with:
          node-version: '24.18.0'   # PC 에서 시험한 판에 고정
      - name: JS 파서 고정 설치 (acorn 8.16.0 — 공개 배포판, 버전 고정)
        if: ${{ steps.mode.outputs.go == '1' && env.STRIP_INTERNAL == '1' }}
        run: npm install --no-save --no-audit --no-fund --ignore-scripts --prefix "${RUNNER_TEMP}/acorn" acorn@8.16.0
      - id: strip
        name: 주석 떼기 (손님 파일의 내부 메모 빼기 · 파서를 못 불러오면 멈춤)
        if: ${{ steps.mode.outputs.go == '1' && env.STRIP_INTERNAL == '1' }}
        env:
          ACORN_DIR: ${{ runner.temp }}/acorn/node_modules
        run: node tools/site_strip_comments.mjs "${RUNNER_TEMP}/site"
      - id: gate
        name: 내부 메모 게이트 (사장님 지시 인용·내부 경로·경쟁사 이름이 손님 화면 파일에 남으면 배포 멈춤)
        if: ${{ steps.mode.outputs.go == '1' && env.STRIP_INTERNAL == '1' }}
        run: node tools/site_internal_gate.mjs "${RUNNER_TEMP}/site"
      - name: 게이트가 막으면 관리자 화면 경보 (라이브는 직전 판 유지)
        if: ${{ failure() && (steps.gate.outcome == 'failure' || steps.strip.outcome == 'failure') }}
        env:
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY: ${{ github.event.inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$SB_KEY" ] || { echo "::warning::SUPABASE_SERVICE_KEY 없음 — 경보 못 남김"; exit 0; }
          SB=https://hycaqsqeogjtbscmzrtm.supabase.co/rest/v1
          SINCE=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)
          # 같은 경보는 3시간에 한 번(막혀 있는 동안 배포 시도마다 쌓이지 않게)
          N=$(curl -s --fail "$SB/health_alerts?kind=eq.deploy:%EB%82%B4%EB%B6%80%EB%82%B1%EB%A7%90&created_at=gt.$SINCE&select=id&limit=1" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" | python3 -c "import json,sys;print(len(json.load(sys.stdin)))" || echo 0)
          [ "$N" = "0" ] || { echo "3시간 안에 같은 경보가 있어 건너뜀"; exit 0; }
          python3 -c "import json,os;d=os.environ.get('DRY')=='true';print(json.dumps({'kind':'deploy:내부낱말','detail':('🟡 [시험 실행] ' if d else '🔴 ')+'손님 화면 파일에 내부 메모(사장님 지시 인용·내부 경로·경쟁사 이름)가 남아 '+('시험에서 걸렸습니다.' if d else '라이브 배포를 멈췄습니다. 라이브는 직전 판 그대로.')+' 고칠 곳: '+os.environ['RUN_URL']}))" > /tmp/alert.json
          curl -s --fail -o /dev/null -w "경보 %{http_code}" -X POST "$SB/health_alerts" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -H "Prefer: return=minimal" --data @/tmp/alert.json
      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.mode.outputs.go == '1' }}
        with:
          path: ${{ runner.temp }}/site
      - name: 올린 묶음이 보일 때까지 잠깐 기다림 (바로 찾으면 「0개」로 실패하던 깃허브 시간차, 11-23 두 번)
        if: ${{ steps.mode.outputs.go == '1' }}
        run: sleep 20

      - id: deployment
        name: 배포
        if: ${{ steps.mode.outputs.go == '1' && github.event.inputs.dry_run != 'true' }}
        uses: actions/deploy-pages@v4

      - name: 배포 직후 라이브 확인 (실패해도 배포 자체는 유지 — 백업은 다음 잡이 판단)
        if: ${{ steps.mode.outputs.go == '1' && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: bash tools/live_verify.sh

  backup:
    needs: deploy
    if: ${{ needs.deploy.outputs.go == '1' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.deploy.outputs.sha }}
          fetch-depth: 1

      - name: 라이브 재확인 — 여기서 통과해야만 '정상 판'으로 인정한다
        run: bash tools/live_verify.sh

      - name: backup/last-good 갱신 (고정 브랜치 1개만 유지)
        run: |
          SHA=$(git rev-parse HEAD)
          N=$(git ls-files | wc -l)
          echo "정상 판: $SHA · 파일 $N 개"
          [ "$N" -ge 45000 ] || { echo "::error::파일 $N 개 — 백업하지 않는다"; exit 1; }
          git push --force origin "$SHA:refs/heads/backup/last-good"
          echo "✅ backup/last-good → $SHA"
