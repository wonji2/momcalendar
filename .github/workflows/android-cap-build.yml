# 맘캘린더 안드로이드 앱 빌드 — Capacitor 웹뷰 (아이폰 앱과 같은 방식) · 2026-10-26
#
# 왜 TWA(크롬)를 버렸나
#   TWA 는 크롬이 사이트를 그대로 띄우는 구조라, 바깥 링크를 페이지가 앱으로 넘길 수 없고(크롬이 막는다 —
#   chromium components/external_intents/README.md) 누를 때마다 「Chrome / NAVER」 선택창이 떴다.
#   한국 웹뷰 앱의 정석(카카오 하이브리드 가이드·토스페이먼츠 dev-4)은 **앱 코드가 링크를 연다** → android-app/cap/native/LinkRouter.java
#
# 이 워크플로가 하는 일
#   build 잡: npx cap add android → install_native.mjs(링크·위젯·아이콘·서명) → 시험용 APK(웹뷰 디버깅 켬) + 출시용 APK·AAB
#   e2e 잡: 에뮬레이터(API 35, 크롬 있음)에 시험용 APK 를 깔고 android-app/cap/e2e/run.mjs 로 되던 것을 하나씩 확인
#
# 시크릿: ANDROID_KEYSTORE_B64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_PASSWORD (TWA 와 같은 업로드 키)
#         GOOGLE_SERVICES_JSON (있으면 알림 켬 — Firebase 프로젝트 필요)
# 버전: Capacitor 8.5.3 = targetSdk 36 (Play 는 2026-08-31 부터 새 앱·업데이트에 API 36 을 요구), JDK 21, Node 22
# 실행: Actions → "안드로이드 앱 빌드 (웹뷰)" → Run workflow → versionCode (TWA 판보다 크게)

name: 안드로이드 앱 빌드 (웹뷰)

on:
  # 매일 밤 자동 점검(사장님 2026-10-26 「앱 버그 스스로 검증」) — KST 03:40, 라이브 사이트를 띄운 시험용 앱을 에뮬레이터에서 돌린다.
  #   사이트를 고치다 앱에서만 깨지는 것을 다음 날 아침 전에 잡는다. 실패하면 GitHub 가 메일을 보내고,
  #   PC 의 tools/daily/app_e2e_watch.mjs 가 사장님 알림줄(health_alerts)에 올린다. 출시용 산출물은 만들지만 Play 에는 안 올린다.
  schedule:
    - cron: '40 18 * * *'
  workflow_dispatch:
    inputs:
      versionCode:
        description: "versionCode (정수 · 지난번보다 크게)"
        required: true
        default: "10"
      e2eUrl:
        description: "시험용 앱이 띄울 주소 (라이브에 올리기 전엔 test-app.html(앱 테스트, 2026-10-26 웹 테스트와 분리), 올린 뒤엔 https://momcalendar.com/ 로 한 번 더)"
        required: true
        default: "https://momcalendar.com/test-app.html"
      pushTest:
        description: "알림 도착 시험(1 = PC 의 scratchpad/fcm_e2e_watch.mjs 가 시험 알림을 보내는 동안만)"
        required: false
        default: "0"

concurrency:
  group: android-cap-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 아이콘 만드는 도구(ImageMagick)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick >/dev/null
          convert -version | head -1

      - name: 의존성 설치
        working-directory: android-app/cap
        run: npm install --no-audit --no-fund

      - name: 오프라인 화면(www) 준비
        working-directory: android-app/cap
        run: |
          mkdir -p www
          cp ../../ios-app/www/index.html www/index.html

      - name: 안드로이드 프로젝트 생성 (cap add android)
        working-directory: android-app/cap
        run: |
          npx cap add android
          npx cap sync android

      - name: 맘캘린더 코드 끼우기 (시험용 — 웹뷰 디버깅 켬)
        working-directory: android-app/cap
        env:
          VERSION_CODE: ${{ inputs.versionCode || github.run_number }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          E2E: '1'
          E2E_URL: ${{ inputs.e2eUrl || 'https://momcalendar.com/' }}
        run: node install_native.mjs

      - name: 업로드 키 복원
        working-directory: android-app/cap
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > upload.p12
          test -s upload.p12 || (echo "🔴 키스토어 시크릿이 비어 있다"; exit 1)

      - name: 시험용 APK
        working-directory: android-app/cap/android
        env:
          KS_PATH: ${{ github.workspace }}/android-app/cap/upload.p12
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: momcal
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p ../../../out ../../../out-e2e
          cp app/build/outputs/apk/release/app-release.apk ../../../out-e2e/momcalendar-e2e.apk

      - name: 출시용 APK·AAB (웹뷰 디버깅 끔)
        working-directory: android-app/cap
        env:
          KS_PATH: ${{ github.workspace }}/android-app/cap/upload.p12
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: momcal
        run: |
          node -e "const f='android/app/src/main/assets/capacitor.config.json';const fs=require('fs');const c=JSON.parse(fs.readFileSync(f,'utf8'));c.android={...(c.android||{}),webContentsDebuggingEnabled:false};c.server={...(c.server||{}),url:'https://momcalendar.com'};fs.writeFileSync(f,JSON.stringify(c,null,2));console.log('debug',c.android.webContentsDebuggingEnabled,c.server.url)"
          cd android
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../../out/momcalendar-v${{ inputs.versionCode || github.run_number }}.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../../out/momcalendar-v${{ inputs.versionCode || github.run_number }}.aab
          ls -la ../../../out
          # 서명 확인 — 업로드 키 지문이 assetlinks 와 같아야 앱 링크(카카오 로그인 뒤 돌아오기)가 된다
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs ../../../out/momcalendar-v${{ inputs.versionCode || github.run_number }}.apk | grep -i "SHA-256"

      # 시험용(test.html·웹뷰 디버깅 켬)과 출시용을 따로 — 출시용은 e2e 를 통과해야 publish 잡이 정식 이름으로 올린다(검증자 지적)
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-apk-v${{ inputs.versionCode || github.run_number }}
          path: out-e2e/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: unverified-release-v${{ inputs.versionCode || github.run_number }}
          path: out/
          retention-days: 3
          if-no-files-found: error

  e2e:
    needs: build
    runs-on: ubuntu-latest
    env:
      E2E_URL: ${{ inputs.e2eUrl || 'https://momcalendar.com/' }}
      E2E_PUSH: ${{ inputs.pushTest || '0' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: e2e-apk-v${{ inputs.versionCode || github.run_number }}
          path: out
      - name: KVM 켜기 (에뮬레이터 가속 — android-emulator-runner 안내)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 에뮬레이터에서 앱 시험
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # 각 줄은 따로 실행된다(emulator-runner). Maestro 화면 시험(.maestro/)은 처음엔 결과만 남기고 출시를 막지 않는다
          script: |
            # Maestro 를 먼저 — 시험 서버의 가상 폰이 run.mjs 도중 사라지면 뒤 순서인 Maestro 가 한 번도 못 돌았다(2026-10-26 세 판). 끝나면 지우고 run.mjs 는 「처음 켤 때」부터
            mkdir -p e2e-out/maestro
            curl -Ls "https://get.maestro.mobile.dev" | bash || touch e2e-out/maestro_failed.txt
            adb install -r out/momcalendar-e2e.apk
            $HOME/.maestro/bin/maestro test --env APP_ID=com.wantsb.momcalendar --test-output-dir e2e-out/maestro --format junit --output e2e-out/maestro.xml .maestro/ || touch e2e-out/maestro_failed.txt
            adb uninstall com.wantsb.momcalendar || true
            node android-app/cap/e2e/run.mjs out/momcalendar-e2e.apk || touch e2e-run-failed
            test ! -f e2e-run-failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-v${{ inputs.versionCode || github.run_number }}
          path: e2e-out/
          retention-days: 30

  publish:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unverified-release-v${{ inputs.versionCode || github.run_number }}
          path: out
      - uses: actions/upload-artifact@v4
        with:
          name: momcalendar-android-webview-v${{ inputs.versionCode || github.run_number }}
          path: out/
          retention-days: 30
          if-no-files-found: error
