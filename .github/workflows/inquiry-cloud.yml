# 손님 제보를 PC 와 상관없이 10분 안에 처리 (사장님 2026-10-27 「피시랑 상관없이 제보 받는대로 바로바로 고쳐」)
#   ① 새 제보가 없으면 바로 끝(외부 호출 없음 — 몇 초)
#   ② 있으면 PC 가 올려 둔 판정 묶음(PC 판 코드 + 인스타 피드 + 리틀리, tools/daily/cloud_bundle.mjs 3시간)을 받아
#      PC 와 같은 처리기(tools/daily/inquiry_triage.mjs --no-ai)를 돌린다 → 셀러 원본으로 고치고 닫거나 「확인 필요」
#   ③ 처리 기록(로그·되돌리기 TSV)은 비공개 저장소 cloud-bundle/runs/<실행번호>/ 에 남긴다
#   묶음이 48시간보다 낡았으면(PC 가 이틀 넘게 꺼짐 — 인포크는 클라우드가 그 자리에서 다시 읽는다) 고치지 않는다. AI 원본 조사는 PC 몫(2시간에 1번).
#   PC 처리기(momcal-inquiry-triage 매시 25분)와 겹쳐도 제보 상태는 「새 것일 때만」 바꿔 먼저 끝난 쪽만 적힌다.
#   손으로: Actions › 이 작업 › Run workflow · dry_ids 에 「5,9」 처럼 넣으면 DB 안 고치고 판정만(PC 판정과 대조용)
name: 손님 제보 클라우드 처리
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      dry_ids:
        description: '판정만 볼 제보 번호(쉼표) — 비우면 실제 처리'
        required: false
        default: ''
concurrency:
  group: inquiry-cloud
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SB_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TRIAGE_TOKEN }}
      DRY_IDS: ${{ github.event.inputs.dry_ids }}
    steps:
      - name: 새 제보 확인
        id: chk
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "DB 토큰(SUPABASE_TRIAGE_TOKEN) 없음 — 건너뜀"; echo "go=0" >> $GITHUB_OUTPUT; exit 0; fi
          n=$(curl -s "https://hycaqsqeogjtbscmzrtm.supabase.co/rest/v1/inquiries?select=id&or=(status.is.null,status.eq.new,status.eq.)" -H "apikey: $SB_SERVICE_KEY" -H "Authorization: Bearer $SB_SERVICE_KEY" | grep -o '"id"' | wc -l)
          echo "새 제보 $n건 · 시험 번호 '${DRY_IDS}'"
          if [ "$n" -gt 0 ] || [ -n "$DRY_IDS" ]; then echo "go=1" >> $GITHUB_OUTPUT; else echo "go=0" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.go == '1'
        with:
          sparse-checkout: |
            tools/daily
            supabase
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.go == '1'
        with:
          node-version: '20'
      - uses: supabase/setup-cli@v1
        if: steps.chk.outputs.go == '1'
        with:
          version: latest
      - name: 판정 묶음 받기
        id: get
        if: steps.chk.outputs.go == '1'
        run: |
          mkdir -p scratchpad/handoff-log supabase/.temp
          echo -n hycaqsqeogjtbscmzrtm > supabase/.temp/project-ref
          node tools/daily/cloud_bundle_get.mjs
      - name: 처리
        if: steps.chk.outputs.go == '1'
        env:
          SUPABASE_CLI: supabase
        run: |
          if [ -n "$DRY_IDS" ]; then node tools/daily/inquiry_triage.mjs --dry --ids "$DRY_IDS"; else node tools/daily/inquiry_triage.mjs --no-ai; fi
      - name: 처리 기록 남기기
        if: always() && steps.chk.outputs.go == '1'
        run: |
          for f in scratchpad/inquiry_triage_log.txt scratchpad/handoff-log/*.tsv scratchpad/date_audit/log.txt; do
            [ -f "$f" ] || continue
            curl -s -o /dev/null -w "$f %{http_code}\n" -X POST "https://hycaqsqeogjtbscmzrtm.supabase.co/storage/v1/object/cloud-bundle/runs/${GITHUB_RUN_ID}/$(basename $f)" \
              -H "apikey: $SB_SERVICE_KEY" -H "Authorization: Bearer $SB_SERVICE_KEY" -H "Content-Type: text/plain; charset=utf-8" -H "x-upsert: true" --data-binary @"$f"
          done
