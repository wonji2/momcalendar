# 손님 화면 실시간 검사 — PC 전원과 상관없이 10분마다 (사장님 2026-10-27)
#   tools/daily/live_smoke.mjs 를 깃허브 서버에서 돌린다: 모바일 웹·카톡 인앱·아이폰 앱·안드 앱 4길로
#   목록·탭·검색·찜·옆 메뉴·카카오 로그인 갈 곳·다른 쪽·RPC 를 실제로 누른다.
#   결과는 Supabase site_watch 표 → 서버 pg_cron site-watch-guard 가 2회 연속 실패·40분 무소식이면 health_alerts.
#   2회 연속 실패이고 직전 통과 판으로 돌리면 통과하면 index.html 을 자동으로 되돌린다(tools/daily/watch_autofix.mjs).
#   관리자 화면 ops.html 맨 위 「손님 화면 실시간 검사」에 보인다.
#   ⚠ 깃허브 예약 실행은 몇 분씩 늦을 수 있다(무료 러너 대기). 그래서 무소식 경보는 40분.
name: 손님 화면 실시간 검사
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      selftest:
        description: '자동 되돌림 쓰기 경로 자체 시험(시험 브랜치로만 푸시)'
        required: false
        default: ''
concurrency:
  group: live-watch
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/daily
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 브라우저 준비
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.62.1 >/dev/null
          npx --prefix /tmp/pw playwright install --with-deps chromium >/dev/null
      - name: 화면 검사
        env:
          SITE_WATCH_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NODE_PATH: /tmp/pw/node_modules
        run: |
          mkdir -p scratchpad daily
          ln -s /tmp/pw/node_modules node_modules
          node tools/daily/live_smoke.mjs --ci || echo "실패 항목 있음 — site_watch 에 기록됨(경보는 서버가 2회 연속일 때)"
      - name: 깨졌으면 바로 되돌리기
        env:
          SITE_WATCH_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/daily/watch_autofix.mjs   # 2026-10-27 켬: 검증 3회 지적 반영 · 쓰기 경로 자체 시험 통과(10분 20초)
      - name: 자동 되돌림 자체 시험(손으로 selftest 를 줄 때만)
        if: github.event.inputs.selftest != '' && github.event.inputs.selftest != null
        env:
          SITE_WATCH_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOFIX_SELFTEST: '1'
          AUTOFIX_TEST_NOW: /tmp/brokensite
          AUTOFIX_PUSH_REF: refs/heads/autofix-selftest
        run: |
          mkdir -p /tmp/brokensite && printf '<!DOCTYPE html><html><body>broken</body></html>' > /tmp/brokensite/index.html && cp test.html /tmp/brokensite/
          git fetch -q --depth 1 origin main
          git checkout -q -B selftest-work origin/main
          date; node tools/daily/watch_autofix.mjs; date
          git push -q origin --delete autofix-selftest || true
