# 손님 화면 실시간 검사 — PC 전원과 상관없이 10분마다 (사장님 2026-10-27)
#   tools/daily/live_smoke.mjs 를 깃허브 서버에서 돌린다: 모바일 웹·카톡 인앱·아이폰 앱·안드 앱 4길로
#   목록·탭·검색·찜·옆 메뉴·카카오 로그인 갈 곳·다른 쪽·RPC 를 실제로 누른다.
#   결과는 Supabase site_watch 표 → 서버 pg_cron site-watch-guard 가 2회 연속 실패·40분 무소식이면 health_alerts.
#   2회 연속 실패이고 직전 통과 판으로 돌리면 통과하면 index.html 을 자동으로 되돌린다(tools/daily/watch_autofix.mjs).
#   관리자 화면 ops.html 맨 위 「손님 화면 실시간 검사」에 보인다.
#   ⚠ 깃허브 예약 실행은 몇 분씩 늦을 수 있다(무료 러너 대기). 그래서 무소식 경보는 40분.
name: 손님 화면 실시간 검사
on:
  # 2026-11-06: 예약을 다시 걸어도 짧은 간격 예약이 안 돌았다(40분 0회) → 제때 도는 핫딜 수집(17·47분)이 끝날 때마다 이어서 돈다(약 30분 간격)
  workflow_dispatch:
    inputs:
      selftest:
        description: '자동 되돌림 쓰기 경로 자체 시험(시험 브랜치로만 푸시)'
        required: false
        default: ''
concurrency:
  group: live-watch
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  actions: write        # 다음 회차를 스스로 깨운다(사슬)
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      # 2026-11-28: 서울 서버가 화면 검사를 맡으면(ops_status 'live-host' = server) 이 실행은 검사 없이 바로 끝나고 사슬도 잇지 않는다.
      #   읽기가 실패하거나 값이 없으면 「서버 아님」 — 깃허브가 계속 검사한다(두 곳이 동시에 검사해도 site_watch 에 줄만 더 생길 뿐 해롭지 않다). 되돌리기: live-host 를 github 로 → 시계가 매시 :25 에 부르는 회차로 다시 시작
      - name: 담당 확인(서버가 맡는 중이면 바로 끝)
        id: mode
        env:
          SITE_WATCH_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          out=""
          for i in 1 2 3; do
            out=$(curl -s -m 20 "https://hycaqsqeogjtbscmzrtm.supabase.co/rest/v1/ops_status?id=eq.live-host&select=payload" -H "apikey: $SITE_WATCH_KEY" -H "Authorization: Bearer $SITE_WATCH_KEY" 2>/dev/null) || out=""
            case "$out" in *'"host":'*|'[]') break;; esac
            sleep 5
          done
          # PostgREST 는 jsonb 를 `"host": "server"`(콜론 뒤 공백)로 준다 — 공백 있든 없든 맞게 정규식으로 본다(2026-11-28 검증자 지적, 서버에서 실제 응답으로 확인)
          if printf '%s' "$out" | grep -Eq '"host": *"server"'; then echo "서버가 화면 검사를 맡는 중(ops_status live-host) — 이 실행은 검사하지 않고 끝낸다"; echo "server=1" >> "$GITHUB_OUTPUT"; else echo "server=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.mode.outputs.server != '1'
        with:
          sparse-checkout: |
            tools/daily
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        if: steps.mode.outputs.server != '1'
        with:
          node-version: '20'
      - name: 브라우저 준비
        if: steps.mode.outputs.server != '1'
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.62.1 >/dev/null
          npx --prefix /tmp/pw playwright install --with-deps chromium >/dev/null
      - name: 화면 검사
        if: steps.mode.outputs.server != '1'
        env:
          SITE_WATCH_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NODE_PATH: /tmp/pw/node_modules
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 2026-11-23: 한 번 깨면 10분마다 검사를 되풀이하며 5시간 20분 살아 있고, 끝날 때 다음 회차를 스스로 깨운다(핫딜 수집과 같은 사슬).
        #   전에는 「핫딜 수집이 끝날 때」 이어 돌았는데, 핫딜 수집이 5시간 20분짜리 한 실행으로 바뀐 뒤(11-12) 검사가 몇 시간에 한 번만 돌아
        #   「40분 무소식」 경보가 늘 떠 있었다. 깃허브의 짧은 예약(schedule)은 건너뛰기 일쑤라 예비로만 둔다.
        run: |
          mkdir -p scratchpad daily
          ln -s /tmp/pw/node_modules node_modules
          END=$((SECONDS + 19200)); n=0
          while :; do
            n=$((n + 1)); echo "=== 검사 $n 회차 $(date -u +%H:%M)Z ==="
            node tools/daily/live_smoke.mjs --ci || echo "실패 항목 있음 — site_watch 에 기록됨(경보는 서버가 2회 연속일 때)"
            node tools/daily/watch_autofix.mjs || echo "자동 되돌림 단계 오류(다음 회차 계속)"   # 2회 연속 실패이고 직전 통과 판이면 되돌린다
            [ $((SECONDS + 600)) -ge $END ] && break
            # 10분 쉬되 1분마다 서버가 맡았는지 본다(맡았으면 바로 끝내고 사슬을 잇지 않는다)
            for i in $(seq 10); do
              sleep 60
              o=$(curl -s -m 20 "https://hycaqsqeogjtbscmzrtm.supabase.co/rest/v1/ops_status?id=eq.live-host&select=payload" -H "apikey: $SITE_WATCH_KEY" -H "Authorization: Bearer $SITE_WATCH_KEY" 2>/dev/null) || o=""
              if printf '%s' "$o" | grep -Eq '"host": *"server"'; then echo "서버가 화면 검사를 맡았다 — 사슬을 끝낸다"; : > /tmp/lw_server_mode; break 2; fi
            done
          done
          echo "총 $n 회차"
      - name: 다음 회차 깨우기(사슬 잇기)
        if: always() && steps.mode.outputs.server != '1' && (github.event.inputs.selftest == '' || github.event.inputs.selftest == null)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/lw_server_mode ]; then echo "서버가 맡는 중 — 사슬을 잇지 않는다"; exit 0; fi
          gh workflow run live-watch.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}" && echo "다음 실행 예약됨"
      - name: 자동 되돌림 자체 시험(손으로 selftest 를 줄 때만)
        if: github.event.inputs.selftest != '' && github.event.inputs.selftest != null
        env:
          SITE_WATCH_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOFIX_SELFTEST: '1'
          AUTOFIX_TEST_NOW: /tmp/brokensite
          AUTOFIX_PUSH_REF: refs/heads/autofix-selftest
        run: |
          mkdir -p /tmp/brokensite && printf '<!DOCTYPE html><html><body>broken</body></html>' > /tmp/brokensite/index.html && cp test.html /tmp/brokensite/
          git fetch -q --depth 1 origin main
          git checkout -q -B selftest-work origin/main
          date; node tools/daily/watch_autofix.mjs; date
          git push -q origin --delete autofix-selftest || true
#   (2026-11-01 13:05 예약 재등록용 수정 — 09:36 저장소 삭제 사고 뒤 schedule 이 멈춰 있다)
