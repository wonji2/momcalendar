# 베이비페어·패밀리세일 오프라인 행사 수집 — 매일 06:00 KST (지시서 ORDER_BEFE_FAMILY_SALE_COLLECTOR, 2026-11-12)
#   tools/daily/befe_sale_collector.py 가 전시장 공식 일정(+ 열쇠가 있으면 네이버 뉴스 검색 공식 API)을 읽어 data/offline_sales.json 을 갱신한다.
#   AI 호출·DB 호출 없음. 서버에서 돌아 PC 가 꺼져도 돈다. 항목이 바뀐 날만 커밋한다.
#   선택 비밀값: NAVER_CLIENT_ID · NAVER_CLIENT_SECRET (없으면 언론 보도 갈래만 건너뛴다)
name: befe-sale-auto
on:
  schedule:
    - cron: '0 21 * * *'   # 21:00 UTC = 06:00 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: befe-sale-auto
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          PYTHONIOENCODING: utf-8
        run: python tools/daily/befe_sale_collector.py
      - name: 바뀌었으면 커밋
        run: |
          python -c "import json;d=json.load(open('data/offline_sales.json',encoding='utf-8'));assert isinstance(d.get('items'),list)"
          git add data/offline_sales.json
          if git diff --cached --quiet; then echo "변화 없음"; exit 0; fi
          git config user.name "momcal-bot"
          git config user.email "momcal-bot@users.noreply.github.com"
          git commit -q -m "오프라인 행사 일정 갱신 (자동)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
