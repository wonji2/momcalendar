# 애플 스토어 등록 정보 읽기·수정 (App Store Connect API) — 2026-11-02
#   사장님 PC 의 애플 키를 읽지 않고, 이미 TestFlight 업로드에 쓰는 GitHub 시크릿(APPLE_API_*)을 그대로 쓴다.
#   show  = 읽기만(설명·키워드·사진·심사 연락처 출력) / apply = ios-app/store/plan.json 대로 수정(심사 제출은 안 한다)
name: iOS 스토어 정보
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "show = 읽기만 / apply = ios-app/store/plan.json 적용"
        required: true
        default: show
        type: choice
        options: [show, apply, submit]
jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 도구 설치
        run: python3 -m pip install -q pyjwt cryptography
      - name: 실행
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -e
          for v in APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8; do [ -n "${!v}" ] || { echo "🔴 시크릿 $v 가 비어 있다"; exit 1; }; done
          KEY=$RUNNER_TEMP/AuthKey.p8
          printf '%s\n' "$APPLE_API_KEY_P8" | tr -d '\r' | awk '/-----BEGIN PRIVATE KEY-----/{f=1} f{print} /-----END PRIVATE KEY-----/{f=0}' > "$KEY"; chmod 600 "$KEY"
          export APPLE_API_KEY_PATH="$KEY"
          if [ "${{ inputs.mode }}" = "apply" ]; then python3 ios-app/ci/store_edit.py apply ios-app/store/plan.json; elif [ "${{ inputs.mode }}" = "submit" ]; then python3 ios-app/ci/store_edit.py submit; else python3 ios-app/ci/store_edit.py show; fi
          rm -f "$KEY"
