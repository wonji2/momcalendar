# 아이폰 앱 시뮬레이터 자동 점검 (사장님 2026-10-26 「앱 버그 스스로 검증」 — 스레드 댓글 「클로드로 시뮬레이터 조작 가능」)
#   맥 러너에서 아이폰 앱(Capacitor)을 시뮬레이터용으로 만들어 깔고 켠 뒤 확인:
#     ① 앱이 켜진 채로 살아 있나(60초)  ② 화면이 사이트(보라 머리)인가 — 오프라인 대기 화면(연회색)이면 실패
#     ③ 앱 기록(log)에 강제 종료·자바스크립트 오류가 있나 — 기록 파일은 산출물로 남긴다
#   매일 KST 04:10 + 손으로(Actions → 이 워크플로 → Run workflow). 공개 저장소라 맥 러너 비용 없음.
#   한계: 시뮬레이터엔 카카오톡·푸시가 없다 → 로그인 앱 전환·알림 도착은 실기기 몫(TestFlight).

name: 아이폰 앱 시뮬레이터 점검

on:
  schedule:
    - cron: '10 19 * * *'
  workflow_dispatch:

concurrency:
  group: ios-sim-check
  cancel-in-progress: true

jobs:
  sim:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: iOS 프로젝트 만들기
        working-directory: ios-app
        run: |
          npm install --no-audit --no-fund
          # 앱 안 자체 시험: 사이트를 ?e2e=selftest 로 띄워 사이트가 스스로 보고 앱 기록에 E2E|항목|1/0 을 적게 한다(손님용 설정은 안 바뀐다 — 이 러너 안에서만)
          python3 -c "import json;p='capacitor.config.json';c=json.load(open(p));c['server']['url']='https://momcalendar.com/?e2e=selftest';c['loggingBehavior']='debug';json.dump(c,open(p,'w'),ensure_ascii=False,indent=2)"
          npx cap add ios
          npx cap sync ios
          python3 ci/add_push_appdelegate.py ios/App/App/AppDelegate.swift
          python3 ci/add_crash_reporter.py ios/App/App/AppDelegate.swift
      - name: 시뮬레이터용 빌드
        working-directory: ios-app/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -5
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name 'App.app' -maxdepth 3 | head -1)
          test -d "$APP" || (echo "🔴 App.app 없음"; exit 1)
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
      - name: 시뮬레이터 켜고 앱 실행
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')];print(c[-1]['udid'])")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP_PATH"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"); echo "BID=$BID" >> "$GITHUB_ENV"
          mkdir -p sim-out
          # 앱의 print(카패시터가 사이트 console.log 를 옮겨 적는 곳)를 파일로 받는다. NSUnbufferedIO 없으면 버퍼에 갇혀 0바이트(2026-10-26 1회차)
          #   --console-pty 를 백그라운드로 돌리면 앱이 아예 안 켜지는 회차가 있었다(3회차) → 보통 launch 로
          export SIMCTL_CHILD_NSUnbufferedIO=YES
          xcrun simctl launch --terminate-running-process --stdout="$PWD/sim-out/app_console.txt" --stderr="$PWD/sim-out/app_console_err.txt" "$UDID" "$BID" | tee sim-out/launch.txt
          sleep 8
          xcrun simctl io "$UDID" screenshot sim-out/01_home.png
          sleep 12
          xcrun simctl io "$UDID" screenshot sim-out/02_after20s.png
          sleep 25   # 자체 시험(9초 뒤 시작, 마지막에 바깥 링크로 사파리가 앞에 온다)
          xcrun simctl io "$UDID" screenshot sim-out/03_after_selftest.png
      - name: 판정
        run: |
          pip3 install --quiet --break-system-packages pillow || pip3 install --quiet pillow
          export PID_ALIVE=$(xcrun simctl spawn "$UDID" launchctl list | grep -c "$BID" || true)
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "App"' > sim-out/app_log.txt 2>/dev/null || true
          python3 - <<'PY'
          import os, re
          from PIL import Image
          rows=[]; fail=0
          def rec(name, ok, note=''):
              global fail
              rows.append(f"| {'✅' if ok else '❌'} | {name} | {note} |"); fail += (not ok)
          alive=int(os.environ.get('PID_ALIVE','0') or 0)
          rec('앱이 45초 뒤에도 살아 있다', alive>0, f'launchctl {alive}')
          # 머리띠는 바깥 링크 시험(약 11초) 전 화면으로 본다 — 바깥 링크가 열리면 뒤 화면은 사파리다(Codex 리뷰 2026-10-26)
          im=Image.open('sim-out/01_home.png').convert('RGB'); w,h=im.size
          # 사이트 머리(보라 #602090)가 화면 위쪽 12% 안에 있는가 — 오프라인 대기 화면은 연회색(#FAF9FC)
          band=[im.getpixel((x, y)) for y in range(int(h*0.06), int(h*0.12), 6) for x in range(20, w-20, 40)]
          purple=sum(1 for r,g,b in band if b>r>g and b-g>40 and r<200)
          rec('화면 위쪽에 사이트 머리(보라)가 보인다', purple > len(band)*0.4, f'보라 {purple}/{len(band)} · {w}x{h}')
          log=open('sim-out/app_log.txt',encoding='utf-8',errors='ignore').read()
          crash=len(re.findall(r'Terminating app|EXC_|SIGABRT|fatal error', log))
          jserr=len(re.findall(r'(?i)(\[error\]|TypeError|ReferenceError|SyntaxError)', log))
          rec('앱 기록에 강제 종료 없음', crash==0, f'{crash}건')
          rows.append(f"| ℹ️ | 앱 기록의 자바스크립트 오류 줄 | {jserr}건(자세한 건 app_log.txt) |")
          # 앱 안 자체 시험 결과(E2E|항목|1/0|메모) — 사이트가 앱 화면 안에서 스스로 본 것
          out=''
          for fn in ('sim-out/app_console.txt','sim-out/app_console_err.txt','sim-out/app_log.txt'):
              try: out+=open(fn,encoding='utf-8',errors='ignore').read()+chr(10)
              except Exception: pass
          seen={}
          for line in out.splitlines():
              i=line.find('E2E|')
              if i<0: continue
              parts=line[i:].split('|')
              if len(parts)>=3: seen[parts[1]]=(parts[2].strip()[:1]=='1', '|'.join(parts[3:])[:120])
          rec('앱 안 자체 시험이 끝까지 돌았다', 'done' in seen, f'{len(seen)}개 항목')
          for k,(ok,note) in seen.items():
              if k=='done': continue
              # 시스템 알림 허용창이 떠 있으면(CI 에선 누를 사람이 없다) 다른 앱으로 넘어가지 못한다 — 실기기 몫으로 적는다
              if k=='open_external' and not ok and seen.get('push_perm_api',(0,''))[1].strip()=='prompt':
                  rows.append(f'| ℹ️ | 자체 시험: {k} | 알림 허용창이 떠 있어 확인 불가(실기기 몫) · {note} |'); continue
              rec('자체 시험: '+k, ok, note)
          md='# 아이폰 앱 시뮬레이터 점검\n\n| 결과 | 항목 | 메모 |\n|---|---|---|\n'+'\n'.join(rows)+f'\n\n실패 {fail}개\n'
          open('sim-out/report.md','w',encoding='utf-8').write(md); print(md)
          raise SystemExit(1 if fail else 0)
          PY
      - name: Maestro 화면 시험 (.maestro/ — 처음엔 결과만 남기고 판정은 안 막음)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p sim-out/maestro
          curl -Ls "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --udid "$UDID" test --env APP_ID="$BID" --test-output-dir sim-out/maestro --format junit --output sim-out/maestro.xml .maestro/ || touch sim-out/maestro_failed.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sim-report
          path: sim-out/
          retention-days: 14
