# 제보 자동 코드 수정 — PC·채팅 세션과 상관없이 깃허브 서버에서 (사장님 2026-11-04 「어떤 기능이든 pc랑 클로드앱 세션 꺼져 있어도 자동으로 돌게」, 규칙 0-Y-PC)
#   ① 켜져 있고(DB ops_status 'bugfix-state' enabled) 고칠 제보(사이트·코드 오류, 확인 필요)가 있고 구독 인증 비밀값이 있을 때만 아래를 설치·실행한다
#      → 평소엔 몇 초 만에 끝난다(규칙 0-T: 할 일 없으면 외부 호출 안 함)
#   ② tools/daily/bugfix_runner.mjs --apply : 기준 점검 → 클로드 수정(index·test 만) → 자동 검사 → 수정본 점검 → 독립 검토 → 확인식 → push → 라이브 점검 → 새 실패면 되돌림
#   ③ 비밀값: CLAUDE_CODE_OAUTH_TOKEN(클로드 구독 장기 토큰, 사장님이 한 번 저장소 비밀값에 넣는다) · SUPABASE_SERVICE_KEY · SUPABASE_TRIAGE_TOKEN(제보 처리기와 같은 것)
#      CLAUDE_CODE_OAUTH_TOKEN 이 없으면 이 작업은 건너뛴다(오류로 울리지 않고 로그에 한 줄)
#   켜기/끄기: node tools/daily/bugfix_runner.mjs --enable | --disable (DB 스위치) · 손으로 한 번: Actions › 이 작업 › Run workflow
name: 제보 자동 코드 수정
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/trigger/bugfix-selftest.txt'   # 이 파일을 올리면 서버에서 합성 버그 자체 시험을 한 번 돈다(올리지 않는 시험, DB 안 씀)
concurrency:
  group: bugfix-cloud
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SB_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TRIAGE_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MOMCAL_CLOUD: '1'
    steps:
      - name: 할 일 확인
        id: chk
        run: |
          U=https://hycaqsqeogjtbscmzrtm.supabase.co/rest/v1
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "인증 비밀값 없음"; echo "go=0" >> $GITHUB_OUTPUT; else echo "자체 시험 모드"; echo "go=1" >> $GITHUB_OUTPUT; fi; exit 0; fi
          if [ -z "$SB_SERVICE_KEY" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "DB 비밀값 없음 — 건너뜀"; echo "go=0" >> $GITHUB_OUTPUT; exit 0; fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "CLAUDE_CODE_OAUTH_TOKEN 비밀값 없음 — 건너뜀(사장님이 저장소 비밀값에 넣으면 켜진다)"; echo "go=0" >> $GITHUB_OUTPUT; exit 0; fi
          en=$(curl -s "$U/ops_status?id=eq.bugfix-state&select=payload" -H "apikey: $SB_SERVICE_KEY" -H "Authorization: Bearer $SB_SERVICE_KEY" | jq -r '.[0].payload.enabled // false')
          if [ "$en" != "true" ]; then echo "스위치 꺼짐 — 건너뜀"; echo "go=0" >> $GITHUB_OUTPUT; exit 0; fi
          n=$(curl -s -G "$U/inquiries" --data-urlencode "select=id" --data-urlencode "status=eq.doing" --data-urlencode "triage=in.(site,etc)" --data-urlencode "admin_memo=like.확인 필요*" -H "apikey: $SB_SERVICE_KEY" -H "Authorization: Bearer $SB_SERVICE_KEY" | jq 'length')
          echo "고칠 후보 ${n}건"
          if [ "$n" -gt 0 ] 2>/dev/null; then echo "go=1" >> $GITHUB_OUTPUT; else echo "go=0" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.go == '1'
        with:
          fetch-depth: 50
          sparse-checkout: |
            tools/daily
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.go == '1'
        with:
          node-version: '20'
      - uses: supabase/setup-cli@v1
        if: steps.chk.outputs.go == '1'
        with:
          version: 2.109.1
      - name: 준비(DB 연결·브라우저·클로드)
        if: steps.chk.outputs.go == '1'
        run: |
          mkdir -p scratchpad daily supabase/.temp
          echo -n hycaqsqeogjtbscmzrtm > supabase/.temp/project-ref
          echo '{"ref":"hycaqsqeogjtbscmzrtm","name":"wonji2'"'"'s Project","organization_id":"lgnkcdsqsaksvrzxeexg","organization_slug":"lgnkcdsqsaksvrzxeexg"}' > supabase/.temp/linked-project.json
          echo -n postgresql://postgres.hycaqsqeogjtbscmzrtm@aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres > supabase/.temp/pooler-url
          echo -n 17.6.1.127 > supabase/.temp/postgres-version
          # DB 살아 있는지: CLI 핑(supabase db query --linked)이 LegacyDbConfigConnectTempRoleError(임시 역할 접속 실패)로 회차를 통째로 죽였다 → REST 헬스체크로(3번, 10초 간격). 2026-11-13
          ok=0; for i in 1 2 3; do code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://hycaqsqeogjtbscmzrtm.supabase.co/rest/v1/ops_status?id=eq.bugfix-state&select=id" -H "apikey: $SB_SERVICE_KEY" -H "Authorization: Bearer $SB_SERVICE_KEY" || true); if [ "$code" = "200" ]; then ok=1; break; fi; echo "DB 응답 $code — 다시 시도($i/3)"; sleep 10; done
          if [ "$ok" != "1" ]; then echo "DB 헬스체크 실패 — 이번 회차는 멈춘다"; exit 1; fi
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.62.1 >/dev/null
          npx --prefix /tmp/pw playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/pw/node_modules node_modules
          npm i -g @anthropic-ai/claude-code@2.1.303 || npm i -g @anthropic-ai/claude-code
          claude --version
          git config --global user.name wonji2 && git config --global user.email wonji2@users.noreply.github.com
      - name: 수정
        if: steps.chk.outputs.go == '1'
        env:
          SUPABASE_CLI: supabase
          NODE_PATH: /tmp/pw/node_modules
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node tools/daily/bugfix_runner.mjs --self-test | tee /tmp/selftest.txt
            grep -q 'dry_ok' /tmp/selftest.txt   # 합성 버그를 고치고 점검·검토까지 통과해야 성공으로 친다
          else node tools/daily/bugfix_runner.mjs --apply; fi
      - name: 기록 남기기
        if: always() && steps.chk.outputs.go == '1'
        run: |
          for f in scratchpad/bugfix_log.txt scratchpad/bugfix_runs/*/report.json scratchpad/bugfix_runs/*/fix.patch scratchpad/bugfix_runs/*/rejected.patch; do
            [ -f "$f" ] || continue
            n="$(echo "$f" | sed 's#scratchpad/##; s#/#_#g')"
            curl -s -o /dev/null -w "$n %{http_code}\n" -X POST "https://hycaqsqeogjtbscmzrtm.supabase.co/storage/v1/object/cloud-bundle/bugfix/${GITHUB_RUN_ID}/$n" \
              -H "apikey: $SB_SERVICE_KEY" -H "Authorization: Bearer $SB_SERVICE_KEY" -H "Content-Type: text/plain; charset=utf-8" -H "x-upsert: true" --data-binary @"$f"
          done
