<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>맘캘린더 · 오늘 카드 뽑기</title>
<!--
  오늘 카드 뽑기 — 사장님 전용 고정 링크 (사장님 2026-11-01 「매일 자동으로 오늘 인스타공구 사진 3~4장이랑 그날 뜬 핫딜 카드 볼 수 있는 링크,
  그날 아침에 들어가서 뽑을 때 실시간 그때 기준으로 사진 다운로드할 수 있게」)

  어떻게: 이 페이지가 열리는 순간 todaycard.html(오늘 공구 캘린더 1~4쪽)과 hotdealcard.html(오늘 핫딜)을 숨은 iframe 으로 열어
          그 자리에서 DB 를 읽어 그리고(= 실시간), html2canvas 로 1080×1920 PNG 를 만들어 내려받기 단추를 붙인다.
          서버가 미리 만들어 두는 daily/today.png(07:40 판)와 달리 **누른 그 시각 기준**이다.
  쪽수:   공구카드는 1쪽부터 그려 보고 항목이 없는 쪽이 나오면 멈춘다(최대 4쪽). 핫딜은 오늘 올라온 딜이 0건이면 안 만든다.
  내려받기: PNG 는 blob 주소 + download 속성(크롬·사파리·삼성 인터넷 OK). 카톡·인스타 안 브라우저는 파일 저장이 안 되므로 바깥 브라우저로 여는 단추를 띄운다.
  주소:   https://momcalendar.com/cards.html            ← 오늘
          https://momcalendar.com/cards.html?d=2026-11-05 ← 다른 날(공구카드만 의미 있음. 핫딜은 그날 올라온 것)
  ⚠ 카드 모양·규칙은 todaycard.html / hotdealcard.html 이 원본이다. 여기서는 그리지 않고 불러서 찍기만 한다.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F6F3FA;color:#191F28;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:0 0 60px}
.hd{background:#fff;border-bottom:1px solid #E9E2F2;padding:16px 20px}
.hd h1{font-size:18px;margin:0}
.hd .sub{font-size:12.5px;color:#8B95A1;margin-top:4px}
.wrap{max-width:480px;margin:0 auto;padding:0 20px}
.row{display:flex;gap:8px;align-items:center;margin-top:14px}
input[type=date]{flex:1;height:44px;border:1px solid #E5E0EE;border-radius:12px;padding:0 12px;font-size:15px;font-family:inherit;background:#fff}
.btn{height:52px;border:0;border-radius:14px;background:#5B2E8C;color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;padding:0 18px;white-space:nowrap}
.btn:disabled{opacity:.5}
.btn.w{width:100%;margin-top:12px}
.btn.gray{background:#F2F4F6;color:#4E5968}
.st{font-size:13px;color:#6B7684;margin-top:12px;line-height:1.6}
.card{background:#fff;border:1px solid #E9E2F2;border-radius:14px;padding:12px;margin-top:14px}
.card .t{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card .t span{font-size:12px;color:#8B95A1;font-weight:500}
.card img{width:100%;border-radius:10px;display:block;margin-top:10px;background:#F2F4F6;aspect-ratio:9/16}
.card a.dl{display:block;text-align:center;height:48px;line-height:48px;border-radius:12px;background:#5B2E8C;color:#fff;font-weight:700;text-decoration:none;margin-top:10px;font-size:14.5px}
.skel{height:120px;border-radius:12px;margin-top:10px;background:linear-gradient(90deg,#F2F0F6 25%,#E9E6F0 37%,#F2F0F6 63%);background-size:400% 100%;animation:sk 1.2s ease infinite}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
.warn{background:#FFF8E6;border:1px solid #F0DFA8;border-radius:12px;padding:12px 14px;font-size:13px;color:#6B5A2E;margin-top:14px;line-height:1.6}
.warn a{color:#5B2E8C;font-weight:700}
/* 카드를 그리는 iframe — 화면 밖에 두되 렌더는 되게(display:none 이면 html2canvas 가 못 그린다) */
#work{position:fixed;left:-3000px;top:0;width:1200px;height:2400px;border:0;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="hd"><div class="wrap" style="padding:0"><h1>오늘 카드 뽑기</h1><div class="sub">누르는 그 시각의 공구·핫딜로 바로 만듭니다 · 1080×1920</div></div></div>
<div class="wrap">
  <div class="row"><input type="date" id="day"><button class="btn" id="go" onclick="run()">지금 기준으로 만들기</button></div>
  <div class="st" id="st">준비 중…</div>
  <div id="inapp" class="warn" style="display:none">카톡·인스타 안에서는 사진 저장이 안 돼요. <a href="#" id="ext">크롬·사파리로 열기</a></div>
  <div id="out"></div>
  <button class="btn w gray" id="zip" onclick="zipAll()" style="display:none">전체 ZIP 으로 내려받기</button>
</div>
<iframe id="work" title="카드 작업용"></iframe>
<script>
const MAX_PAGES=4;
// 핫딜 사진 중계 함수(supabase/functions/img-proxy, 사장님이 2026-11-01 운영 이름으로 배포)
const IMG_PROXY='https://hycaqsqeogjtbscmzrtm.supabase.co/functions/v1/img-proxy';
const todayKST=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const fmtMD=d=>{const [y,m,dd]=d.split('-').map(Number);const w='일월화수목금토'[new Date(y,m-1,dd).getDay()];return `${m}/${dd}(${w})`;};
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let made=[];   // {name, blob}
function setSt(t){ $('st').textContent=t; }

// iframe 에 주소를 열고 load 를 기다린다
function openFrame(url){
  return new Promise((res,rej)=>{
    const f=$('work'); const to=setTimeout(()=>rej(new Error('페이지 열기 시간 초과')),60000);
    f.onload=()=>{ clearTimeout(to); res(f.contentWindow); };
    f.src=url+(url.includes('?')?'&':'?')+'cb='+Date.now();
  });
}
async function waitFor(fn,ms,label){ const t0=Date.now(); while(Date.now()-t0<ms){ try{ if(fn()) return true; }catch(_){} await sleep(300); } throw new Error((label||'준비')+' 시간 초과'); }
// 줄 수가 멈출 때까지(다 그려진 뒤에 찍는다 — make-today-card.mjs 와 같은 방식)
async function waitStable(w,sel){ let prev=-1; for(let i=0;i<10;i++){ const n=w.document.querySelectorAll(sel).length; if(n>0&&n===prev) return n; prev=n; await sleep(700); } return prev; }
// inline=true: 복제본에 원본의 계산 스타일을 그대로 심는다 — html2canvas 복제본이 `body.vD …` 같은 규칙을 통째로 놓쳐
//   핫딜카드 3×3 격자가 목록으로 펴지던 문제(11-01 실측). 공구카드는 원래 잘 나오므로 안 심는다.
const INLINE_PROPS=['display','flex-direction','flex-wrap','flex','width','height','min-height','max-height','gap','row-gap','column-gap','align-items','align-content','justify-content','padding','margin','border','border-radius','border-bottom','overflow','background','background-color','font-size','font-weight','line-height','letter-spacing','color','object-fit','-webkit-line-clamp','white-space','text-overflow','position','top','left','right','bottom','box-sizing','text-align'];
async function snap(w,cardId,inline){
  const d=w.document, card=d.getElementById(cardId);
  d.body.classList.remove('mini'); d.body.classList.add('clean');
  await d.fonts.ready; await sleep(400);
  const onclone=inline ? (doc)=>{ const o=[card,...card.querySelectorAll('*')], c=doc.getElementById(cardId), cl=[c,...c.querySelectorAll('*')];
      for(let i=0;i<Math.min(o.length,cl.length);i++){ const cs=w.getComputedStyle(o[i]); for(const k of INLINE_PROPS){ const v=cs.getPropertyValue(k); if(v) cl[i].style.setProperty(k,v); } }
      w.trimToFit(doc); } : w.trimToFit;
  const canvas=await w.html2canvas(card,{width:1080,height:1920,scale:1,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:1080,windowHeight:1920,onclone});
  return new Promise(r=>canvas.toBlob(r,'image/png'));
}
function addCard(title,sub,blob,name){
  const url=URL.createObjectURL(blob);
  const el=document.createElement('div'); el.className='card';
  el.innerHTML=`<div class="t">${title}<span>${sub}</span></div><img alt="${title}"><a class="dl" download="${name}">내려받기</a>`;
  el.querySelector('img').src=url; el.querySelector('a').href=url;
  $('out').appendChild(el); made.push({name,blob});
}
function placeholder(title){ const el=document.createElement('div'); el.className='card'; el.id='ph'; el.innerHTML=`<div class="t">${title}<span>만드는 중…</span></div><div class="skel"></div>`; $('out').appendChild(el); }
function rmPlaceholder(){ const p=$('ph'); if(p) p.remove(); }

async function run(){
  const day=$('day').value||todayKST(); const md=fmtMD(day), tag=day.replace(/-/g,'');
  $('go').disabled=true; $('zip').style.display='none'; $('out').innerHTML=''; made=[];
  for(const u of document.querySelectorAll('a.dl')) try{ URL.revokeObjectURL(u.href); }catch(_){}
  try{
    // ① 공구카드 1쪽~ : 항목이 없는 쪽이 나오면 멈춘다
    for(let p=1;p<=MAX_PAGES;p++){
      placeholder(`${md} 공구카드 ${p}`); setSt(`공구카드 ${p}쪽 그리는 중… (지금 DB 기준)`);
      const w=await openFrame(`/todaycard.html?d=${day}&p=${p}`);
      await waitFor(()=>{ const t=w.document.getElementById('captxt'); return t && t.value && t.value.length>200; },60000,'공구 데이터');
      const n=await waitStable(w,'#card .it-nm, #card .item, #card li');
      if(!n){ rmPlaceholder(); if(p===1) setSt('오늘 오픈·마감 공구가 없어 공구카드를 만들지 않았어요'); break; }
      const blob=await snap(w,'card'); rmPlaceholder();
      addCard(`${md} 공구카드 ${p}`, `${n}건`, blob, `momcal_${tag}${p>1?'-p'+p:''}.png`);
      // 남은 항목이 없으면 다음 쪽은 비어 있다 — 미리 끝낸다
      const more=[...w.document.querySelectorAll('#card .more, #M1, #M2')].map(e=>e.textContent||'').join(' ');
      if(!/\+\s*\d+\s*건/.test(more)) break;
    }
    // ② 핫딜카드 — 오늘 올라온 딜만(hotdealcard.html). 0건이면 안 만든다
    placeholder(`${md} 핫딜카드`); setSt('핫딜카드 그리는 중…');
    const w=await openFrame(`/hotdealcard.html?d=${day}&raw=1&v=D`);
    await waitFor(()=>w.__READY===true||w.__ERROR,60000,'핫딜 데이터');
    if(w.__ERROR) throw new Error('핫딜 불러오기 실패: '+w.__ERROR);
    const todayN=(w.__DATA&&w.__DATA[1]&&w.__DATA[1].length)||w.document.querySelectorAll('#L1 .th').length;
    if(!todayN){ rmPlaceholder(); $('out').insertAdjacentHTML('beforeend','<div class="card"><div class="t">핫딜카드<span>오늘 올라온 핫딜 0건 · 만들지 않음</span></div></div>'); }
    else{
      await waitFor(()=>[...w.document.querySelectorAll('#L1 img.th')].every(i=>i.complete),20000,'핫딜 사진').catch(()=>{});
      // 다른 몰 사진은 CORS 머리말이 없어 캔버스에 못 싣는다(11-01 실측: 11번가·쿠팡·오늘의집 빈 칸) → 우리 서버 중계(img-proxy)로 바꿔 다시 받는다
      await Promise.all([...w.document.querySelectorAll('#L1 img.th')].map(i=>new Promise(res=>{ const src=i.getAttribute('src')||''; if(!/^https?:/.test(src)||src.includes('/functions/v1/img-proxy')){ res(); return; }
        i.crossOrigin='anonymous'; i.onload=()=>res(); i.onerror=()=>res(); i.src=IMG_PROXY+'?u='+encodeURIComponent(src); setTimeout(res,15000); })));
      await sleep(500);
      const blob=await snap(w,'card',true); rmPlaceholder();
      addCard(`${md} 핫딜카드`, `오늘 ${todayN}건`, blob, `hotdeal_${day}.png`);
    }
    setSt(`완료 · ${made.length}장 · ${new Date(Date.now()+9*3600e3).toISOString().slice(11,16)} 기준`);
    if(made.length>1) $('zip').style.display='block';
  }catch(e){ rmPlaceholder(); setSt('실패: '+e.message+' — 다시 눌러 보세요'); }
  $('go').disabled=false; $('work').src='about:blank';
}
async function zipAll(){
  const z=new JSZip(); made.forEach(m=>z.file(m.name,m.blob));
  const b=await z.generateAsync({type:'blob'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=`momcal_cards_${($('day').value||todayKST()).replace(/-/g,'')}.zip`; a.click();
}
(function init(){
  const q=new URLSearchParams(location.search); $('day').value=q.get('d')||todayKST();
  const ua=navigator.userAgent||'';
  if(/KAKAOTALK|Instagram|FBAN|FBAV|Line\//i.test(ua)){
    $('inapp').style.display='block';
    $('ext').onclick=e=>{ e.preventDefault(); const u=encodeURIComponent(location.href);
      if(/KAKAOTALK/i.test(ua)) location.href='kakaotalk://web/openExternal?url='+u;
      else if(/Android/i.test(ua)) location.href='intent://'+location.host+location.pathname+location.search+'#Intent;scheme=https;package=com.android.chrome;end';
      else window.open(location.href,'_blank'); };
  }
  run();
})();
</script>
</body>
</html>
