  navigator.clipboard.writeText(t.value).then(function(){ alert(label+'을(를) 복사했어요'); })
   .catch(function(){ t.removeAttribute('readonly'); t.select(); document.execCommand('copy'); alert(label+'을(를) 복사했어요'); });
}
</script></body></html>
