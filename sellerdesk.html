<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>셀러 정보 접수함</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--p:#602090;--pd:#4A1A78;--pp:#F0E6FA;--bd:#E8E4EE;--t1:#111;--t2:#555;--t3:#8A8A8A;--green:#0F6E56;--red:#C62828;--amber:#B26A00}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#F6F4F9;color:var(--t1);max-width:720px;margin:0 auto;padding-bottom:60px;font-size:14px;line-height:1.55}
.hd{background:var(--pd);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.hd b{color:#fff;font-size:15px}
.hd span{color:#D9C8F0;font-size:11px;font-weight:600;margin-left:5px}
.hd button{background:rgba(255,255,255,.16);border:none;color:#fff;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer}
.wrap{padding:14px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(96,32,144,.07);margin-bottom:12px}
h3{font-size:14px;color:var(--p);margin-bottom:12px}
label{font-size:12px;font-weight:700;color:var(--t2);display:block;margin-bottom:5px}
input,select{width:100%;padding:12px 13px;border:1.5px solid var(--bd);border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:#fff}
input:focus,select:focus{border-color:var(--p)}
.btn{padding:12px 16px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--p);color:#fff}
.btn:active{transform:scale(.99)}
.btn.s{background:var(--pp);color:var(--p);padding:8px 12px;font-size:12.5px}
.btn.g{background:#F0EFF2;color:#555;padding:8px 12px;font-size:12.5px}
.btn.w{width:100%;margin-top:10px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.tag.wait{background:#FFF6DF;color:var(--amber)}
.tag.ok{background:#E8F6EF;color:var(--green)}
.tag.off{background:#F0F0F0;color:#888}
.tag.err{background:#FDECEC;color:var(--red)}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.msg.e{color:var(--red)}
.msg.o{color:var(--green)}
.note{font-size:12px;color:var(--t3);margin-top:8px}
/* 만든 링크 */
.made{background:#F8F5FD;border:1px solid #E4D8F3;border-radius:12px;padding:12px;margin-top:12px}
.made .url{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;word-break:break-all;color:var(--p);background:#fff;border-radius:8px;padding:8px;margin-bottom:9px}
.made .row{display:flex;gap:7px}
.made .row .btn{flex:1}
/* 보낸 링크 한 줄 */
.line{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid #F2F0F5;flex-wrap:wrap}
.line:last-child{border-bottom:none}
.line .nm{font-weight:700;flex:1;min-width:90px}
.line .sub{font-size:12px;color:var(--t3);width:100%}
/* 접수 카드 */
.rec{border:1px solid var(--bd);border-radius:13px;padding:13px;margin-bottom:10px}
.rec .top{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.rec .name{font-size:15px;font-weight:800}
.rec .no{font-size:12px;color:var(--t3)}
.rec dl{display:grid;grid-template-columns:76px 1fr;gap:5px 10px;font-size:13px}
.rec dt{color:var(--t3);font-size:12px;padding-top:1px}
.rec dd{word-break:break-all}
.rec .acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;align-items:center}
.rec .acts select{width:auto;padding:7px 9px;font-size:12.5px}
.reveal{background:#FFFBEA;border:1px solid #F3E3B0;border-radius:10px;padding:10px;margin-top:9px;font-size:13px;line-height:1.8}
.edit{border:2px solid var(--p);border-radius:13px;padding:13px;margin-top:10px;background:#FCFAFE}
.edit .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
@media (max-width:420px){ .edit .g2{grid-template-columns:1fr} }
.hint{font-size:11.5px;color:var(--t3);margin-top:3px}
</style>
</head>
<body>
<div class="hd"><b>셀러 정보 접수함<span id="roleTag"></span></b><button onclick="logout()">로그아웃</button></div>

<div id="loginView" class="wrap" style="display:none">
  <div class="card">
    <h3>로그인</h3>
    <div style="margin-bottom:9px"><label>이메일</label><input id="liEmail" type="email" autocomplete="username" placeholder="직원은 아이디@staff.momcal"></div>
    <div style="margin-bottom:4px"><label>비밀번호</label><input id="liPw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="btn w" onclick="login()">로그인</button>
    <div class="msg e" id="liErr"></div>
  </div>
</div>

<div id="main" class="wrap" style="display:none">
  <div class="card">
    <h3>셀러 링크 만들기</h3>
    <label>셀러 이름</label>
    <input id="ivLabel" placeholder="예) 또또맘" onkeydown="if(event.key==='Enter')makeInvite()">
    <button class="btn w" onclick="makeInvite()">링크 만들기</button>
    <div id="made"></div>
    <div class="msg" id="ivMsg"></div>
  </div>

  <div class="card">
    <h3>보낸 링크</h3>
    <div id="ivList"></div>
  </div>

  <div class="card">
    <h3>접수된 셀러</h3>
    <div id="inList"></div>
    <div class="msg" id="inMsg"></div>
    <button class="btn g" style="margin-top:6px" onclick="resync()">노션 동기화 다시 시도</button>
  </div>
</div>

<script>
const SB='https://hycaqsqeogjtbscmzrtm.supabase.co';
const KEY='sb_publishable_u4hR4mdNTSss3kdjFH6R5Q_iuJ2MuGE';
const FN=SB+'/functions/v1/seller-intake';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let AT=localStorage.getItem('mc_admin_at')||(()=>{ try{ return (JSON.parse(localStorage.getItem('staffSess')||'null')||{}).at||''; }catch(_){ return ''; } })();
let ROLE='', ROWS=[];

// 셀러에게 보낼 카톡 문구 — 링크만 갈아끼워 그대로 복사된다
const KAKAO = url =>
`안녕하세요 :) 원츠비입니다.
공동구매 진행을 위해 아래 링크에서 정보 입력 부탁드려요.
(정산·세금계산용이며 한 번만 입력하시면 됩니다)

👉 ${url}

· 링크는 3일 뒤 만료되니 보시는 대로 작성 부탁드려요

[정산 안내] 모든 금액은 부가세 포함이고, 공구 마감일로부터 D+14 정산입니다.
· 개인(프리랜서) : 부가세액 제외 후 3.3% 원천징수
· 일반과세자 : 세금계산서 발행
· 간이과세자 : 부가세액 제외 후 현금영수증 처리`;

function logout(){ try{ localStorage.removeItem('mc_admin_at'); localStorage.removeItem('staffSess'); }catch(_){} AT=''; location.reload(); }

async function api(qs,opt={}){
  const r=await fetch(`${FN}?${qs}`,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+AT,...(opt.headers||{})}});
  return await r.json();
}

async function login(){
  const e=$('liErr'); e.textContent='';
  try{
    const r=await fetch(`${SB}/auth/v1/token?grant_type=password`,{
      method:'POST', headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:$('liEmail').value.trim(),password:$('liPw').value})
    });
    const d=await r.json();
    if(!d.access_token){ e.textContent='로그인 실패: '+(d.error_description||d.msg||'다시 확인해 주세요'); return; }
    AT=d.access_token;
    const me=await api('op=whoami');
    if(!me.ok){ e.textContent='권한이 없는 계정이에요. 사장님에게 승인을 요청해 주세요.'; AT=''; return; }
    try{
      if(me.role==='admin') localStorage.setItem('mc_admin_at',AT);
      else localStorage.setItem('staffSess', JSON.stringify({rt:(JSON.parse(localStorage.getItem('staffSess')||'{}').rt)||'', at:AT}));
    }catch(_){}
    $('liPw').value='';
    boot();
  }catch(x){ e.textContent='연결 오류'; }
}

async function boot(){
  if(!AT){ $('loginView').style.display=''; $('main').style.display='none'; return; }
  const me=await api('op=whoami');
  if(!me.ok){ $('loginView').style.display=''; $('main').style.display='none'; return; }
  ROLE=me.role;
  const d=await api('op=list');
  if(!d.ok){ $('loginView').style.display=''; $('main').style.display='none'; $('liErr').textContent='권한이 없어요.'; return; }
  $('loginView').style.display='none'; $('main').style.display='';
  $('roleTag').textContent = ROLE==='admin' ? '사장님' : '직원';
  drawInvites(d.invites||[]); drawIntakes(d.intakes||[]);
}

// ── 링크 만들기 ──
async function makeInvite(){
  const m=$('ivMsg'); m.className='msg'; m.textContent='';
  const label=$('ivLabel').value.trim();
  if(!label){ m.className='msg e'; m.textContent='셀러 이름을 적어주세요.'; return; }
  const d=await api('op=invite',{method:'POST',body:JSON.stringify({label})});
  if(!d.ok){ m.className='msg e'; m.textContent='실패: '+(d.reason||''); return; }
  await copy(KAKAO(d.url));
  $('made').innerHTML=`<div class="made">
      <div class="url">${esc(d.url)}</div>
      <div class="row">
        <button class="btn s" onclick="copy(KAKAO('${esc(d.url)}'),this)">카톡 문구 복사</button>
        <button class="btn g" onclick="copy('${esc(d.url)}',this)">링크만 복사</button>
      </div>
      <div class="hint">카톡 문구를 이미 복사해 뒀어요. 붙여넣기만 하면 됩니다. (3일 뒤 만료)</div>
    </div>`;
  $('ivLabel').value='';
  boot();
}

async function copy(text,btn){
  try{ await navigator.clipboard.writeText(text); }catch(_){}
  if(btn){ const t=btn.textContent; btn.textContent='복사됨'; setTimeout(()=>btn.textContent=t,1400); }
}

// ── 보낸 링크 ──
function drawInvites(rows){
  const box=$('ivList');
  if(!rows.length){ box.innerHTML='<div class="note">아직 없어요.</div>'; return; }
  box.innerHTML=rows.map(v=>{
    const url=`https://momcalendar.com/sellerform.html?t=${v.token}`;
    const live = !v.used_at && !v.revoked && new Date(v.expires_at)>new Date();
    const left = Math.ceil((new Date(v.expires_at)-new Date())/864e5);
    const tag = v.used_at ? '<span class="tag ok">작성완료</span>'
              : v.revoked ? '<span class="tag off">중지</span>'
              : live ? `<span class="tag wait">대기중 · ${left}일 남음</span>`
              : '<span class="tag off">만료</span>';
    return `<div class="line"><span class="nm">${esc(v.label)}</span>${tag}
      ${live?`<button class="btn s" onclick="copy(KAKAO('${esc(url)}'),this)">문구 복사</button>
              <button class="btn g" onclick="revoke('${esc(v.token)}')">중지</button>`:''}</div>`;
  }).join('');
}
async function revoke(token){
  if(!confirm('이 링크를 중지할까요?')) return;
  await api('op=revoke',{method:'POST',body:JSON.stringify({token})}); boot();
}

// ── 접수된 셀러 ──
function drawIntakes(rows){
  ROWS=rows;
  const box=$('inList');
  if(!rows.length){ box.innerHTML='<div class="note">아직 접수된 셀러가 없어요.</div>'; return; }
  box.innerHTML=rows.map(r=>{
    const stTag = r.status==='checked' ? '<span class="tag ok">확인완료</span>'
                : r.status==='hold' ? `<span class="tag err">보류${r.hold_reason?' · '+esc(r.hold_reason):''}</span>`
                : '<span class="tag wait">신규접수</span>';
    const notion = r.notion_synced_at ? '<span class="tag ok">노션 기록됨</span>'
                 : r.notion_error ? '<span class="tag err">노션 실패</span>' : '<span class="tag wait">노션 대기</span>';
    const 유형 = r.settle_type==='business' ? ('사업자 · '+(r.biz_type==='simplified'?'간이과세':'일반과세')) : '개인(프리랜서)';
    const 번호 = r.settle_type==='business' ? esc(r.biz_no||'') : (ROLE==='admin' ? esc(r.rrn_masked||'') : '🔒 잠김');
    const addr = esc(((r.zipcode?'('+r.zipcode+') ':'')+(r.addr1||'')+' '+(r.addr2||'')).trim());
    return `<div class="rec">
      <div class="top"><span class="name">${esc(r.seller_name)}</span><span class="no">#${r.id}</span>${stTag}${notion}</div>
      <dl>
        <dt>대표자</dt><dd>${esc(r.owner_name)}</dd>
        <dt>연락처</dt><dd>${esc(r.phone||'')}${ROLE!=='admin'?' 🔒':''}${r.email?` · ${esc(r.email)}`:''}</dd>
        <dt>유형</dt><dd>${유형}${번호?` · ${번호}`:''}${r.biz_name?` · ${esc(r.biz_name)}`:''}</dd>
        <dt>계좌</dt><dd>${esc(r.bank||'')} ****${esc(r.acct_last4||'')} · ${esc(r.acct_holder||'')}</dd>
        <dt>주소</dt><dd>${addr}</dd>
        ${r.channel_url?`<dt>채널</dt><dd>${esc(r.channel_url)}${r.followers?` · ${Number(r.followers).toLocaleString()}명`:''}</dd>`:''}
      </dl>
      <div class="acts">
        <button class="btn s" onclick="reveal(${r.id})">${ROLE==='admin'?'계좌·주민번호 열기':'계좌 열기'}</button>
        ${ROLE==='admin'?`<button class="btn g" onclick="openEdit(${r.id})">수정</button>`:''}
        <select onchange="setStatus(${r.id},this.value)">
          <option value="checked"${r.status==='checked'?' selected':''}>확인완료</option>
          <option value="hold"${r.status==='hold'?' selected':''}>보류</option>
          <option value="new"${r.status==='new'?' selected':''}>신규접수</option>
        </select>
      </div>
      <div id="rv${r.id}"></div><div id="ed${r.id}"></div>
    </div>`;
  }).join('');
}

async function reveal(id){
  const box=$('rv'+id);
  const d=await api('op=reveal&id='+id);
  if(!d.ok){ box.innerHTML=`<div class="msg e">${esc(d.reason||'열기 실패')}</div>`; return; }
  box.innerHTML=`<div class="reveal">
      <b>계좌</b> ${esc(d.bank||'')} ${esc(d.acct_no||'')} (${esc(d.acct_holder||'')})
      ${d.phone?`<br><b>연락처</b> ${esc(d.phone)}`:''}
      ${d.rrn?`<br><b>주민번호</b> ${esc(d.rrn.slice(0,6))}-${esc(d.rrn.slice(6))}`:''}
      ${d.locked_note?`<br>🔒 ${esc(d.locked_note)}`:''}
      <br><button class="btn g" style="margin-top:7px" onclick="this.closest('.reveal').remove()">닫기</button>
    </div>`;
}

// ── 수정 (사장님만) ──
function openEdit(id){
  const r=ROWS.find(x=>x.id===id); if(!r) return;
  const f=(label,key,val,ph='')=>`<div><label>${label}</label><input id="ed_${key}_${id}" value="${esc(val??'')}" placeholder="${esc(ph)}"></div>`;
  $('ed'+id).innerHTML=`<div class="edit">
    <div class="g2">${f('셀러명','seller_name',r.seller_name)}${f('대표자명','owner_name',r.owner_name)}</div>
    <div class="g2">${f('연락처','phone',r.phone)}${f('이메일','email',r.email)}</div>
    <div class="g2">${f('채널','channel_url',r.channel_url)}${f('팔로워','followers',r.followers)}</div>
    <div class="g2">
      <div><label>정산유형</label><select id="ed_settle_type_${id}">
        <option value="freelancer"${r.settle_type!=='business'?' selected':''}>개인(프리랜서)</option>
        <option value="business"${r.settle_type==='business'?' selected':''}>사업자</option></select></div>
      <div><label>과세유형</label><select id="ed_biz_type_${id}">
        <option value="general"${r.biz_type!=='simplified'?' selected':''}>일반과세자</option>
        <option value="simplified"${r.biz_type==='simplified'?' selected':''}>간이과세자</option></select></div>
    </div>
    <div class="g2">${f('사업자명','biz_name',r.biz_name)}${f('사업자등록번호','biz_no',r.biz_no)}</div>
    <div class="g2">${f('우편번호','zipcode',r.zipcode)}${f('기본주소','addr1',r.addr1)}</div>
    <div class="g2">${f('상세주소','addr2',r.addr2)}${f('은행','bank',r.bank)}</div>
    <div class="g2">${f('예금주','acct_holder',r.acct_holder)}${f('계좌번호','acct_no','','바꿀 때만 입력 (지금 ****'+esc(r.acct_last4||'')+')')}</div>
    <div class="g2">${f('주민등록번호','rrn','','바꿀 때만 입력')}<div></div></div>
    <div class="msg" id="edMsg${id}"></div>
    <div class="acts"><button class="btn s" onclick="saveEdit(${id})">저장</button>
      <button class="btn g" onclick="document.getElementById('ed${id}').innerHTML=''">닫기</button></div>
  </div>`;
}
async function saveEdit(id){
  const m=$('edMsg'+id); m.className='msg'; m.textContent='저장 중…';
  const payload={id};
  ['seller_name','owner_name','phone','email','channel_url','followers','biz_name','biz_no','settle_type','biz_type','zipcode','addr1','addr2','bank','acct_holder','acct_no','rrn']
    .forEach(k=>{ const el=$('ed_'+k+'_'+id); if(el && el.value.trim()!=='') payload[k]=el.value.trim(); });
  const d=await api('op=update',{method:'POST',body:JSON.stringify(payload)});
  if(!d.ok){ m.className='msg e'; m.textContent = d.fields?.length ? (d.fields.join(', ')+' 을(를) 확인해 주세요.') : ('수정 실패: '+(d.reason||'')); return; }
  m.className='msg o'; m.textContent='고쳤어요' + (d.notion?' · 노션도 갱신':'');
  setTimeout(boot,700);
}

async function setStatus(id,st){
  const m=$('inMsg'); const d=await api('op=status',{method:'POST',body:JSON.stringify({id,status:st})});
  m.className='msg '+(d.ok?'o':'e');
  m.textContent = d.ok ? '상태를 바꿨어요.' : ('상태 변경 실패: '+(d.reason||''));
  if(d.ok) setTimeout(boot,500);
}

async function resync(){
  const m=$('inMsg'); m.className='msg'; m.textContent='보내는 중…';
  const d=await api('op=resync',{method:'POST',body:JSON.stringify({})});
  const fail=(d.done||[]).filter(x=>!x.ok);
  m.className='msg '+(fail.length?'e':'o');
  m.textContent = !d.done?.length ? '동기화할 건이 없어요.'
    : fail.length ? `${d.done.length}건 중 ${fail.length}건 실패` : `${d.done.length}건 노션에 기록했어요.`;
  boot();
}
boot();
</script>
</body>
</html>
