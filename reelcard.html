<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>맘캘린더 · 오늘 공구 캘린더 카드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/html2canvas-pro@1.5.11/dist/html2canvas-pro.min.js"></script>
<style>
:root{
  /* ── 시안 변수 (?v=A|B|C 로 바뀜) ──
     상단 256px 은 건드리지 말 것: 인스타 UI(200) + 프로필 그리드커버(240) 를 둘 다 피하는 값 */
  --fs-item:21px; --fs-sub:16px; --it-pad:8.1px;
  /* 하단 여백. 줄일수록 목록이 아래까지 내려간다.
     릴스 재생 중엔 하단 330px 를 인스타 UI 가 덮지만, 사장님이 "노란 CTA 는 썸네일에서 안 보여도 된다"
     고 하셔서 목록을 우선한다 (2026-08-04) */
  --pad-bot:190px;
  --side:32px;       /* 카드 좌우 여백. 줄일수록 상품명이 덜 잘린다 (사장님 지시 2026-08-04) */
  --fs-title:96px;   /* fitTitle 이 좌우 끝까지 자동으로 맞춘다 */
  --p:#6B4A9E; --p-d:#5B3A8C; --p-l:#F2EBFB;
  --r:#D3554F; --r-l:#FDEDED;
  --gold:#C9A24B; --gold-l:#FDF8EC;
  --ink:#231C2E; --mute:#8A8194; --line:#EDE9F2;
  /* 글씨체는 이 두 줄만 바꾸면 전체 적용 */
  --f-t:"Wanted Sans Variable","Wanted Sans",Pretendard,sans-serif;
  --f-b:"Wanted Sans Variable","Wanted Sans",Pretendard,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#3A3145;font-family:var(--f-b);padding:96px 0 60px;color:#fff}

/* ── 조작 바 ── */
.bar{position:fixed;top:0;left:0;right:0;background:#1B1622;z-index:99;padding:12px 18px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 14px rgba(0,0,0,.4)}
.bar label{font-size:13px;color:#C9BFD8;font-weight:700}
.bar input[type=date]{background:#2C2436;border:1px solid #493C5A;color:#fff;border-radius:8px;
  padding:7px 10px;font-size:14px;font-family:inherit}
.bar button{background:var(--p);color:#fff;border:0;border-radius:8px;padding:8px 15px;
  font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit}
.bar button:hover{background:#7d59b5}
.bar button.ghost{background:#3A2F49}
.bar .st{font-size:12.5px;color:#9E93AE;margin-left:auto}
.bar .st b{color:#E8C77E}
.tip{width:100%;font-size:12px;color:#8E82A0;line-height:1.6}
.tip b{color:#E8C77E}

.slot{width:1080px;height:1920px;margin:0 auto 40px;position:relative}
.mini .card{transform:scale(.30);transform-origin:top left}
.mini .slot{width:324px;height:576px;margin-bottom:20px}

/* ═══ 릴스 캔버스 1080×1920 ═══ */
.card{width:1080px;height:1920px;background:#fff;position:relative;overflow:hidden;
  display:flex;flex-direction:column}

/* 가이드선 (캡처 전 끄기) */
.safe{position:absolute;left:0;right:0;pointer-events:none;z-index:8}
.safe.top{top:0;height:200px;background:rgba(255,90,90,.10);border-bottom:3px dashed rgba(255,90,90,.6)}
.safe.bot{bottom:0;height:330px;background:rgba(255,90,90,.10);border-top:3px dashed rgba(255,90,90,.6)}
.safe b{position:absolute;left:24px;font-size:22px;color:#C9483F;background:rgba(255,255,255,.85);
  padding:5px 14px;border-radius:6px;font-weight:800}
.safe.top b{bottom:12px} .safe.bot b{top:12px}
.gcrop{position:absolute;left:0;right:0;top:240px;height:1440px;border:3px dashed rgba(90,160,255,.7);
  pointer-events:none;z-index:7;box-sizing:border-box}
.gcrop b{position:absolute;top:10px;right:14px;font-size:22px;color:#2C6FD1;background:rgba(255,255,255,.88);
  padding:5px 14px;border-radius:6px;font-weight:800}
body.clean .safe,body.clean .gcrop{display:none}

.gap{display:inline-block;width:11px}

/* ── 헤더 ── 상단 256px 비움: 인스타 UI(200) + 그리드커버(240) 둘 다 회피 */
.hd{padding:256px var(--side) 0;flex-shrink:0}
.brand{display:inline-flex;align-items:center;gap:9px;margin-bottom:16px}
.brand-ic{width:30px;height:30px;border-radius:9px;background:var(--p);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px}
.brand-t{font-family:var(--f-t);font-size:24px;color:var(--p-d);letter-spacing:-.4px;font-weight:800}
/* 제목 2줄 — 썸네일에서 "뭐지?" 하고 눌러보게 만드는 유일한 요소라 최대한 크게.
   건수 박스는 릴스 재생 아이콘(우측 상단)에 묻히므로 제목 아래 왼쪽으로 내렸다. (사장님 지시 2026-08-04) */
.title{font-family:var(--f-t);color:var(--ink);letter-spacing:-4px;
  line-height:1.02;font-weight:800;white-space:nowrap}
/* 건수 박스를 제목 오른쪽에 붙이고, 제목이 남는 폭을 꽉 채운다.
   건수는 릴스 재생 아이콘에 가려질 수 있지만 제목은 안 잘린다. (사장님 지시 2026-08-04) */
.title{font-size:var(--fs-title);flex:1;min-width:0}
.title .t-d{color:var(--p)}
/* 제목 + 건수 를 한 줄에 (사장님 지시 2026-08-04) */
.hd-main{display:flex;align-items:center;gap:20px;margin:14px 0 18px}
.date{font-family:var(--f-t);display:flex;align-items:baseline;gap:10px}
.date b{font-size:34px;color:var(--p-d);letter-spacing:-1px;line-height:1.1;font-weight:800}
.date span{font-size:26px;color:var(--mute);letter-spacing:-.5px;font-weight:700}
.stats{display:flex;gap:11px;flex-shrink:0}
.stat{border-radius:16px;padding:11px 17px;text-align:center;min-width:102px}
.stat .n{font-family:var(--f-t);font-size:42px;line-height:1;letter-spacing:-1.5px;font-weight:800}
.stat .l{font-size:15px;font-weight:800;margin-top:4px}
.stat.open{background:var(--p-l)} .stat.open .n{color:var(--p)} .stat.open .l{color:var(--p-d)}
.stat.close{background:var(--r-l)} .stat.close .n{color:var(--r)} .stat.close .l{color:var(--r)}

.cols{flex:1;min-height:0;display:flex;padding:0 var(--side);overflow:hidden;margin-bottom:16px}
.col{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.col.open{padding-right:18px}
.col.close{padding-left:18px;border-left:2px solid var(--line)}
.col-hd{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-shrink:0}
.col-t{font-family:var(--f-t);font-size:23px;letter-spacing:-.4px;font-weight:800}
.col.open .col-t{color:var(--p)} .col.close .col-t{color:var(--r)}
.col-n{font-family:var(--f-t);font-size:19px;color:var(--mute);font-weight:700}

/* 한 줄 구조: [상품명 ─── 셀러 마감] */
.it{border-bottom:1px solid var(--line);flex-shrink:0;display:flex;align-items:baseline;gap:10px;
  padding:var(--it-pad) 8px}
.it-nm{flex:1;min-width:0;font-size:var(--fs-item);font-weight:800;color:var(--ink);letter-spacing:-.5px;
  line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-sub{flex-shrink:0;font-size:var(--fs-sub);color:var(--mute);font-weight:700;display:flex;
  align-items:baseline;line-height:1.25;white-space:nowrap}
.it-sl{color:#6E6579}
/* ⚠️ 음수 마진 금지 — .col 이 overflow:hidden 이라 왼쪽 글자가 잘림 */
/* ── 이웃셀러 존 ──
   항목마다 보라 네모를 그리면 어수선하다 → 연속된 이웃셀러를 한 덩어리로 감싼다 (사장님 지시 2026-08-04)
   그라데이션은 html2canvas-pro 에서 정상 렌더된다(2026-08-04 픽셀 실측: 241,231,252 → 250,247,254). */
.nbz{background:linear-gradient(90deg,#EDE0FA 0%,#F3EAFD 58%,rgba(243,234,253,.35) 100%);
  border-radius:12px;margin-bottom:7px;overflow:hidden}
.nbz .it{border-bottom:1px solid rgba(107,74,158,.13)}
.nbz .it:last-child{border-bottom:none}
.nbz .it-nm{color:var(--p-d)}
.nbz .it-sl{color:#7A6394}
/* 옛 방식(항목마다 네모) — 비교용. body.nbold 일 때만 */
body.nbold .nbz{background:none;margin-bottom:0}
body.nbold .nbz .it{background:#EFE4FB;border-radius:9px;border-bottom:none;margin-bottom:3px}
.more{font-family:var(--f-t);font-size:20px;flex-shrink:0;font-weight:700;margin-top:8px;padding-left:8px}
.col.open .more{color:var(--p)} .col.close .more{color:var(--r)}

.cta{flex-shrink:0;margin:0 var(--side) 0;padding:20px 26px;border-radius:18px;
  background:var(--gold-l);border:2px solid #E8D5A8;display:flex;align-items:center;justify-content:space-between}
.cta .t{font-family:var(--f-t);font-size:29px;color:#8A6A2E;font-weight:800;letter-spacing:-.7px}
.cta .s{font-size:22px;color:#96896F;font-weight:600;margin-top:8px;letter-spacing:-.4px}
.cta .s b{font-weight:800;color:#7A5C24}
.cta .u{font-family:var(--f-t);font-size:27px;color:var(--p-d);font-weight:800;white-space:nowrap}
/* 하단 342px — 릴스 재생 화면에선 인스타 UI 가 덮지만, 피드·그리드에선 그대로 보인다.
   흰색으로 비워두면 "밑이 텅 빈" 카드가 되므로 브랜드 띠로 마감한다. (사장님 지적 2026-08-04) */
.pad{height:var(--pad-bot);flex-shrink:0;margin-top:18px;background:var(--p-l);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.pad .s{font-size:26px;color:#7A6394;font-weight:700;letter-spacing:-.6px;margin-bottom:2px}
.pad .w{font-family:var(--f-t);font-size:46px;font-weight:800;color:var(--p-d);letter-spacing:-1.6px}
.pad .m{font-size:24px;color:#8B7BA6;font-weight:700;letter-spacing:-.5px}

/* ── 시안 ── 글씨 크기만 다르다. 항목 수는 fitColumn 이 자동으로 맞춘다 */
/* 글씨를 키우고 항목 여백을 줄이면 한 줄 높이는 오히려 줄어 항목이 더 들어간다 (사장님 지시 2026-08-04) */
body.vA{--fs-item:30px; --fs-sub:21px; --it-pad:2px}     /* 기본 — 30px 상한에서 가장 많이 들어감(25·26건) */
body.vB{--fs-item:27px; --fs-sub:19px; --it-pad:5px}   /* 좀 작게 — 상품명 잘림이 5 → 3건 */
body.vC{--fs-item:21px; --fs-sub:16px; --it-pad:8.1px}   /* 지금 라이브와 동일 */

/* 캡션 패널 */
.cap{max-width:1080px;margin:0 auto 30px;background:#241E2E;border-radius:14px;padding:18px 20px}
.cap h3{font-size:14px;color:#E8C77E;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.cap h3 span{font-size:12px;color:#9E93AE;font-weight:400}
.cap textarea{width:100%;height:320px;background:#161219;color:#D8D0E2;border:1px solid #3A3145;
  border-radius:10px;padding:14px;font-size:12.5px;line-height:1.65;font-family:inherit;resize:vertical}
</style>
</head>
<body class="mini">

<div class="bar">
  <label>날짜</label>
  <input type="date" id="day">
  <button onclick="load()">카드 만들기</button>
  <button onclick="savePng()" id="btnSave">📥 사진 저장</button>
  <button class="ghost" onclick="copyCap()">캡션 복사</button>
  <button class="ghost" onclick="document.body.classList.toggle('mini')">확대 / 축소</button>
  <label style="color:#E8C77E">↓ 글씨 크기</label>
  <select id="vsel" onchange="setV(this.value)" style="background:#6B4A9E;border:1px solid #8B6ABE;color:#fff;border-radius:8px;padding:7px 12px;font-size:14px;font-weight:700;font-family:inherit">
    <option value="A">30px · 기본</option><option value="B">27px · 작게</option><option value="C">21px · 예전</option>
  </select>
  <button class="ghost" onclick="document.body.classList.toggle('clean')">가이드선 켜기 / 끄기</button>
  <div class="st" id="st">불러오는 중…</div>
  <div class="tip">캡처할 땐 <b>확대</b> + <b>가이드선 끄기</b> 후 카드 영역만 잘라내세요 &nbsp;|&nbsp;
    <b style="color:#FF8A8A">빨강</b> 인스타 UI에 가려지는 곳 · <b style="color:#8FC0FF">파랑</b> 프로필 그리드에 보이는 곳</div>
</div>

<div class="slot"><div class="card" id="card"></div></div>

<div class="cap">
  <h3>인스타 캡션 <span id="caplen"></span></h3>
  <textarea id="captxt"></textarea>
</div>

<script>
const SB='https://hycaqsqeogjtbscmzrtm.supabase.co';
const KEY='sb_publishable_u4hR4mdNTSss3kdjFH6R5Q_iuJ2MuGE';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md=d=>d?(+d.slice(5,7))+'/'+(+d.slice(8,10)):'';
const DOW=['일','월','화','수','목','금','토'];

function todayKST(){
  const n=new Date(Date.now()+9*3600*1000);
  return n.toISOString().slice(0,10);
}

async function load(){
  const day=document.getElementById('day').value||todayKST();
  document.getElementById('st').textContent='불러오는 중…';
  try{
    const [gg,pt,cc,wc]=await Promise.all([
      fetch(`${SB}/rest/v1/gonggu?approved=eq.true&or=(open_date.eq.${day},end_date.eq.${day})&select=id,name,influencer,insta,open_date,end_date&limit=500`,{headers:H}).then(r=>r.json()),
      // ⚠️ 노출기간(start_date~end_date)까지 봐야 한다. is_partner 만 보면 계약 끝난 셀러가 이웃셀러로 뜬다.
      //    (2026-08-04: 건이맘이 7/31 로 끝났는데 8/4 카드에 이웃셀러로 나감 — 사장님 지적)
      //    index.html 의 파트너 판정과 같은 기준. 한쪽만 고치면 또 어긋난다.
      fetch(`${SB}/rest/v1/sellers?is_partner=eq.true&select=insta,start_date,end_date`,{headers:H}).then(r=>r.json()),
      fetch(`${SB}/rest/v1/rpc/gonggu_click_counts`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:'{}'}).then(r=>r.json()),
      fetch(`${SB}/rest/v1/rpc/wish_counts`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:'{}'}).then(r=>r.json())
    ]);
    // 카드에 찍힌 날짜 기준으로 노출기간 안에 있는 이웃셀러만. 핸들은 소문자·@제거로 맞춘다(index.html normHandle 과 동일)
    const nh=s=>(s||'').replace('@','').trim().toLowerCase();
    const P=new Set((pt||[])
      .filter(s=>{
        if(s.start_date && day < s.start_date) return false;
        if(s.end_date   && day > s.end_date)   return false;
        return true;
      })
      .map(x=>nh(x.insta)).filter(Boolean));
    // 맘캘린더 본인 공구는 기간과 무관하게 항상 강조 (index.html isMomcal / FIXED_SELLER 와 같은 기준)
    const isMomcal=g=>(g.influencer||'').includes('맘캘린더')
      || ['momcal_','momcalendar','momcal','momcalendar_'].includes(nh(g.insta));
    const C={}; (cc||[]).forEach(x=>C[x.id]=x.clicks);
    const W={}; (wc||[]).forEach(x=>W[x.gonggu_id]=x.cnt);
    const rows=(gg||[]).map(g=>({...g,
      partner:isMomcal(g) || P.has(nh(g.insta)),   // 맘캘린더 본인 + 기간 유효한 이웃셀러
      own:isMomcal(g),                             // 본인 것이 이웃셀러보다 위로
      score:(C[g.id]||0)+(W[g.id]||0),
      seller:(g.influencer&&!g.influencer.startsWith('@'))?g.influencer:(g.insta||'')
    }));
    // 맘캘린더 본인 → 이웃셀러 → 나머지(인기순)
    const sortFn=(a,b)=>(b.own-a.own)||(b.partner-a.partner)||(b.score-a.score)||a.name.localeCompare(b.name,'ko');
    const opens=rows.filter(r=>r.open_date===day).sort(sortFn);
    const ends =rows.filter(r=>r.end_date===day).sort(sortFn);
    window.__DATA=[day,opens,ends];   // 시안 전환 시 재요청 없이 다시 그리기 위해 보관
    render(day,opens,ends);
    makeCaption(day,opens,ends);
    document.getElementById('st').innerHTML=`오픈 <b>${opens.length}</b>건 · 마감 <b>${ends.length}</b>건`;
  }catch(e){
    document.getElementById('st').textContent='불러오기 실패: '+e.message;
  }
}

// 진행 중(오늘 포함 기간) 건수 — 미끼 문구용
async function ongoingCount(day){
  try{
    const r=await fetch(`${SB}/rest/v1/gonggu?approved=eq.true&open_date=lt.${day}&end_date=gte.${day}&select=id`,
      {headers:{...H,Prefer:'count=exact',Range:'0-0'}});
    const cr=r.headers.get('content-range')||'';
    return parseInt(cr.split('/')[1]||'0',10);
  }catch(_){ return 0; }
}

function itemHTML(x,showEnd){
  const sub=showEnd
    ? `<span class="it-sl">${esc(x.seller)}</span><span class="gap"></span><span>~${md(x.end_date)}</span>`
    : `<span class="it-sl">${esc(x.seller)}</span>`;
  return `<div class="it"><div class="it-nm">${esc(x.name)}</div>
    <div class="it-sub">${sub}</div></div>`;
}

async function render(day,opens,ends){
  const d=new Date(day+'T00:00:00');
  const dstr=`${d.getMonth()+1}월 ${d.getDate()}일`, dow=DOW[d.getDay()]+'요일';
  // 썸네일에서도 며칠 카드인지 보이게 제목에 날짜를 넣는다 (사장님 지시 2026-08-04)
  const tdate=`${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;
  const on=await ongoingCount(day);
  const card=document.getElementById('card');
  card.innerHTML=`
    <div class="safe top"><b>상단 200px · UI 가림</b></div>
    <div class="safe bot"><b>하단 330px · 캡션·버튼 가림</b></div>
    <div class="gcrop"><b>그리드 커버 영역</b></div>
    <div class="hd">

      <div class="hd-main">

        <div class="stats">
          <div class="stat open"><div class="n">${opens.length}</div><div class="l">오늘 오픈</div></div>
          <div class="stat close"><div class="n">${ends.length}</div><div class="l">오늘 마감</div></div>
        </div>

    </div>
    <div class="cols">
      <div class="col open"><div class="col-hd"><span class="col-t">오늘 오픈</span><span class="col-n">${opens.length}</span></div>
        <div class="list" id="L1"></div><div class="more" id="M1"></div></div>
      <div class="col close"><div class="col-hd"><span class="col-t">오늘 마감</span><span class="col-n">${ends.length}</span></div>
        <div class="list" id="L2"></div><div class="more" id="M2"></div></div>
    </div>
    <div class="cta">
      <div><div class="t">오늘 진행 중인 공구 ${on}건 중 일부예요</div>
        <div class="s">공구 일정 검색 · 조회는 <b>프로필 링크</b> 맘캘린더 웹사이트에서 가능합니다</div></div>

  fitTitle();   // 12/25(수) 처럼 날짜가 길어져도 한 줄을 유지
  // 칼럼이 꽉 찰 때까지 넣고, 넘치면 하나씩 뺀다 (데이터가 매일 달라도 안전)
  fitColumn(document.getElementById('L1'),document.getElementById('M1'),onePerSeller(opens),true,opens.length);
  fitColumn(document.getElementById('L2'),document.getElementById('M2'),onePerSeller(ends),false,ends.length);
  fitNames();   // 항목 수가 확정된 뒤에 이름을 다듬는다
}

// 제목은 "8/4(화) 오늘 공구 캘린더" 라 날짜 자릿수에 따라 길이가 변한다(12/25(수) 가 가장 김).
// 한 줄이 깨지면 카드가 통째로 어긋나므로 넘치면 폰트를 1px 씩 줄여 맞춘다.
// 제목을 카드 좌우 끝까지 꽉 채운다 — 넘치기 직전 크기를 찾는다 (사장님 지시 2026-08-04)
// 날짜 자릿수에 따라 길이가 달라지므로 고정 px 로는 매일 여백이 들쭉날쭉해진다.
function fitTitle(){
  const t=document.querySelector('.title'); if(!t) return;
  // ⚠️ scrollWidth/clientWidth 로 재면 padding-right 를 텍스트가 침범해도 못 잡는다.
  //    실제 글자 폭(Range)으로 재야 오른쪽 여백이 지켜진다.
  const card=document.querySelector('.card');
  const k=1080/card.getBoundingClientRect().width;      // 미리보기 축소 보정
  const avail=t.clientWidth-(parseFloat(getComputedStyle(t).paddingRight)||0);
  const rng=document.createRange();
  const textW=()=>{ rng.selectNodeContents(t); return rng.getBoundingClientRect().width*k; };
  let px=60; t.style.fontSize=px+'px';
  while(px<170 && textW()<=avail){ px++; t.style.fontSize=px+'px'; }
  t.style.fontSize=(px-1)+'px';          // 넘치기 직전
}

// ── 상품명이 잘릴 때 "무엇을 파는지"를 살린다 ──
// 한국어 상품명은 [브랜드/산지/상태] + [품목] 구조라 뒤가 핵심이다.
// "남해안 자연산 냉장 자숙 돌문어" 를 그냥 자르면 "남해안 자연산 냉장 자숙 돌…" 이 되어
// 정작 돌문어가 안 보인다. → 앞쪽 수식어부터 덜어내 품목이 보이게 한다. (사장님 지시 2026-08-04)
const NAME_DROP=/^(국내산|국산|남해안|서해안|동해안|제주|자연산|햇|생|냉장|냉동|자숙|손질|무항생제|유기농|프리미엄|명품|정품|신상|신제품|NEW|한정|초특가|특가|최저가|역대급|무료배송|대용량|[0-9]+차)$/i;
function fitNames(){
  document.querySelectorAll('.it-nm').forEach(function(el){
    if(el.scrollWidth<=el.clientWidth) return;              // 안 잘리면 그대로
    const full=el.dataset.full||el.textContent;
    el.dataset.full=full;
    let w=full.split(/\s+/);
    // ① 사전에 있는 수식어부터 앞에서 덜어낸다
    while(w.length>1 && NAME_DROP.test(w[0]) && el.scrollWidth>el.clientWidth){
      w.shift(); el.textContent=w.join(' ');
    }
    // ② 그래도 넘치면 앞 단어를 계속 덜어낸다. 품목(마지막 단어)은 끝까지 지킨다.
    while(w.length>1 && el.scrollWidth>el.clientWidth){
      w.shift(); el.textContent=w.join(' ');
    }
    el.title=full;
  });
}

// 이웃셀러는 정렬상 항상 맨 앞에 몰려 있다 → 그 연속 구간만 한 덩어리(.nbz)로 감싼다.
// 항목마다 네모를 그리면 어수선하다는 사장님 지적(2026-08-04) 반영.
function listHTML(arr,showEnd){
  let k=0; while(k<arr.length && arr[k].partner) k++;
  const zone = k ? `<div class="nbz">${arr.slice(0,k).map(x=>itemHTML(x,showEnd)).join('')}</div>` : '';
  return zone + arr.slice(k).map(x=>itemHTML(x,showEnd)).join('');
}
// 한 셀러가 여러 건이면 카드를 독차지한다 → 셀러당 1건만 실어 더 많은 셀러가 보이게 한다.
// 이웃셀러·맘캘린더는 예외(전부 노출). (사장님 지시 2026-08-04)
function onePerSeller(arr){
  const seen=new Set(), out=[];
  arr.forEach(function(x){
    if(x.partner){ out.push(x); return; }
    const key=((x.insta||x.seller||'')+'').toLowerCase();
    if(seen.has(key)) return;
    seen.add(key); out.push(x);
  });
  return out;
}
function fitColumn(listEl,moreEl,arr,showEnd,total){
  const col=listEl.closest('.col');
  const all=(total===undefined)?arr.length:total;   // "+N건 더" 는 그날 전체 건수 기준
  listEl.innerHTML=listHTML(arr,showEnd);
  let n=arr.length;
  moreEl.textContent = (all>n) ? ('+ '+(all-n)+'건 더') : '';
  while(n>0 && col.scrollHeight>col.clientHeight){
    n--;
    listEl.innerHTML=listHTML(arr.slice(0,n),showEnd);
    moreEl.textContent='+ '+(all-n)+'건 더';
  }
}

// ── 해시태그 ── 공구줍줍(팔로워 9천+)이 실제로 쓰는 걸 그대로 따라간다. (사장님 지시 2026-08-04)
// 2026-08-04 공구줍줍 릴스 5개에서 직접 수집. 추정 아님.
//   릴스1 11개 / 릴스2 13개 / 릴스3 12개 / 릴스4 13개 / 릴스5 11개  → 평균 12개
//   5회 전부 등장: 공구일정 · 육아공구 · 육아용품 · 책육아 (+ 자기 브랜드 #공구줍줍)
// ⚠️ 공구줍줍은 #육아스타그램(4610만) #육아소통(4484만) 같은 초대형 태그를 안 쓴다.
//    경쟁이 심해 묻히기 때문. 중형 실무 태그로만 간다.
const TAG_FIXED=['맘캘린더','공구일정','육아공구','육아용품','책육아'];   // 매번 고정(브랜드 + 5/5 등장)
const TAG_ROT=[                                                          // 매일 7개 순환
  '공동구매','육아정보','공구정보','육아템','먹거리공구','살림템','교구',
  '유모차','영양제','아기용품','유아용품','놀잇감','공구오픈','공구모음',
  '오늘의공구','공구추천','육아맘','맘스타그램'
];
function pickTags(day){
  const d=new Date(day+'T00:00:00');
  const seed=Math.floor(d.getTime()/86400000);          // 날짜별 고정 → 같은 날은 항상 같은 태그
  const out=TAG_FIXED.slice();
  for(let i=0;i<7;i++) out.push(TAG_ROT[(seed+i)%TAG_ROT.length]);
  return out.map(t=>'#'+t).join(' ');
}

async function makeCaption(day,opens,ends){
  const d=new Date(day+'T00:00:00');
  const head=`${d.getMonth()+1}월 ${d.getDate()}일(${DOW[d.getDay()]})`;
  const on=await ongoingCount(day);
  // ⚠️ @핸들은 맘캘린더·이웃셀러에만 건다. 나머지는 한글 이름만.
  //    (일반 셀러까지 태그하면 계정 언급이 과해지고, 우리 이웃셀러가 묻힌다 — 사장님 지시 2026-08-04)
  const line=x=>`· ${x.name} — ${x.seller}${x.partner&&x.insta?' @'+x.insta:''}`;
  const nb=opens.filter(x=>x.partner), rest=opens.filter(x=>!x.partner);
  const build=(endCut)=>{
    let s=`📌 저장해두고 필요하실 때 꺼내 보세요\n\n맘캘린더에서 공유드리는\n${head} 오늘 공구 캘린더\n\n오픈 ${opens.length}건 · 마감 ${ends.length}건\n\n━━━━━━━━━━━━━━\n`;
    if(nb.length) s+=`\n💜 맘캘린더 이웃셀러\n`+nb.map(x=>line(x)+` (~${md(x.end_date)})`).join('\n')+'\n';
    s+=`\n🔓 오늘 오픈하는 공구\n`+rest.map(x=>line(x)+` (~${md(x.end_date)})`).join('\n')+'\n';
    const e=ends.slice(0,endCut);
    s+=`\n⏰ 오늘 마감하는 공구\n`+e.map(line).join('\n');
    if(ends.length>endCut) s+=`\n…외 ${ends.length-endCut}건`;
    s+=`\n\n━━━━━━━━━━━━━━\n\n오늘 진행하는 공구리스트 일부 공유입니다\n전체 일정 검색·조회는 프로필 링크 맘캘린더 웹사이트에서 가능해요.ᐟ.ᐟ\n\n💬 찾으시는 공구 있으면 댓글 남겨주세요\n다음번 카드에 반영해서 올려드릴게요.ᐟ.ᐟ\n\n⚠️ 공구 일정은 판매자 사정에 따라 변경되거나 조기 마감될 수 있어요. 구매 전에 해당 셀러 계정에서 한 번 더 확인해 주세요.\n\n${pickTags(day)}`;
    return s;
  };
  // 인스타 캡션 2200자 제한에 맞춰 마감 목록을 자동으로 줄인다
  let cut=ends.length, txt=build(cut);
  while(txt.length>2200 && cut>0){ cut--; txt=build(cut); }
  document.getElementById('captxt').value=txt;
  document.getElementById('caplen').textContent=`${txt.length}자 / 2200자 (마감 ${cut}건 노출)`;
}

// 캡처 없이 1080×1920 PNG 로 바로 저장
async function savePng(){
  const btn=document.getElementById('btnSave');
  const card=document.getElementById('card');
  const wasMini=document.body.classList.contains('mini');
  const wasClean=document.body.classList.contains('clean');
  btn.textContent='저장 중…'; btn.disabled=true;
  document.body.classList.remove('mini');   // 원본 1080×1920 로 되돌리고
  document.body.classList.add('clean');     // 가이드선 끄고 캡처
  await document.fonts.ready;
  await new Promise(r=>setTimeout(r,200));
  try{
    const canvas=await html2canvas(card,{
      width:1080,height:1920,scale:1,
      backgroundColor:'#ffffff',useCORS:true,logging:false,
      windowWidth:1080,windowHeight:1920
    });
    const day=document.getElementById('day').value||todayKST();
    const a=document.createElement('a');
    a.download=`momcal_${day.replace(/-/g,'')}.png`;
    a.href=canvas.toDataURL('image/png');
    a.click();
    document.getElementById('st').innerHTML='사진을 저장했습니다 ✅ <b>1080×1920</b>';
  }catch(e){
    document.getElementById('st').textContent='저장 실패: '+e.message;
  }
  if(wasMini) document.body.classList.add('mini');
  if(!wasClean) document.body.classList.remove('clean');
  btn.textContent='📥 사진 저장'; btn.disabled=false;
}

function copyCap(){
  const t=document.getElementById('captxt');
  t.select(); document.execCommand('copy');
  document.getElementById('st').innerHTML='캡션을 복사했습니다 ✅';
}

// 글씨 시안 전환. 항목 수는 fitColumn 이 다시 계산하므로 카드를 새로 그린다.
function setV(v){
  document.body.classList.remove('vA','vB','vC');
  document.body.classList.add('v'+v);
  try{ localStorage.setItem('mc_reel_v', v); }catch(_){}
  if(window.__DATA) render.apply(null, window.__DATA);   // 데이터 재요청 없이 다시 그리기
}

(function init(){
  const p=new URLSearchParams(location.search);
  document.getElementById('day').value=p.get('d')||todayKST();
  let v=p.get('v'); if(!v){ try{ v=localStorage.getItem('mc_reel_v'); }catch(_){} }
  v = (v==='B'||v==='C') ? v : 'A';               // 기본값 A(권장)
  document.getElementById('vsel').value=v;
  document.body.classList.add('v'+v);
  load();
})();
</script>
